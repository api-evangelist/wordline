        description: Delay in calendar days used to permanently block the card in the future
      scheduledCardBlockingReason:
        type: string
        description: 'Blocking reason used when the card is blocked in the future

          Relevant if a scheduled permanent blocking is requested at the same time as an immediate temporary card blocking.

          Permanent blocking reasons used context of loss/theft are not allowed.'
      transactionId:
        type: string
        description: Indicates the transactionId of the suspicious transaction that has triggered the card blocking.
    title: CardBlockingInformation
  CreateCorporateContractRequest:
    type: object
    required:
    - corporateContract
    properties:
      customers:
        type: array
        description: 'The issuer has to provide all new customers (as person) which don''t already exist in our system in a dedicated list (customers).

          For each new customer, the issuer :

          - can provide an unique external reference: whether this external reference is already assigned to an existing customer for this issuer in our system then the contract creation request is denied

          - must provide mandatory fields and a correlation id that can be used in the contract part to assign the customer, not yet created in our system, as contract owner, root or card account owner, cardholder, etc'
        items:
          $ref: '#/definitions/CreateCorporateContractRequestCustomer'
      companies:
        type: array
        description: 'The issuer has to provide companies which don''t already exist in our system in a dedicated list (companies).

          For each new company, the issuer :

          - can provide an unique external reference: whether this external reference is already assigned to an existing company for this issuer in our system then the contract creation request is denied

          - must provide mandatory fields and a correlation id that can be used in the contract part to assign the company, not yet created in our system, as contract owner, root or card account owner etc'
        items:
          $ref: '#/definitions/CreateCorporateContractRequestCompany'
      corporateContract:
        $ref: '#/definitions/CreateCorporateContractRequestContract'
      addCorporateContractEntities:
        type: array
        description: With the corporate contract creation request it is possible to add an entity (e.g. country, division, department) into the company organization (configured in a product extension).
        items:
          $ref: '#/definitions/CreateCorporateContractRequestAddCorporateContractEntity'
      addCorporateEmployeeCardsAndAccounts:
        type: array
        description: With the corporate contract creation request it is possible to add one or several employees with cards and accounts (configured in a product extension).
        items:
          $ref: '#/definitions/CreateCorporateContractRequestAddCorporateEmployeeCardsAndAccounts'
      addCorporateVcaServiceCardsAndAccounts:
        type: array
        description: With the corporate contract creation request it is possible to add one or several virtual cards and accounts (configured in a product extension).
        items:
          $ref: '#/definitions/CreateCorporateContractRequestAddCorporateVcaServiceCardsAndAccounts'
    title: CreateCorporateContractRequest
