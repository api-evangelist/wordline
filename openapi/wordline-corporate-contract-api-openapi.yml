  /issuers/{issuerId}/corporate-contracts/create-corporate-contract:
    post:
      x-wl-idempotent: true
      x-wl-lra-operation: true
      x-wl-lra-interface: true
      tags:
      - Corporate Contract
      summary: Create a Corporate contract
      operationId: createCorporateContract
      description: "The Create Corporate Contract API allows the creation of a new corporate contract with the company organization (complete or partial structure).\n\nPre-conditions:\nThe request correlation ID, if provided by the issuer, must be unique. In case of re-use of a request correlation ID from an existing corporate contract, the system will return the data from the existing  corporate contract (e.g., if the API call returns a \"time-out\" response, the same request correlation ID can be provided to retrieve corporate contract data from Worldline system for further checks).\nIdempotency is managed by the API; that is, if the request with the same WL-Correlation-ID is sent multiple times, it will be executed only once. The response will be retrieved directly from our system.\n\nDuring the corporate contract creation\n1) The issuer can provide a list of new customers/companies, otherwise the references to existing customers/companies in Worldline system can be used\n2) The issuer has the possibility to create \n- the company organization, by adding 1 or several corporate entities such as countries, divisions, departments (this is also possible afterwards with dedicated API)\n- the employees with their cards and accounts (this is also possible afterwards with dedicated API)\n\nAs a result, the contract is created:\n- with its own reference calculated by our system\n- with the status set to \"Signed\"\n- with entity levels of the company organization (at least the company itself) \n- with the root entity account\n\nThe API response returns \n- the different identifiers related to the  corporate contract, such as the contract itself, contract owner, account owner of an entity\n- if requested identifiers of employee accounts, card contracts, cards and cardholders if any\n(each identifier is composed of the Worldline internal reference and, optionally, the external reference if provided by the issuer in the request)\n\nThe references are used to: retrieve/update/close corporate contracts, retrieve the list of entities for a corporate contract, retrieve the corporate employee account, etc."
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: WL-Correlation-ID
        in: header
        required: false
        type: string
      - name: WL-Origin
        in: header
        required: false
        type: string
      - name: WL-Username
        in: header
        required: false
        type: string
