  CreateCorporateContractRequestVcaServiceCardContract:
    type: object
    description: Data related to each VCA service virtual card contract needs to be provided
    properties:
      issuerCardContractExternalReference:
        type: string
        description: The issuer can provide the external reference for the new card contract.
      cardHolderRequestCorrelationId:
        type: string
        description: 'Not to be provided if the cardholder is the same as the account owner of the default account of the card.

          Otherwise the issuer can provide the correlation id of the new customer which represent the cardholder (defined in the data block CreateCorporateContractRequest.Customer).'
      cardHolderIdentifier:
        description: 'Not to be provided if the cardholder is the same as the account owner of the default account of the card.

          If the cardholder already exists in our system then the issuer has to provide the customer reference or the issuer external customer reference of the existing customer.

          If the cardholder does not exist in our system then cardholderRequestCorrelationId has to be filled.'
        allOf:
        - $ref: '#/definitions/CustomerIdentifier'
      issuerBranchCode:
        type: string
        description: The issuer can provide the issuer branch code of the card contract. If not provided, then the contract issuer branch code is used.
      selectedModels:
        type: array
        description: "The issuer can replace one or several card contract models by providing new card contract model references, otherwise the default ones from the card contract template are used.\n List of possible models that can be replaced:\n • EVENT_FEE_MODEL \n • DISTRIBUTION_MODEL \n • CARD_CREATION_MODEL \n • TECHNOLOGY_AND_APPLICATION_MODEL "
        items:
          $ref: '#/definitions/CardContractModel'
      specificFields:
        type: object
        description: 'The issuer can provide Specific Fields for the new card contract.

          It is a list of external data {"label":"value"} separated by a "," related to the card contract (pass-thru data) that can be provided by e.g. the issuer for information or for usage by other systems.

          Example : {"label1":"value1","label2":"value2"}

          Those provided data have no impact on our system business processes.'
        additionalProperties:
