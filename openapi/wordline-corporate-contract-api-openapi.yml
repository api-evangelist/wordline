definitions:
  CreateCorporateContractRequestContract:
    type: object
    description: The issuer must provide data related to the contract.
    required:
    - issuerProductExternalReference
    - corporateContractRootEntity
    - accountHierarchy
    properties:
      issuerProductExternalReference:
        type: string
        description: The issuer must provide the external reference of the product to be used to create the corporate contract.
      issuerContractExternalReference:
        type: string
        description: 'The issuer can provide an external reference (e.g. used as contract identifier in Issuer''s system). This latter can be used by the issuer to identify, retrieve the contract later, etc.

          If not provided by the issuer, it is filled by default with the contract reference generated by our system.'
      specificFields:
        type: object
        description: "The issuer can provide Specific Fields for the new corporate contract. \nIt is a list of external data {\"label\":\"value\"} separated by a \",\" related to the contract (pass-thru data) that can be provided by e.g. the issuer for information or for usage by other systems.\nExample : {\"label1\":\"value1\",\"label2\":\"value2\"}\nThose provided data have no impact on our system business processes."
        additionalProperties:
          type: string
      contractOwnerRequestCorrelationId:
        type: string
        description: 'If the contract owner does not exist in our system as customer or company, the issuer must provide the correlation id of the new customer related to it (defined in the data block CreateCorporateContractRequest.Customer or in CreateCorporateContractRequest.Customer).

          It can be a customer or a company.'
      contractOwner:
        description: 'If the contract owner already exists in our system as customer or company, the issuer must provide either the customerReference or the issuerCustomerExternalReference related to it.

          If the contract owner does not exist in our system then the contractOwnerRequestCorrelationId has to be filled.

          It can be a customer or a company.'
        allOf:
        - $ref: '#/definitions/CustomerIdentifier'
      statementDuplicatedForCompany:
        type: boolean
        description: 'The issuer can indicate if the company receives a duplicate for statement generated by other paying accounts in the corporate contract (true). By default, the value is false.

          E.g. A card account is paid by the cardholder itself, the company can receive a duplicate of its statement.'
        default: false
      hierarchyDefaultResetCreditLimit:
        type: boolean
        description: The issuer can indicate, for a Corporate contract only, the default value at contract level to be applied for each account if the Open-to-buy should be reset to its maximum Credit limit at Authorization system side as soon as an account cycle is closed. Of course the amount due (minimum payment amount) is considered as to be repaid by the customer by our solution.
      logoReference:
        type: string
        description: The issuer can provide the default logo reference to be used for each card issued from this corporate contract.
      dispatchCode:
        type: string
        description: The issuer can provide the default dispatch code to be used by the embosser to send cards to the right addressee.
      postingAccountForMembershipFee:
        type: string
        description: "The issuer can indicate if the membership fees have to be posted to employee card accounts, intermediate entity account or to the root (usually paid by the company) as default value for the corporate contract.\nPossible values:\n- ROOT_ACCOUNT \n- CARD_ACCOUNT \n- ENTITY_ACCOUNT"
      postingAccountForAccountSetupFee:
        type: string
        description: "The issuer can indicate if the account setup fees have to be posted to employee card account, intermediate entity account or to the root (usually paid by the company) as default value for the corporate contract. \nPossible values:\n- ROOT_ACCOUNT \n- CARD_ACCOUNT \n- ENTITY_ACCOUNT"
      corporateContractLevels:
        type: array
        description: The issuer can provide the list of all levels of a company organization belonging to the corporate contract.
        items:
          $ref: '#/definitions/CreateCorporateContractRequestCorporateContractLevel'
      corporateContractRootEntity:
        $ref: '#/definitions/CreateCorporateContractRequestCorporateContractRootEntity'
      accountHierarchy:
        $ref: '#/definitions/CreateCorporateContractRequestAccountHierarchy'
      postingEntityLevelForMembershipFee:
        type: integer
        description: The Issuer must provide the corresponding entity level for Membership fee posting, when postingAccountForMembershipFee = ENTITY_ACCOUNT
      postingEntityLevelForAccountSetupFee:
        type: integer
        description: The Issuer must provide the corresponding entity level for Account Setup fee posting, when postingAccountForAccountSetupFee = ENTITY_ACCOUNT
      numberOfFreeCardsAccountSetupFee:
        type: integer
        format: int32
        description: 'The issuer can define the number of cards for which account setup fee is not generated  (free cards).

          If not provided, the default value will be used if defined at product level.'
      numberOfFreeCardsMembershipFee:
        type: integer
        format: int32
        description: 'The issuer can define the number of cards for which membership fee is not generated (free cards).

          If not provided, the default value will be used if defined at product level.'
    title: CreateCorporateContractRequest.Contract
  CreateCorporateContractRequestHierarchyOutgoingCreditTransferFeature:
    type: object
    description: 'The issuer can enable or not each different Outgoing Credit Transfer (OCT) options if this latter is enabled and if can be overriden within the reimbursement model.

      E.g. the periodicOCT is allowed in the reimbursement model, default choice, and it is not possible to override this choice. When creating the account hierarchy it is not possible to change this configuration and to not allow this option.'
    properties:
      periodicOctAllowed:
        type: boolean
        description: The issuer can enable or disable the periodic OCT option, if it is possible within the reimbursement model to change the default choice.
      periodicOctType:
        type: string
        description: 'The issuer can override the periodic OCT type if allowed within the reimbursment model.

          Possibles values:

          - DAILY = OCT can be triggered on a daily basis if account is in credit position

          - CYCLIC = OCT can be triggered at cycle closure date if account is in credit position'
      periodicMaxThreshold:
        description: 'The issuer can override the maximum threshold amount defined for periodic OCT if allowed within the reimbursment model, where maximum threshold amount provides lower limit for OCT amount calculation, i.e., if maximum threshold amount is provided, the OCT amount will be equal not to card account credit balance but to account credit balance – maximum threshold amount instead.

          E.g. maximum threshold amount as 10.000€: if credit balance is 15.000€ then OCT is issued with amount equal to 15.000-10.000 = 5.000€. If credit balance is 9.000€ then OCT is issued.'
        allOf:
        - $ref: '#/definitions/Amount'
      octOnContractTerminationAllowed:
        type: boolean
        description: The issuer can enable or disable the OCT on contract termination, if it is possible within the reimbursement model to change the default choice.
      octOnDemandAllowed:
        type: boolean
        description: The issuer can enable or disable the OCT on demand, if it is possible within the reimbursement model to change the default choice.
      octOnDemandLimitType:
        type: string
        description: "The issuer can override the limit type of the OCT on demand if allowed within the reimbursement \nPossible values:\n- BALANCE = a customer can only request an OCT in case of account in credit position\n- OTB (open-to-buy) = a customer can request an OCT from its current Open-to-buy (so from its credit limit allowed by the issuer)"
      octOnContractTerminationType:
        type: string
      octOnAccountTerminationAllowed:
        type: boolean
        description: 'The issuer can enable or not each different Outgoing Credit Transfer (OCT) options if this latter is enabled and if can be overriden within the reimbursement model.

          E.g. the periodicOCT is allowed in the reimbursement model, default choice, and it is not possible to override this choice. When creating the account hierarchy it is not possible to change this configuration and to not allow this option.'
    title: CreateCorporateContractRequest.HierarchyOutgoingCreditTransferFeature
  CustomerIdentifier:
    type: object
    description: Identification of the updated customer either by Issuer customer external reference or by customer reference
    properties:
      customerReference:
        type: string
        description: Reference computed internally by our system
      issuerCustomerExternalReference:
        type: string
        description: Reference provided by the Issuer
    title: CustomerIdentifier
  CardIdentifier:
    type: object
    description: Identification of the card either by Issuer card external reference or by card reference
    properties:
      cardReference:
        type: string
        description: 'Reference of the card generated by our system, unique per platform.

          This reference is calculated sequentially by an internal algorithm on 16 digits (e.g. 2000000000096013).'
      issuerCardExternalReference:
        type: string
        description: 'External reference of the card provided by the issuer or calculated by the system if the external reference generation algorithm is configured for the issuer.

          This reference is unique per issuer and may be used to carry out research and find information.'
    title: CardIdentifier
  ApiResponseEntityAddCorporateEmployeeCardsAndAccountsResponse:
