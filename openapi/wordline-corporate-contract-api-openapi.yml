  CreateCorporateContractRequestAccountHierarchy:
    type: object
    description: The issuer must provide at least data related to the root account when creating the corporate contract.
    properties:
      specificFields:
        type: object
        description: 'The issuer can provide Specific Fields for the new account hierarchy.

          It is a list of external data {"label":"value"} separated by a "," related to the account hierarchy (pass-thru data) that can be provided by e.g. the issuer for information or for usage by other systems.

          Example : {"label1":"value1","label2":"value2"}

          Those provided data have no impact on our system business processes.'
        additionalProperties:
          type: string
      hierarchySelectedModels:
        type: array
        description: "The issuer can provide specific account model reference for the account hierarchy, otherwise the default one is used.\n\nList of possible models:     \n•\treimbursementModel"
        items:
          $ref: '#/definitions/AccountHierarchyModel'
      hierarchyDebitOrderDueDateDelay:
        type: integer
        description: The issuer can override the default debit order due date delay defined in the closure calendar.
      hierarchyPayingAccountType:
        type: string
        description: 'The issuer must provide at hierarchy level the paying account type if it is mandatory in the issuer configuration. Then the same value must be provided for each account within this hierarchy or should be the same defined within the account template.


          Possible values:

          - ROOT_PAYS

          - ITSELF_PAYS


          Examples:

          Case 1: issuer configuration indicates that paying account type is mandatory

          . The payingAccountType must be provided at hierarchy level, e.g. ROOT_PAYS

          . then for each account to be created the payingAccountType is either provided with value as ROOT_PAYS or is retrieved from account template but must have value as ROOT_PAYS


          Case 2: issuer configuration indicates that paying account type is not mandatory

          . It is not mandatory to provide a payingAccountType value at hierarchy level

          . when creating an account the payingAccountType value can be provided or is retrieved from account template (if provided at hierarchy level then each account must have same value than hierarchy)'
      hierarchyOutgoingCreditTransferFeature:
        $ref: '#/definitions/CreateCorporateContractRequestHierarchyOutgoingCreditTransferFeature'
    title: CreateCorporateContractRequest.AccountHierarchy
  CreateCorporateContractRequestPinMailerOrder:
    type: object
    description: 'The issuer can provide data related to a PIN mailer order if it is configured as required in the PIN production model.

      If not provided and required then the default sending mode is retrieved from product configuration.'
    properties:
      specificFields:
        type: object
        description: "The issuer can provide Specific Fields for the PIN mailer order. \nIt is a list of external data {\"label\":\"value\"} separated by a \",\" related to the PIN mailer order (pass-thru data) that can be provided by e.g. the issuer for information or for usage by other systems.\nExample : {\"label1\":\"value1\",\"label2\":\"value2\"}\nThose provided data have no impact on our system business processes."
        additionalProperties:
          type: string
      sendingMode:
        type: string
        description: 'The issuer can provide the sending mode if  a PIN mailer (PIN mailer order) is requested. Default sending mode is retrieved from configuration.

          Example: Normal, Urgent, Ultra Urgent'
      skipPinMailerOrderGeneration:
        type: boolean
        description: 'The issuer can provide data related to a PIN mailer order if it is configured as required in the PIN production model.

          If not provided and required then the default sending mode is retrieved from product configuration.'
    title: CreateCorporateContractRequest.PinMailerOrder
