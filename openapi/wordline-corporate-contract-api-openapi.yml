  CreateCorporateContractRequestAccount:
    type: object
    properties:
      issuerAccountExternalReference:
        type: string
        description: 'The issuer can provide the external reference for the new account (maximum length of 255 characters).This external reference must be unique per issuer.

          If not provided, the external reference is calculated by our system if a generation algorithm is configured at account hierarchy level (ExternalReferenceGeneratorAlgorithm), else the issuer account external reference will be empty.'
      accountTemplateReference:
        type: string
        description: The issuer must provide the account template reference to identify the account to be created (optional if only one account has to be created in the product extension).
      accountOwnerRequestCorrelationId:
        type: string
        description: 'Not to be provided if the account owner is the same as the contract owner.

          Otherwise the issuer can provide the correlation id of the new customer or company which represent the account owner (defined in the data block CreateCorporateContractRequest.Customer or in CreateCorporateContractRequest.Company).'
      accountOwnerIdentifier:
        description: 'Not to be provided if the account owner is the same as the contract owner.

          Otherwise if the account owner already exists in our system then the issuer has to provide the customer reference or the issuer external customer reference of the existing customer or company. If the account owner does not exist in our system then accountOwnerRequestCorrelationId has to be filled.'
        allOf:
        - $ref: '#/definitions/CustomerIdentifier'
      accountGuarantorRequestCorrelationId:
        type: string
        description: The issuer can provide the correlation id of the new customer or company which represent the account guarantor (defined in the data block CreateCorporateContractRequest.Customer or in CreateCorporateContractRequest.Company).
      accountGuarantorIdentifier:
        description: If the account guarantor already exists in our system then the issuer can provide the customer reference or the issuer external customer reference of the existing customer or company.
        allOf:
        - $ref: '#/definitions/CustomerIdentifier'
      selectedModels:
        type: array
        description: "The issuer can provide specific account model reference, otherwise the default one from the account template is used.\n\nList of possible models:\n•\trestrictionModel\n•\tstatementModel\n•\tdebitInterestModel\n•\tcreditInterestModel\n•\ttransactionFeeModel\n•\tmarkupFeeModel                "
        items:
          $ref: '#/definitions/AccountModel'
      closureCalendarReference:
        type: string
        description: The issuer can provide a specific closure calendar reference, otherwise the default one from the account template is used.
      name:
        type: string
        description: 'The issuer can provide the name of the account.

          Refer to Account.name'
      iban:
        type: string
        description: 'Refer to Account.iban

          Has to be provided if the IBAN is configured as mandatory in product configuration.

          If the IBAN is mandatory and the IBAN is not provided, an error occurs

          If the IBAN is mandatory and the IBAN is provided, the IBAN checksum is performed. If the check is ko (=invalid IBAN), an errors occurs.

          If  the IBAN is not mandatory and the IBAN is provided during the account creation, the IBAN is stored as received without any check.'
      ibanOwnerName:
        type: string
        description: 'Refer to Account.ibanOwnerName

          If Issuer expects to produce direct debits and outgoing credit transfers, it is recommended the Iban owner name to be always provided, except if the payment processing channel is SEPA and SEPA mandate UMR is provided (comes from another system).'
      secondIban:
        type: string
        description: Refer to Account.secondIban
      bic:
        type: string
        description: Refer to Account.bic
      sepaIndicator:
        type: boolean
        description: 'The issuer can indicate if the payment processing channel is SEPA or not (also valid for outgoing credit transfer processing channel).

          If payment processing channel is SEPA (SEPA indicator is true) and payment mode is AUTOPAYMENT (Direct debit without confirmation), then SEPA mandate data must be provided.

          SEPA indicator default value is false.'
      sepaMandate:
        $ref: '#/definitions/CreateCorporateContractRequestSepaMandate'
      creditLimitAmount:
        description: The issuer can provide a specific credit limit amount (within the minimum/maximum range defined in the restriction model for the credit limit) to replace the default permanent credit limit value.
        allOf:
        - $ref: '#/definitions/Amount'
      accountMembershipNumber1:
        type: string
        description: The issuer can provide the membership number 1 of the account.
      accountMembershipNumber2:
        type: string
        description: The issuer can provide the membership number 2 of the account.
      specificFields:
        type: object
        description: "The issuer can provide Specific Fields for the new account. \nIt is a list of external data {\"label\":\"value\"} separated by a \",\" related to the account (pass-thru data) that can be provided by e.g. the issuer for information or for usage by other systems.\nExample : {\"label1\":\"value1\",\"label2\":\"value2\"}\nThose provided data have no impact on our system business processes."
        additionalProperties:
          type: string
      payingAccountType:
        type: string
        description: 'The paying account type can be provided by the issuer or if not provided it is retrieved from the account template.

          In case it is mandatory in the issuer configuration then the provided value should be the same than the one provided for the account hierarchy.


          Possible values:

          - ROOT_PAYS

          - ITSELF_PAYS


          See examples described for CreateCorporateContractRequest.AccountHierarchy.hierarchyPayingAccountType


          In case no payingAccountType is provided on the account hierarchy, then the possible values are:

          - ROOT_PAYS

          - ITSELF_PAYS

          - ENTITY_PAYS'
      paymentMode:
        type: string
        description: 'The payment mode can be provided by the issuer or if not provided it is retrieved from the account template.


          Possible values:

          - CARDHOLDER_DETERMINED : customer repays its debt by itself (fund transfer to the issuer)

          - AUTOPAYMENT : customer repays its debt via Direct Debit (issued by issuer and paid automatically after X days)'
      noOtbCheck:
        type: boolean
        description: 'The issuer can indicate if the Open-to-buy (OTB) must be checked or not when an authorization (authorization system) or a transaction (clearing) is processed.

          This can be used when there is no need to check the OTB of an account (e.g. for certain levels of a corporate organization).'
      resetCreditLimit:
        type: boolean
        description: 'The issuer can indicate if the Open-to-buy should be reset to its maximum Credit limit at Authorization system side as soon as a account cycle is closed. Of course the amount due (minimum payment amount) is considered as to be repaid by the customer by our solution.

          The default behavior is retrieved from the contract (Corporate only)'
      liabilityType:
        type: string
        description: The issuer can provide the liability type of the new account (free text). This liability type can be different for each issuer and is stored in our solution for information purpose (e.g. can be used for reporting), not used by any business process.
      accountDebitOrderDueDateDelay:
        type: integer
        description: The issuer can provide the debit order due date delay for the new account (number of days). This delay is used to calculate the Direct Debit payment date for each cycle of repayment.
      requestCorrelationId:
        type: string
        description: 'Unique alias provided by the issuer for each new account (Conditional).

          During the corporate contract creation processing, this alias is used to assign the new account to address usage provided in the request (same value as the value provided in entityRequestCorrelationId defined in the data block CreateCorporateContractRequest.AddressUsage)'
      creditBureauContractFlag:
        type: boolean
        description: The issuer can specify if the Credit Bureau part of the contract has been signed by the credit card owner (pay later).Only for an employee account.
      corporateContractAddOnsSubscriptions:
        type: array
        description: The issuer can subscribe to additional services (e.g. new letter, travel insurance)
        items:
          $ref: '#/definitions/CreateCorporateContractRequestAddOnSubscription'
      payingEntityAccountIdentifier:
        description: The field is used to identify the corresponding entity when the payingAccountType = 'ENTITY_PAYS'. This field provides the possibility to find the exact entity account by its account identifier.
        allOf:
        - $ref: '#/definitions/AccountIdentifier'
      payingEntityCompanyExternalReference:
        type: string
        description: The field is used to identify the corresponding entity when the payingAccountType = 'ENTITY_PAYS'. This field provides the possibility to find the exact entity account by the external reference of the corporate entity.
      payingAccountEntityLevel:
        type: integer
        description: The field is used to identify the corresponding entity when the payingAccountType = 'ENTITY_PAYS'. This field provides the possibility to find the exact entity account by its level number.
      workingCurrencyCode:
        type: string
        description: 'Working currency code of the account

          Ex : EUR for Euro, USD for dollar, etc.


          The working currency must be allowed by the product.

          If not provided, the default currency of the product is set.

          All accounts of the same account hierarchy must have the same currency. '
    title: CreateCorporateContractRequest.Account
