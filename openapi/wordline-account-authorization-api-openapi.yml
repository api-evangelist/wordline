          - Cancelled (ReserveBillingAmount has been entirely cancelled (due to clearing or manual intervention) and is no longer part of the account reserve; AccountReserveBillingAmount is zero)

          - Other

          Can only be present in case BusinessCaseType is FinancialRequest. Absent in case Cancelled is true or all associated authorizations have been declined. The caller must be prepared to receive new values in this field at any time.'
      businessCaseIdentifier:
        description: Business case to which the transaction belongs. The provided information reflects its status after transaction completion. A business case is a group of transactions which logically belong together (e.g. original transaction and reversal of original transaction)
        allOf:
        - $ref: '#/definitions/BusinessCaseIdentifier'
      businessCaseType:
        type: string
        example: List 'FinancialRequest', 'FinancialVerification', 'AccountVerification', 'BalanceEnquiry', 'StatementEnquiry', 'PinChange', 'PinUnblock', 'PickUp', 'CardReturn', 'Reconciliation', 'ReserveUpdate', 'ReserveExpiry', 'CardFileOperation', 'TokenLifeCycleEvent', 'Other', 'Unknown'
        description: This value is the same for all transactions belonging to the same business case.
      cardAcceptorCity:
        type: string
        description: 'maxLength: 60

          City the acceptor is resident (e.g. Frankfurt).Often exchanged with other applications via ISO 8583 field DE 43.'
      cardAcceptorCountry:
        type: string
        description: Generic.AlphaNumericAcceptorCountryCode for the initial authorization.
      cardAcceptorName:
        type: string
        description: 'maxLength: 50

          This field is not strictly defined and therefore variations are possible. Usually it is the merchant name as known to the cardholder. For ATMs it could be the location or the branch number. Often exchanged with other applications via ISO 8583 field DE 43.'
      financialType:
        type: string
        example: List 'Cash', 'CashRefund', 'QuasiCash', 'QuasiCashRefund', 'Purchase', 'Refund', 'Load', 'Unload', 'FundsTransferCredit', 'FundsTransferDebit', 'OtherCredit', 'OtherDebit', 'Deposit', 'DepositRefund', 'Unknown'
        description: Provides more details on the operation in case BusinessCaseType is FinancialRequest or FinancialVerification.This value is the same for all transactions belonging to the same financial business case.
      firstAuthorizationIdentifier:
        $ref: '#/definitions/AuthorizationIdentifier'
      firstAuthorizationTransactionDate:
        type: string
        example: '2022-04-01T20:38:39Z'
        description: 'Time when the transaction referenced by FirstTxnId has been processed. Format: YYYY-MM-ddThh:mm:ssZ.'
      issuerId:
        type: string
        description: Not used, will be removed
      lastAuthorizationIdentifier:
        $ref: '#/definitions/AuthorizationIdentifier'
      lastAuthorizationTransactionDate:
        type: string
        example: '2022-04-01T20:38:39Z'
        description: 'Time when the transaction referenced by LastTxnId has been processed. Format: YYYY-MM-ddThh:mm:ssZ.'
      merchantCategoryCode:
        type: string
        description: 'maxLength: 4

          Category code assigned to the acceptor (MCC).'
      reserveAmount:
        description: 'minimum: -1000000000000000000

          maximum: 1000000000000000000

          Reserved amount in transaction (acceptor) currency of initial authorization. A positive value is a debit for the cardholder and a credit for the acceptor whereas a negative value is a credit for the cardholder and a debit for the acceptor. Similar semantic as STNI field Generic.TotalAmount.'
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      reserveBillingAmount:
        description: 'minimum: -1000000000000000000

          maximum: 1000000000000000000

          Reserved amount in billing (cardholder) currency of initial authorization. A positive value is a debit for the cardholder and a credit for the acceptor whereas a negative value is a credit for the cardholder and a debit for the acceptor. Similar semantic as STNI field Generic.TotalBillingAmount.'
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      status:
        type: string
        description: Status of the business case
    title: BusinessCase
  AuthorizationBusinessCaseIdentifier:
    type: object
    required:
    - businessCaseId
    properties:
      businessCaseId:
        type: string
        description: 'Business case to which the transaction belongs.

          The provided information reflects its status after transaction completion.

          A business case is a group of transactions which logically belong together (e.g. original transaction and reversal of original transaction)'
    title: AuthorizationBusinessCaseIdentifier
  GetAuthorizationResponse:
    type: object
    properties:
      accountIdentifier:
        $ref: '#/definitions/AccountIdentifier'
      approvalCode:
        type: string
        description: 'maxLength: 10

          Code computed at time of authorization and returned to requestor in case of an approval.Often exchanged with other applications via ISO 8583 field DE 38.'
      authorizationBusinessCaseIdentifier:
        $ref: '#/definitions/AuthorizationBusinessCaseIdentifier'
      authorizationIdentifier:
        $ref: '#/definitions/AuthorizationIdentifier'
      businessCaseType:
        type: string
        example: List 'FinancialRequest', 'FinancialVerification', 'AccountVerification', 'BalanceEnquiry', 'StatementEnquiry', 'PinChange', 'PinUnblock', 'PickUp', 'CardReturn', 'Reconciliation', 'ReserveUpdate', 'ReserveExpiry', 'CardFileOperation', 'TokenLifeCycleEvent', 'Other', 'Unknown'
        description: 'This value is the same for all transactions belonging to the same business case. '
      cardAcceptorCity:
        type: string
        description: 'maxLength: 60

          City the acceptor is resident (e.g. Frankfurt).'
      cardAcceptorCountry:
        type: string
        description: Generic.AlphaNumericAcceptorCountryCode for the initial authorization.
      cardAcceptorName:
        type: string
        description: 'maxLength: 50

          This field is not strictly defined and therefore variations are possible. Usually it is the merchant name as known to the cardholder. For ATMs it could be the location or the branch number. Often exchanged with other applications via ISO 8583 field DE 43.'
      cardReference:
        type: string
        description: 'minLength: 1

          maxLength: 100

          Card Reference from IBO.'
      cardScheme:
        type: string
        example: List 'VISA', 'MasterCard', 'Diners', 'Amex', 'JCB', 'UnionPay', 'RuPay', 'Eftpos', 'Twint', 'Alipay', 'WeChatPay', 'Payconiq', 'PayPal', 'Other', 'Unknown'
        description: Indicates the card scheme to which the card belongs to.
      cashbackAmount:
        description: 'maximum: 1000000000000000000

          Portion of EnquiredAmount dedicated to cashback. The sign is the same as the one of EnquiredAmount.  '
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      cashbackBillingAmount:
        description: 'maximum: 1000000000000000000

          Similar to CashbackAmount but in billing (cardholder) currency. '
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      collection:
        type: boolean
        description: Not used, will be removed
      comment:
        type: string
        description: 'maxLength: 255

          Arbitrary textual remark given when transaction was triggered.'
      declineReason:
        type: string
        example: List 'CardBlocked', 'FraudSuspected', 'Cvv2Missing', 'TechnicalError', 'OverLimit', 'OverUsageLimit', 'OverCreditLimit', 'Cvv2Wrong', 'CvvWrong', 'CavvWrong', 'CardUnknown', 'CardExpired', 'PinWrong', 'PinTriesOverLimit', 'PinTriesAlmostOverLimit', 'RestrictionViolated', 'ArqcWrong', 'TxnNotAllowed', 'MerchantUnknown', 'ReplyTimeout', 'Other', 'Unknown'
        description: 'Depending on the interface configuration on WLP FO either this field or MappedResultCode will be populated in all notifications. '
      declined:
        type: boolean
        description: Indicates whether the transaction was declined or approved.
      deltaAmount:
        description: 'maximum: 1000000000000000000

          Increase or decrease from the old to the new total amount of business case in transaction (acceptor) currency. That is: New TotalAmount = Old TotalAmount + DeltaAmount.'
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      deltaBillingAmount:
        description: 'maximum: 1000000000000000000

          Similar to DeltaAmount but in billing (cardholder) currency.'
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      enquiredAmount:
        description: 'maximum: 1000000000000000000

          Requested amount in transaction (acceptor) currency. A positive value is a debit for the cardholder and a credit for the acceptor. Whereas a negative value is a credit for the cardholder and a debit for the acceptor. A partial approval (including purchase only) can be detected by comparing EnquiredAmount with ApprovedAmount. In case they are different it is a partial approval.'
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      enquiredBillingAmount:
        description: 'maximum: 1000000000000000000

          Similar to EnquiredAmount but in billing (cardholder) currency.'
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      entryMode:
        type: string
        example: List 'KeyEntry', 'Magstripe', 'Chip', 'ContactlessMagstripe', 'ContactlessChip', 'BarCode', 'Ocr', 'File', 'AutoEntry', 'Other', 'Unknown'
        description: Indicates the way the card data was captured.
      environmentType:
        type: string
        example: List 'POI', 'MailOrder', 'PhoneOrder', 'ECommerce', 'Voice', 'Other', 'Unknown'
        description: Indicates the environment in which the transaction took place.
      financialType:
        type: string
        example: List 'Cash', 'CashRefund', 'QuasiCash', 'QuasiCashRefund', 'Purchase', 'Refund', 'Load', 'Unload', 'FundsTransferCredit', 'FundsTransferDebit', 'OtherCredit', 'OtherDebit', 'Deposit', 'DepositRefund', 'Unknown'
        description: Provides more details on the operation in case BusinessCaseType is FinancialRequest or FinancialVerification.This value is the same for all transactions belonging to the same financial business case.
      issuerId:
        type: string
        description: Not used, will be removed
      mappedSecurityTypeId:
        type: string
        description: Not used, wll be removed
      maskedPan:
        type: string
        description: 'maxLength: 28

          Masked card number (PAN). Only the first 6 and the last 4 digits are visible. All other digits are replaced by a hash character.

          Absent if the card number is in scope of PCI and the interface is configured for suppressing the masked card number.'
      merchantCategoryCode:
        type: string
        description: 'maxLength: 4

          Category code assigned to the acceptor (MCC).'
      onPremisesOfAcceptor:
        type: boolean
        example: List 'OnPremisesOfAcceptor', 'OffPremisesOfAcceptor', 'OnPremisesOfCardholder', 'OffPremisesOfCardholder', 'Other', 'Unknown'
        description: Indicates the location of the terminal
      onlinePinCheckResult:
        type: string
        example: List 'Correct', 'Wrong', 'Unable', 'Other', 'Unknown'
        description: OnlinePinCheckResult. See values in examples.
      openToBuy:
        description: 'maximum: 1000000000000000000

          Available line of the cardholder after transaction completion in billing currency.'
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      operationDate:
        type: string
        format: date-time
        example: '2022-04-01T20:38:39Z'
        description: 'minLength: 14

          maxLength: 14

          Time at which the transaction took place. The format is YYYY-MM-ddThh:mm:ssZ and the time zone is the one of the merchant. It is only guaranteed that the string consists of decimal digits. But it is not ensured the value is valid. For example the month could be outside of the range from 01 to 12.'
      pan:
        type: string
        example: '2022-04-01T20:38:39Z'
        description: 'maxLength: 28

          Clear card number (PAN).

          Absent if the card number is in scope of PCI and the interface is configured for suppressing the clear card number.'
      panExpiryDate:
        type: string
        description: Expiry date of card/plastic in the format YYYYMM.It is only guaranteed that the string consists of decimal digits. But it is not ensured the value is valid. For example the month could be outside of the range from 01 to 12.
      panReference:
        type: string
        description: 'maxLength: 100

          Alternative card number, coming from IBO. This card number is optionally used by WLP FO instead of the actual card number (PAN) when communicating with external systems.'
      panSequenceNumber:
        type: string
        description: 'maximum: 9999

          Sequence number of card.'
      reserveAmount:
        description: 'minimum: -1000000000000000000

          maximum: 1000000000000000000

          Reserved amount in transaction (acceptor) currency of initial authorization. A positive value is a debit for the cardholder and a credit for the acceptor whereas a negative value is a credit for the cardholder and a debit for the acceptor. Similar semantic as STNI field Generic.TotalAmount.'
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      resultCode:
        type: string
        description: 'maxLength: 20

          Final and detailed result code of transaction. Any automated evaluation of this information has to consider that new result codes are introduced often and even existing ones can disappear or change. Therefore this data element should be used for information purpose only.'
      resultDescription:
        type: string
        description: 'maxLength: 300

          English text explaining the meaning of ResultCode.'
      resultType:
        type: string
        example: List 'Approval', 'Decline', 'Referral', 'PickUp', 'Other'
        description: Approval (transaction approved),Decline (transaction refused),Referral (transaction refused),PickUp (transaction refused),Other (transaction refused).
      securityTypeId:
        type: integer
        format: int32
        description: 'maximum: 999999999

          Internal unique identifier of security type in WLP FO.'
      securityTypeName:
        type: string
        description: 'maxLength: 100

          English text explaining SecurityTypeId.'
      standIn:
        type: boolean
        description: Indicates whether WLP FO has stood in for the switch-out peer (request) or whether the transaction is managed in store-and-forward mode towards the switch-out peer (advice).This field is only present if the field SwitchOutPeerId is present.
      surchargeAmount:
        description: 'maximum: 1000000000000000000

          Portion of EnquiredAmount dedicated to surcharge imposed by the acceptor or the acquirer. The sign is the same as the one of EnquiredAmount.'
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      surchargeBillingAmount:
        description: 'maximum: 1000000000000000000

          Similar to SurchargeAmount but in billing (cardholder) currency.'
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      terminalId:
        type: string
        description: 'maxLength: 20

          Id of terminal.'
      terminalType:
        type: string
        example: List 'Attended', 'Atm', 'PetrolPump', 'Adm', 'LimitedAmountAdm', 'Mobile', 'InFlight', 'ChargingStation', 'Other', 'Unknown'
        description: Indicates the type of the terminal.
      totalAmount:
        description: 'maximum: 1000000000000000000

          Overall reservation/authorization (if capturing is not finalized) or capture amount (if capturing is finalized) of business case in transaction (acceptor) currency after transaction completion. A positive value is a debit for the cardholder and a credit for the acceptor. Whereas a negative value is a credit for the cardholder and a debit for the acceptor.'
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      totalBillingAmount:
        description: 'maximum: 1000000000000000000

          Similar to TotalAmount but in billing (cardholder) currency.'
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      transactionDate:
        type: string
        example: '2022-04-01T20:38:39Z'
        description: Time and date at which the transaction took place. The format is YYYY-MM-ddThh:mm:ssZ and the time zone is the one of the merchant. It is only guaranteed that the string consists of decimal digits. But it is not ensured the value is valid. For example the month could be outside of the range from 01 to 12.
      transactionSubType:
        type: string
        example: List 'Request', 'Advice', 'Other', 'Unknown'
        description: 'Indicates the sub-type of the performed operation for some of the listed TransactionType_2 and TransactionType_3 values.

          A request asks to business-wise check whether the operation is allowed and can actually be performed whereas an advice is a notification which has to be treated in a suitable way and can not be declined because of business reasons.

          In case TransactionType_3 is Action possible values are Request and Advice. If TransactionType_3 has the value Reversal it is always Advice and for Confirmation it is all the time Unknown.

          The definition is almost the one of the STRAPI field transactionSubType. The only difference is that confirmations on STRAPI are flagged (implicitly) as advices whereas the value here is Unknown.'
      transactionType:
        type: string
        example: List 'Authorization', 'Reversal', 'Confirmation', 'Rollback', 'ReserveUpdate', 'ReserveExpiry', 'Other', 'Unknown
        description: DEPRECATED. Use the field TransactionType2. Indicates the type of the performed operation for some of the listed BusinessCaseType values.
      transactionType2:
        type: string
        example: List 'Authorization', 'Reversal', 'Confirmation', 'Rollback', 'ReserveUpdate', 'ReserveExpiry', 'Other', 'Unknown
        description: Indicates the type of the performed operation for some of the listed BusinessCaseType values.
      transactionTypeId:
        type: string
        description: 'maximum: 999999999

          Internal unique identifier of transaction type in WLP FO.'
      transactionTypeName:
        type: string
        description: 'maxLength: 100

          English text explaining TransactionTypeId.'
      velocityLimitChecks:
        type: array
        description: Information on velocity check evaluations done by WLP FO.
        items:
          $ref: '#/definitions/VelocityLimitCheck'
    title: GetAuthorizationResponse
