  Authorization:
    type: object
    properties:
      accountIdentifier:
        $ref: '#/definitions/AccountIdentifier'
      approvalCode:
        type: string
        description: 'maxLength: 10

          Code computed at time of authorization and returned to requestor in case of an approval.'
      authorizationBusinessCaseIdentifier:
        $ref: '#/definitions/AuthorizationBusinessCaseIdentifier'
      authorizationIdentifier:
        $ref: '#/definitions/AuthorizationIdentifier'
      businessCaseType:
        type: string
        description: 'examples: List [ "FinancialRequest", "FinancialVerification", "AccountVerification", "BalanceEnquiry", "StatementEnquiry", "PinChange", "PinUnblock", "PickUp", "CardReturn", "Reconciliation", "ReserveUpdate", "ReserveExpiry", "CardFileOperation", "TokenLifeCycleEvent", "Other", "Unknown" ]

          This value is the same for all transactions belonging to the same business case. '
      cardAcceptorCity:
        type: string
        description: 'maxLength: 60

          City the acceptor is resident (e.g. Frankfurt).'
      cardAcceptorCountry:
        type: string
        description: "minLength: 3\nmaxLength: 3\nISO 3166 numeric country code of the acceptor. \nExample: 076 = Brazil."
      cardAcceptorName:
        type: string
        description: 'maxLength: 50

          This field is not strictly defined and therefore variations are possible.

          Usually it is the merchant name as known to the cardholder.

          For ATMs it could be the location or the branch number. '
      cardReference:
        type: string
        description: 'minLength: 1

          maxLength: 100

          Card Reference from IBO.'
      cardScheme:
        type: string
        description: 'examples: List [ "VISA", "MasterCard", "Diners", "Amex", "JCB", "UnionPay", "RuPay", "Eftpos", "Twint", "Alipay", "WeChatPay", "Payconiq", "PayPal", "Other", "Unknown" ]

          Indicates the card scheme to which the card belongs to.'
      cashbackAmount:
        description: 'maximum: 1000000000000000000

          Portion of EnquiredAmount dedicated to cashback. The sign is the same as the one of EnquiredAmount.'
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      cashbackBillingAmount:
        description: 'maximum: 1000000000000000000

          Similar to CashbackAmount but in billing (cardholder) currency. '
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      comment:
        type: string
        description: 'maxLength: 255

          textual remark given when transaction was triggered. '
      declineReason:
        type: string
        description: 'Examples: List [ "CardBlocked", "FraudSuspected", "Cvv2Missing", "TechnicalError", "OverLimit", "OverUsageLimit", "OverCreditLimit", "Cvv2Wrong", "CvvWrong", "CavvWrong", "CardUnknown", "CardExpired", "PinWrong", "PinTriesOverLimit", "PinTriesAlmostOverLimit", "RestrictionViolated", "ArqcWrong", "TxnNotAllowed", "MerchantUnknown", "ReplyTimeout", "Other", "Unknown" ]'
      declined:
        type: boolean
        description: Indicates whether the transaction was declined or approved.
      deltaAmount:
        description: 'maximum: 1000000000000000000

          Increase or decrease from the old to the new total amount of business case in transaction (acceptor) currency.

          That is: New TotalAmount = Old TotalAmount + DeltaAmount. '
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      deltaBillingAmount:
        description: 'maximum: 1000000000000000000

          Similar to DeltaAmount but in billing (cardholder) currency. '
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      enquiredAmount:
        description: 'maximum: 1000000000000000000

          Requested amount in transaction (acceptor) currency. A positive value is a debit for the cardholder and a credit for the acceptor.

          Whereas a negative value is a credit for the cardholder and a debit for the acceptor.

          A partial approval (including purchase only) can be detected by comparing EnquiredAmount with ApprovedAmount.

          In case they are different it is a partial approval. '
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      enquiredBillingAmount:
        description: 'maximum: 1000000000000000000

          Similar to EnquiredAmount but in billing (cardholder) currency. '
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      entryMode:
        type: string
        description: 'Examples: List [ "KeyEntry", "Magstripe", "Chip", "ContactlessMagstripe", "ContactlessChip", "BarCode", "Ocr", "File", "AutoEntry", "Other", "Unknown" ]

          Indicates the way the card data was captured.'
      environmentType:
        type: string
        description: 'Examples: List [ "POI", "MailOrder", "PhoneOrder", "ECommerce", "Voice", "Other", "Unknown" ]

          Indicates the environment in which the transaction took place.'
      financialType:
        type: string
        description: 'Examples: List [ "Cash", "CashRefund", "QuasiCash", "QuasiCashRefund", "Purchase", "Refund", "Load", "Unload", "FundsTransferCredit", "FundsTransferDebit", "OtherCredit", "OtherDebit", "Deposit", "DepositRefund", "Unknown" ]

          Provides more details on the operation in case BusinessCaseType is FinancialRequest or FinancialVerification.This value is the same for all transactions belonging to the same financial business case. '
      issuerId:
        type: string
        description: Not used, will be removed
      mappedSecurityTypeId:
        type: string
        description: Not used, will be removed
      maskedPan:
        type: string
        description: 'maxLength: 28

          Masked card number (PAN). Only the first 6 and the last 4 digits are visible. All other digits are replaced by a hash character.

          Absent if the card number is in scope of PCI and the interface is configured for suppressing the masked card number.'
      merchantCategoryCode:
        type: string
        description: 'maxLength: 4

          MCategory code assigned to the acceptor (MCC).'
      onPremisesOfAcceptor:
        type: boolean
        description: Indicates if authorization was done in the location of the terminal
      onlinePinCheckResult:
        type: string
        description: 'Examples: List [ "Correct", "Wrong", "Unable", "Other", "Unknown" ]'
      openToBuy:
        description: 'maximum: 1000000000000000000

          Available line of the cardholder after transaction completion in billing currency. '
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      operationDate:
        type: string
        format: date-time
        description: "minLength: 14\nmaxLength: 14\nDate and time at which the transaction took place. \nThe format is YYYYMMDDhhmmss and the time zone is the one of the merchant. "
      pan:
        type: string
        description: 'maxLength: 28

          Clear card number (PAN).

          Absent if the card number is in scope of PCI and the interface is configured for suppressing the clear card number.'
      panExpiryDate:
        type: string
        description: 'minLength: 6

          maxLength: 6

          Expiry date of card/plastic in the format YYYYMM.It is only guaranteed that the string consists of decimal digits.'
      panReference:
        type: string
        description: 'maxLength: 100

          Alternative card number, coming from IBO.

          This card number is optionally used by WLP FO instead of the actual card number (PAN) when communicating with external systems.'
      panSequenceNumber:
        type: string
        description: 'maximum: 9999

          Sequence number of card. '
      reserveAmount:
        description: "minimum: -1000000000000000000\nmaximum: 1000000000000000000\nReserved amount in transaction (acceptor) currency of initial authorization. \nA positive value is a debit for the cardholder and a credit for the acceptor whereas a negative value is a credit for the cardholder and a debit for the acceptor. "
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      resultCode:
        type: string
        description: 'maxLength: 20

          Final and detailed result code of transaction. Any automated evaluation of this information has to consider that new result codes are introduced often and even existing ones can disappear or change.

          Therefore this data element should be used for information purpose only. '
      resultDescription:
        type: string
        description: 'maxLength: 300

          English text explaining the meaning of ResultCode.'
      resultType:
        type: string
        description: 'Approval (transaction approved),Decline (transaction refused),Referral (transaction refused),PickUp (transaction refused),Other (transaction refused). '
      securityTypeId:
        type: integer
        format: int32
        description: 'maximum: 999999999

          Internal unique identifier of security type in WLP FO. '
      securityTypeName:
        type: string
        description: 'maxLength: 100

          English text explaining SecurityTypeId.'
      standIn:
        type: boolean
        description: 'Indicates whether WLP FO has stood in for the switch-out peer (request) or whether the transaction is managed in store-and-forward mode towards the switch-out peer (advice).

          This field is only present if the field SwitchOutPeerId is present.  '
      surchargeAmount:
        description: 'maximum: 1000000000000000000

          Portion of EnquiredAmount dedicated to surcharge imposed by the acceptor or the acquirer.

          The sign is the same as the one of EnquiredAmount.  '
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      surchargeBillingAmount:
        description: 'maximum: 1000000000000000000

          Similar to SurchargeAmount but in billing (cardholder) currency.  '
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      terminalId:
        type: string
        description: 'maxLength: 20

          Id of terminal.'
      terminalType:
        type: string
        description: 'Examples: List [ "Attended", "Atm", "PetrolPump", "Adm", "LimitedAmountAdm", "Mobile", "InFlight", "ChargingStation", "Other", "Unknown" ]

          Indicates the type of the terminal.'
      totalAmount:
        description: "maximum: 1000000000000000000\nOverall reservation/authorization (if capturing is not finalized) or capture amount (if capturing is finalized) of business case in transaction (acceptor) currency after transaction completion. \nA positive value is a debit for the cardholder and a credit for the acceptor.\nWhereas a negative value is a credit for the cardholder and a debit for the acceptor.  "
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      totalBillingAmount:
        description: 'maximum: 1000000000000000000

          Similar to TotalAmount but in billing (cardholder) currency.  '
        allOf:
        - $ref: '#/definitions/MonetaryAmountAlphaCurrency'
      transactionDate:
        type: string
        description: "minLength: 23\nmaxLength: 23\nTime and date at which the transaction took place. \nThe format is 2012-12-31T22:00:00.000 and the time zone is the one of the merchant. \nIt is only guaranteed that the string consists of decimal digits. \nBut it is not ensured the value is valid. For example the month could be outside of the range from 01 to 12."
      transactionSubType:
        type: string
        description: 'Examples: List [ "Request", "Advice", "Other", "Unknown" ]

          Indicates the sub-type of the performed operation for some  Transaction types.'
      transactionType:
        type: string
        description: 'DEPRECATED. Use the field TransactionType2. insteadExamples: List [ "Authorization", "Reversal", "Confirmation", "Rollback", "ReserveUpdate", "ReserveExpiry", "Other", "Unknown" ]

          Indicates the type of the performed operation for some of the listed BusinessCaseType values.'
      transactionType2:
        type: string
        description: 'Examples: List [ "Authorization", "Reversal", "Confirmation", "Rollback", "ReserveUpdate", "ReserveExpiry", "Other", "Unknown" ]

          Indicates the type of the performed operation for some of the listed BusinessCaseType values.'
      transactionTypeId:
        type: string
        description: 'maximum: 999999999

          Internal unique identifier of transaction type in WLP FO.'
      transactionTypeName:
        type: string
        description: 'maxLength: 100

          English text explaining TransactionTypeId.'
      velocityLimitChecks:
        type: array
        items:
          $ref: '#/definitions/VelocityLimitCheck'
