        customDeliveryAddress:
          description: 'Custom postal address to send the PIN mailer.

            When the customDeliveryAddressee is provided, the field must also be provided.

            To be provided when delivery type is empty, but not in combination with Email for PIN and/or Phone for PIN.'
          allOf:
          - $ref: '#/components/schemas/CreateAddressRequestMailAddress'
        customDeliveryEmail:
          description: 'Custom email address to send the PIN mailer

            To be provided when delivery type is empty, but not in combination with Phone for PIN and/or Postal address for PIN.'
          allOf:
          - $ref: '#/components/schemas/EmailAddress'
        customDeliveryPhone:
          description: 'Custom phone number to send the PIN mailer

            To be provided when delivery type is empty, but not in combination with Email for PIN and/or Postal address for PIN.'
          allOf:
          - $ref: '#/components/schemas/CreateAddressRequestPhoneNumber'
