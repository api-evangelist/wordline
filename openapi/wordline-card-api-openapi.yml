            To be provided when delivery type is empty, but not in combination with Phone for PIN and/or Postal address for PIN.'
          allOf:
          - $ref: '#/components/schemas/EmailAddress'
        customDeliveryPhone:
          description: 'Custom phone number to send the PIN mailer.

            To be provided when delivery type is empty, but not in combination with Email for PIN and/or Postal address for PIN.'
          allOf:
          - $ref: '#/components/schemas/CreateAddressRequestPhoneNumber'
        specificFields:
          type: object
          example: label1:value|label2:value
          description: 'The issuer can provide Specific Fields for the PIN mailer order.

