      - responseMetadata
      properties:
        responseMetadata:
          description: Response metadata
          allOf:
          - $ref: '#/components/schemas/ResponseMetadata'
        data:
          description: Response data
          allOf:
          - $ref: '#/components/schemas/UnblockCardResponse'
      description: Issuer response entity
      title: ApiResponseEntityUnblockCardResponse
    Dispute:
      type: object
      properties:
        issuerId:
          type: string
          description: Issuer Identifier (unique per platform)
        disputeFolderIdentifier:
          description: Dispute Folder Identifier
          allOf:
          - $ref: '#/components/schemas/DisputeFolderIdentifier'
        events:
          type: array
          description: 'Events attached to the dispute folder.Event can be triggered by our system or  added by the issuer (purpose can to indicate a communication from/to cardholder)

            _Embedded property, only filled when available for the endpoint and explicitly requested in the ''embed'' query parameter._'
          items:
            $ref: '#/components/schemas/DisputeEvent'
        postings:
          type: array
          description: "Posted operation on the dispute folder, example : Do a refund towards the cardholder account, \nDo a write-off towards an issuer account (Profit and Loss, Fraud,..), \ndo a Foreign exchange fee, Financial Advice Exchange Rate Difference\n_Embedded property, only filled when available for the endpoint and explicitly requested in the 'embed' query parameter._"
          items:
            $ref: '#/components/schemas/DisputePosting'
        documents:
