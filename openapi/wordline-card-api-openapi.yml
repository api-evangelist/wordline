          type: array
          description: List of external authorization restrictions related to the card
          items:
            $ref: '#/components/schemas/ExternalAuthorizationsRestriction'
        subBinRangeReference:
          type: string
          description: Reference of the sub BIN range selected for PAN generation.This field applies only if the card product is configured with random PAN generation and sub BIN range references
      title: ReplaceCardRequest.CardContract.Card
    BlockAllCardsRequest:
