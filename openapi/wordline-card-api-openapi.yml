    ReplaceCardRequestCardContract:
      type: object
      properties:
        specificFields:
          type: object
          description: The issuer can update Specific Fields for the card contract during the card replacement. It is a list of external data {"label":"value"} separated by a "," related to the card contract (pass-thru data) that can be provided by e.g. the issuer for information or for usage by other systems. A new data can be added or an existing data can be updated {"label1":"newValue"} or removed {"label2":"null"}. Any existing data that is not present in this list is not updated in the card contract. Those provided data have no impact on our system business processes.
          additionalProperties:
            type: string
        card:
          description: Card
          allOf:
          - $ref: '#/components/schemas/ReplaceCardRequestCardContractCard'
        cardHolder:
          description: Card holder data to update before replacing the card (in related customer resource having customerIdentifier equals to CardContract.cardHolderIdentifier). Only the fields provided in request will be updated, others will remain unchanged.
          allOf:
          - $ref: '#/components/schemas/ModifyCustomerRequest'
        selectedModels:
          type: array
          description: The issuer can replace one or several models linked to the card contract if this latest is active (only applicable for TECHNOLOGY_AND_APPLICATION_MODEL for the moment)
          items:
            $ref: '#/components/schemas/CardContractModel'
        schemeReportDeclarationBehavior:
          type: string
          description: 'The issuer can indicate if the card events are reported to the scheme. Relevant only if the ABU-VAU program is enabled. If the ABU-VAU program is disabled, the use of this attribute generates an error. Possible values are: OPT_IN: the card events are reported to the scheme, OPT_OUT: the card events are not reported to the scheme. If the ABU-VAU program is enabled and the attribute is empty, the default value set on card product is applied.'
        clickToPayEnrollment:
          type: string
          description: "Indicates if the card enrollment in Click to Pay service is requested or not. \nRelevant only if the Click to Pay feature is enabled. If the Click to Pay feature is disabled, the use of this attribute generates an error.\n\nPossible values are :\n- OPT_IN : enrollment of the card in Click to Pay service is requested.\n- OPT_OUT : enrollment of the card in Click to Pay service is not requested. \n\nIf the Click to Pay feature is enabled and the attribute is empty, the default value set on card product is applied.\n\nAs a result :\nIf OPT_IN, the enrollment of the new card in Click to Pay service is requested and will be effective through WL iTSP at card activation\nIf OPT_OUT, the enrollment of the new card in Click to Pay service is not requested."
        forcedEmbossingName:
          type: string
          description: 'The issuer can provide the embossing name (first line of the name embossed on the physical card) for the new card if allowed within card Technology and Application model.

            By default, the previous value is used.

            The character "*" is not allowed in the line 1 of the embossing name.'
        forcedEmbossingName2ndLine:
          type: string
          description: 'The issuer can provide the 2nd Line of embossing name for the new card if the first line of embossing name is provided and if it is allowed by the embossing name calculation algorithm.

            By default, the previous value is used.

            The character "*" is not allowed in the line 2 of the embossing name.'
      title: ReplaceCardRequest.CardContract
    CardContractIdentifier:
