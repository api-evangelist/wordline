    ReplaceCardRequestCardOrder:
      type: object
      description: Card Order for the new card.Empty if no card order needed for the card
      properties:
        specificFields:
          type: object
          description: 'The issuer can provide Specific Fields for the card order.

            It is a list of external data {"label":"value"} separated by a "," related to the card order (pass-thru data) that can be provided by e.g. the issuer for information or for usage by other systems.

            Example : {"label1":"value1","label2":"value2"}

            Those provided data have no impact on our system business processes'
          additionalProperties:
            type: string
        cardProducer:
          type: string
          description: The issuer can indicate a card producer (to be used instead of the default one from card profile).
        sendingMode:
          type: string
          description: 'The issuer must provide the sending mode for a physical card if no default sending mode is defined for the replacement reason in the replacement model.

            In the other cases, the sending mode is optional (for a virtual card or if the skipCardOrderGeneration field is set to true or for a physical card if a default sending mode has been defined for the replacement reason).'
        deliveryChannel:
          type: string
          description: 'The issuer can provide the delivery channel if a creation of a card order is requested (if skipCardOrderGeneration field is set to false).

            By default, the delivery channel from the distribution rule of the card product will be used.'
        deliveryType:
          type: string
          description: 'Indicates whether the delivery of the card should be to branch or customer (instead of the one from the distribution rule of the card product)

            Possible values are: CUSTOMER, BRANCH

            To override the delivery address, the card delivery type must not be provided and only one of these fields must be provided: customDeliveryAddress, customDeliveryEmail or customDeliveryPhone.'
        deliveryBranchCode:
          type: string
          description: 'The issuer must provide the card delivery branch code if the delivery type is BRANCH.

            Refer to Order.deliveryBranchCode'
        customDeliveryAddressee:
          type: string
          description: 'Refer to Order.customDeliveryAddressee

            When the customDeliveryAddress is provided, the field must also be provided.'
        customDeliveryAddress:
          description: 'Refer to Order.customDeliveryAddress.

            The customDeliveryAddressee must also be provided when the field is provided.'
          allOf:
          - $ref: '#/components/schemas/CreateAddressRequestMailAddress'
        customDeliveryEmail:
          description: Refer to  Order.customDeliveryEmail
          allOf:
          - $ref: '#/components/schemas/EmailAddress'
        customDeliveryPhone:
          description: Refer to Order.customDeliveryPhone
          allOf:
          - $ref: '#/components/schemas/CreateAddressRequestPhoneNumber'
        skipCardOrderGeneration:
          type: boolean
          description: 'Card order will be not generated if this field is true.

            If this field is false or empty, the card order will be generated as per the product configuration.

            By default, value is false.'
          default: false
      title: ReplaceCardRequest.CardOrder
