          type: object
          description: "The issuer can provide Specific Fields for the new card. It is a list of external data {\"label\":\"value\"} separated by a \",\" related to the card (pass-thru data) that can be provided by e.g. the issuer for information or for usage by other systems.\n Example : {\"label1\":\"value1\",\"label2\":\"value2\"}.\n Those provided data have no impact on our system business processes."
