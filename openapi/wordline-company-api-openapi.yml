        items:
          $ref: '#/definitions/Address'
      contactIdentifiers:
        type: array
        description: 'List of contact references of the company.

          _Embedded property, only filled when available for the endpoint and explicitly requested in the ''embed'' query parameter._'
        items:
          $ref: '#/definitions/ContactIdentifier'
      contacts:
        type: array
        description: 'List of contacts of the company.

          _Embedded property, only filled when available for the endpoint and explicitly requested in the ''embed'' query parameter._'
        items:
          $ref: '#/definitions/Contact'
      lastUpdateDate:
        type: string
        format: date-time
        description: Indicates the date when the update is processed
    title: Company
