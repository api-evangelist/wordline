          enum:
          - company
          - company.addressIdentifiers
          - company.addresses
          - company.contacts
        collectionFormat: multi
      - name: issuerId
        in: path
        description: issuerId
        required: true
        type: string
      - in: body
        name: requestBody
        description: requestBody
        required: true
        schema:
