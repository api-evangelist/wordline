    properties:
      responseMetadata:
        allOf:
        - $ref: '#/definitions/UnauthorizedResponseMetadata'
    title: UnauthorizedResponseMetadata
  CreateConsumerContractRequestSepaMandate:
    type: object
    properties:
      debtorAddressType:
