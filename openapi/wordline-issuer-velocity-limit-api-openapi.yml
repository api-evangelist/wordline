        example: Forbidden
        description: Executed REST API status message
    title: ForbiddenResponseMetadata
  MonetaryAmountAlphaCurrency:
    type: object
    properties:
      exponent:
        type: integer
        format: int32
        example: 2
        description: 'Exponent of amount currency. Number of decimal digits. Example: 2 for Euro.'
      isoCode:
        type: string
        example: EUR
        description: 'Currency code of amount. ISO4217 alphabetic format. Example: EUR for Euro.'
      value:
        type: integer
        format: int64
        description: 'Value of amount. Example: 54321 for 543,21 EUR (exponent = 2: 2 digits for cents).'
    title: MonetaryAmountAlphaCurrency
securityDefinitions:
