          type: integer
          format: int32
          example: 404
          description: HTTP status code
        statusMessage:
          type: string
          example: Not found
          description: Executed REST API status message
      title: NotFoundResponseMetadata
    EncryptedPayload:
      type: object
      required:
      - encryptedData
      - encryptedKey
      - publicKeyFingerprint
      properties:
        encryptedData:
          type: string
          example: fqeftrq1s6541c5v161f2d151e12
          description: 'Contains an encrypted json object. Encrypted by the ephemeral AES key

            using CBC mode (IV as provided in ''iv'', or zero if none provided) and

            PKCS#7 padding. The JSON object being encrypted will be defined in

            the context of the API call. Hex-encoded data (case-insensitive)'
          minLength: 1
          maxLength: 256000
        encryptedKey:
          type: string
          example: ECD12A55458552152154
          description: 'One-time use AES key encrypted by the Mastercard public key (as

            identified by ''publicKeyFingerprint'') using the OAEP or RSA Encryption

            Standard PKCS #1 v1.5 (depending on the value of

            ''oaepHashingAlgorithm''.

            Requirement is for a 128-bit key (with 256-bit key supported as an

            option). Hex-encoded data (case-insensitive)'
          minLength: 1
          maxLength: 512
        iv:
          type: string
          example: '000000000000'
          description: 'The initialization vector used when encrypting data using the one-time

            use AES key. Must be exactly 16 bytes (32 character hex string) to

            match the block size.If not present, an IV of zero is assumed. Hex-encoded data (case-insensitive)'
          minLength: 0
          maxLength: 32
        oaepHashingAlgorithm:
          type: string
          example: SHA512
          description: 'Hashing algorithm used with the OAEP scheme. If omitted, then the RSA Encryption Standard PKCS #1 v1.5 will be used'
          minLength: 0
          maxLength: 6
          pattern: SHA256|SHA512
        publicKeyFingerprint:
          type: string
          example: fingerprint1245421
          description: The fingerprint of the public key used to encrypt the ephemeral AES key. Hex-encoded data (case-insensitive)
          minLength: 1
          maxLength: 64
      description: EncryptedPayload object containing a FundingAccountData object
    ClickToPayEnrollUpdateRequest:
