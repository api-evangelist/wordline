    ConsumerInformation:
      type: object
      required:
      - countryCode
      - emailAddresses
      - firstname
      - lastname
      - phoneNumbers
      properties:
        consentPresenter:
          type: string
          example: Bank A
          description: Identifies the presenter of consent to the consumer
          minLength: 1
          maxLength: 30
        consentVersion:
          type: string
          example: '1.0'
          description: Specific version of the terms and conditions that the customer has accepted for the user solution
          minLength: 1
          maxLength: 9
        countryCode:
          type: string
          example: USA
          description: Country code using 3-character ISO 3166 (Alpha 3) format
          pattern: '[A-Z]{3}'
        emailAddresses:
          type: array
          example: john.doe@mydomain.com
          description: List of email addresses
          items:
            type: string
            example: john.doe@mydomain.com
            description: List of email addresses
            pattern: '[_A-Za-z0-9-+]+(\.[_A-Za-z0-9-+]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})'
          maxItems: 5
          minItems: 1
        locale:
          type: string
          example: en_US
          description: 'Language and country in which the product communicates with the consumer. Format : ISO-639-1'
          minLength: 5
          maxLength: 5
          pattern: '[a-z]{2}_[A-Z]{2}'
        firstname:
          maxLength: 30
          minLength: 1
          pattern: ^[^{}\[\]\^:;=!\*\$"`<>&\%]+$
          type: string
          description: 'The firstname of the account holder, charset  ISO 8859-1 (aka Latin-1). May contain multiple words, including middle name. Following chars are not accepted : {}[]^:;=!*$"`<>&\%'
          example: John Michael
        lastname:
          maxLength: 30
          minLength: 1
          pattern: ^[^{}\[\]\^:;=!\*\$"`<>&\%]+$
          type: string
          description: 'The lastname of the account holder, charset  ISO 8859-1 (aka Latin-1). May contain multiple words. Following chars are not accepted : {}[]^:;=!*$"`<>&\%'
          example: Kennedy
        phoneNumbers:
          type: array
          example: '+33612345678'
          description: List of phone numbers, with international prefix
          items:
            type: string
            example: '+33612345678'
            description: List of phone numbers, with international prefix
            pattern: \+[1-9]\d+
          maxItems: 5
          minItems: 1
        timeOfConsent:
          type: string
          example: '2023-02-09T10:23:30.747Z'
          description: 'Date/Time from which the consent is valid. Format ISO8601 : yyyy-MM-ddTHH:mm:ss.SSSZ'
          pattern: \d{4}(-\d{2}){2}T(\d{2}:){2}\d{2}\.\d{3}Z
      description: Structure used for information related to click-to-pay account
