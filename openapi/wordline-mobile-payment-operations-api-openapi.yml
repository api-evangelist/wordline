        activationData:
          type: string
          description: MBPAC element (encrypted activation code). TAV value for MDES or MBPAC value for VTS. Present if responseCode OK
        encryptedPassData:
          type: string
          description: EncryptedPassData (encrypted card data). Present if responseCode OK
        ephemeralPublicKey:
          type: string
          description: Ephemeral ECDSA public key, prefixed with 0x04. Always Base64 in V2 service. Present if responseCode OK
    BadRequestResponseMetadata:
      type: object
      required:
      - correlationId
      - responseDateTime
      - statusCode
      - statusMessage
      properties:
        correlationId:
          type: string
          description: Correlation Identifier
        responseDateTime:
          type: string
          example: format:yyyy-MM-dd'T'HH:mm:ss.SSSZ
          description: Timestamp when response date was generated
        statusCode:
          type: integer
          format: int32
          example: 400
          description: HTTP status code
        statusMessage:
          type: string
          example: Bad request
          description: Executed REST API status message
      title: BadRequestResponseMetadata
    ResponseV2DetailsDataResponse:
      type: object
      required:
      - responseMetadata
      properties:
        data:
          $ref: '#/components/schemas/DetailsDataResponse'
        responseMetadata:
          $ref: '#/components/schemas/ResponseMetadata'
    VtsApplePushDataRequest:
      type: object
      properties:
        authCode:
          type: string
        nonce:
          type: string
        pan:
          type: string
        panExpiryDate:
          type: string
      title: VtsApplePushDataRequest
    TokenSelfcareUpdateRequest:
      type: object
      required:
      - operationType
      - tokenRequestorId
      properties:
        operationType:
          type: string
          description: Type of requested action regarding Card
          enum:
          - ACTIVATE
          - CLOSE
          - BLOCK
          - UNBLOCK
        tokenRequestorId:
          type: integer
          format: int64
          description: ID of the token requestor, assigned by the token service provider
          minimum: 0
          maximum: 99999999999
    CardDetails:
      type: object
      required:
      - billingAddress
      - cardExpiryMonth
      - cardExpiryYear
      - cardLastDigits
      - nameOnCard
      properties:
        billingAddress:
          $ref: '#/components/schemas/BillingAddress'
        cardExpiryMonth:
          type: string
          example: '11'
          description: The month of the card expiry date
          minLength: 2
          maxLength: 2
        cardExpiryYear:
          type: string
          example: '2050'
          description: The year of the card expiry date
          minLength: 4
          maxLength: 4
        cardLastDigits:
          type: string
          example: '4321'
          description: The 4 last digits of the cardnumber of the customer (PAN).
          minLength: 4
          maxLength: 4
        cardReference:
          type: string
          example: 42936061AAAP8026
          description: Anonymized card identifier (Surrogate of PAN), as defined by Issuer Card Management System. Only filled for the card in request
          minLength: 1
          maxLength: 64
        nameOnCard:
          type: string
          example: John Doe
          description: The name cardholder (embossed on card), in the format "firstname middlename lastname" or "firstname lastname" (separator space), charset  ISO 8859-1 (aka Latin-1)
          minLength: 1
          maxLength: 27
        tokenStatus:
          type: string
          description: The status of the token associated to the card
          example: ACT
        tokenReferenceID:
          maxLength: 64
          minLength: 1
          type: string
          description: The unique identifier of the token associated to the card
          example: '123456789012345678'
      description: List of cardDetail structures that contains information on cards associated to a click-to-Pay account. Returned if min one present. See below for subfields
    BadGatewayResponseMetadata:
      type: object
      required:
      - correlationId
      - responseDateTime
      - statusCode
      - statusMessage
      properties:
        correlationId:
          type: string
          description: Correlation Identifier
        responseDateTime:
          type: string
          example: format:yyyy-MM-dd'T'HH:mm:ss.SSSZ
          description: Timestamp when response date was generated
        statusCode:
          type: integer
          format: int32
          example: 502
          description: HTTP status code
        statusMessage:
          type: string
          example: Bad Gateway
          description: Executed REST API status message
      title: BadGatewayResponseMetadata
    GetTokenDataV2Response:
      type: object
      properties:
        cardExpiryMonth:
          type: string
          example: '02'
          description: The month of the card expiry date. For example 11
          minLength: 2
          maxLength: 2
        cardExpiryYear:
          type: string
          example: '2023'
          description: The year of the card expiry date. For example 2023
          minLength: 4
          maxLength: 4
        cardLastDigits:
          type: string
          example: '4578'
          description: The 4 last digits of the cardnumber of the customer (PAN)
          minLength: 4
          maxLength: 4
        tokenDataList:
          type: array
          description: Structure used for filling information related to the found tokens. Present if minimum one token found
          items:
            $ref: '#/components/schemas/AddTokenData'
    CreateAppleTokenizedCardV2Request:
      type: object
      required:
      - applePublicKey
      - nonce
      - nonceSignature
      - tokenProviderID
      properties:
        applePublicKey:
          type: string
          description: Apple ECDSA public key, in Base 64 format, retrieved from the Apple public certificate
        nonce:
          type: string
          description: Nonce generated by Apple, HEX encoded. Upper or lower letters accepted.
          pattern: '[0-9a-fA-F]+'
        nonceSignature:
          type: string
          description: Nonce signature generated by Apple, HEX encoded. Upper or lower letters accepted.
          pattern: '[0-9a-fA-F]+'
        tokenProviderID:
          type: string
          description: Information about the token provider. Values are MDES, VTS
          pattern: VTS|MDES
        auxiliaryCardIndicator:
          type: boolean
          description: Request to generate additional substructure for auxiliaryCard, in case of co-badging. Default false
        productType:
          type: string
          description: Identifies type of card product. The default value depends on the provider. Must be provided if auxiliaryCardIndicator is true
