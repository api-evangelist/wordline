      type: object
      required:
      - postingAmount
      - postingTypeReference
      properties:
        postingAmount:
          description: Mandatory parameter specifying the posting amount. The posting amount can be negative amount (- sign in the beginning of the amount digits)
          allOf:
          - $ref: '#/components/schemas/Amount'
        message:
          type: string
          description: Description message that will associated to the posted operation in the statement
        immediateReimbursement:
          type: boolean
          description: Optional parameter for impacting card holder account immediately
        postingTypeReference:
          type: string
          description: 'The issuer must provide the identifier of the external reference of the posting. The list of values are configured by issuer:

            Three family of postings type:

            - Cardholder: For impacting the cardholder account, possible values can be: ''Cardholder Account'', ''POST TO OTHER ACCOUNT''

            - Issuer: Write off: possible values can be ''ISSUER_ACCOUNT'', ''PROFIT AND LOSS'', ''FRAUD''

            - Foreign exchange fee (''FOREIGN_EXCHANGE_FEE''), Financial Advice Exchange Rate Difference (''ADVANCE_EXCHANGE_RATE_DIFFERENCE''):  the dispute officer can manually create a dispute posting amount to this account'
      title: CreatePostingRequest
    CreateEventRequest:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: 'Contains the dispute Event Type label of the Event to post to the Dispute Folder.

            The allowed event type list is configured per issuer in the platform. Type value generally used by issuers: ''Comment'''
        message:
          type: string
          description: Contains a free defined input that will be displayed in the eventMessage in the Dispute Folder
      title: CreateEventRequest
    CreateDisputeRequest:
      type: object
      properties:
        disputeReason:
          type: string
          description: 'Indicates the dispute reason. Example of values are : UNKNOWN_CARD, HIGH_AMOUNT, DUPLICATE_TRANSACTION, LATE_PRESENTMENT , INVALID_PAYMENT, INACTIVE_CARD, CREATED_CARD, COUNTERFEIT_CARD, BLOCKED_CARD, ACTIVE_CARD_TED.'
        refundRedebitIndicator:
          type: string
          description: 'Indicator to perform or not a Refund (for Debit transaction) / Redebit (for Credit transaction) on ''Cardholder Account'' on the disputed transaction. Possible values:

            - FULL: Refund Redebit the full amount of the transaction.

            - PARTIAL : Refund Redebit a partial amount, the partial amount should be provided in the field Refund Redebit Amount

            - NONE : no refund redebit is requested, this is the default value'
        refundRedebitAmount:
          description: The issuer should provide the Amount to Refund or Redebit when Refund Redebit Indicator is PARTIAL. Otherwise it is not checked
          allOf:
          - $ref: '#/components/schemas/Amount'
        declareFraudIndicator:
          type: boolean
          description: 'Indicator to perform a fraud declaration. Possible values:

            true: fraud declaration will be sent to the scheme.

            false: No fraud declaration, this is the default value.'
        issuerDisputeExternalReference:
          type: string
          description: 'The issuer Dispute External Reference : should be unique by issuer, there is no constraint regarding the format, only  maximum length is 50 CHAR.'
        originalValueDate:
          type: string
          format: date-time
          description: Optional parameter external Value Date
        disputePostings:
          type: array
          description: 'Issuer can provide a posting operation to perform on the created dispute folder, example:

            - Do a refund towards the cardholder account

            - Do a write-off towards an issuer account (Profit and Loss, Fraud,..)

            - do a Foreign exchange fee, Financial Advice Exchange Rate Difference'
          items:
            $ref: '#/components/schemas/CreatePostingRequest'
        disputeEvents:
          type: array
          description: 'Issuer can provide an event to add to the created dispute folder.

            This manual event will be added to events generated internally by our system.

            For example, the issuer can add an event to indicate that there is a communication from/to cardholder.'
          items:
            $ref: '#/components/schemas/CreateEventRequest'
        disputeDocuments:
          type: array
          description: Issuer can provide a list of Documents to add to the created dispute folder.
          items:
            $ref: '#/components/schemas/CreateDocumentRequest'
        autoAssignmentRule:
          type: string
          description: 'List of possible values: DISPUTE_REASON, automatically assigns the dispute to the user in charge based on the dispute reason.'
      title: CreateDisputeRequest
