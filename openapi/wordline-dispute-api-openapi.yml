    GenerateChargebackRequest:
      type: object
      required:
      - chargebackType
      properties:
        chargebackType:
          type: string
          description: 'The issuer must provide the type of chargeback. Possible values are:

            - FULL :  Full Chargeback is performed using the transaction Reconciliation amount of the disputed transaction (the chargebackAmount if provided is ignored)

            - PARTIAL : a Partial Chargeback is performed using the provided chargebackAmount

            - HIGH : 2 times FULL reconciliation amount  this is in case for example : the merchant instead of refunding cardholder, he did another debit. In this case he should  reimburse cardholder  2 times (credit HIGH_AMOUNT).'
        chargebackAmount:
          description: The Amount to use in case of Partial Chargeback ( chargebackType = PARTIAL)
          allOf:
          - $ref: '#/components/schemas/Amount'
        chargebackScenario:
          type: string
          description: 'Mandatory for VISA

            Defined values associated to specific scenario that allows WL dispute management service to recognize the template of the ChargeBack to generate :

            ChargeBack scenario 1: 10-E-commerce fraud, Value = VISECOMFRAUD

            ChargeBack scenario 2: 12.6 Duplicate Processing, Value = VISDUPLIC

            ChargeBack scenario 3: 13.9 Non-Receipt of Cash, Value = VISNOCASH

            If the value is not a known value, the request is rejected.'
        reasonCode:
          type: string
          description: 'Mandatory for MCI : MCI chargeback reason code (possible values in MCI MPE file), for VISA this field is not provided.

            If the value is not a known value , WL dispute management service rejects the ChargeBack generation.

            One of the fields ChargebackScenario (VISA) or ReasonCode (MCI) should be present.'
        chargebackDocument:
          description: 'Contains the document that has to be attached to the ChargeBack depending on the chargebackScenario ( VISA Scheme ) or ReasonCode (MCI Scheme)

            For VISA Scheme : chargebackDocument is Mandatory when ChargebackScenario is VISECOMFRAUD or VISNOCASH

            For MCI Scheme : see  scheme document Chargeback Guide '
          allOf:
          - $ref: '#/components/schemas/DisputeDocument'
        duplicatedTransactionIdentifier:
          type: string
          description: 'When the disputed transaction is for "duplicate", provide the "Transaction Identifier" value of the non disputed transaction

            If chargebackScenario= VISDUPLIC, and the duplicatedTransactionIdentifier is not provided, WL dispute management service rejects the ChargeBack generation.'
      title: GenerateChargebackRequest
