        description: Response data
        allOf:
        - $ref: '#/definitions/ReverseOperationBonusResponse'
    description: Issuer response entity
    title: ApiResponseEntityReverseOperationBonusResponse
  DisputeFolderIdentifier:
    type: object
    required:
    - disputeFolderReference
    properties:
      disputeFolderReference:
        type: string
        description: "The Dispute Folder Reference \nPresent if \"Dispute Folder\" creation is successful. \nThe value of this field is constructed by algorithm. Example for IDM4Sempris, it is like this : D-V-6500-1234-1 (D = for Dispute / M = MCI , V= VISA / 6500 = issuerId / 1234 = YDDD = julien date / 1 = the sequence  is constructed under (D-scheme Id- Issuer Id))"
      issuerDisputeExternalReference:
        type: string
        description: The issuer Dispute External Reference, Present if provided in the request.
    title: DisputeFolderIdentifier
  CreateOperationBonusRequest:
    type: object
    required:
    - bonusProgramReference
    - externalOperationReference
    - externalOperationDate
    - externalOperationServicePoster
    properties:
      description:
        description: 'Textual description of the operation

          Can contain a free text that can be used when the operation is presented to the Customer'
        type: string
      bonusProgramReference:
        description: The issuer must provide the reference of the Bonus/Loyalty program for which the reward is applied.
        type: string
      externalOperationReference:
        description: 'The triplet (externalOperationDate, externalOperationReference, externalOperationServicePoster) uniquely identifies the operation in our system.

          External reference of the operation to be created.'
        type: string
      externalOperationDate:
        description: 'The triplet (externalOperationDate, externalOperationReference, externalOperationServicePoster) uniquely identifies the operation in our system.

          The date the operation is performed (in general, the current date should be provided).'
        type: string
        format: date-time
      externalOperationServicePoster:
        description: 'The triplet (externalOperationDate, externalOperationReference, externalOperationServicePoster) uniquely identifies the operation in our system.

          The identifier of the external system which provides the operation to be posted (free text)'
        type: string
      externalOperationCode:
        description: The external operation code of the Bonus operation can be provided to identify the operation type in the issuer system.
        type: string
      referenceAmount:
        description: 'The reference amount has to be provided for a monetary operation (amount/exponent/currency values)

          If a debit operation is posted, the operation amount has to be positive.

          If a credit operation is posted, the operation amount has to be negative.

          The currency must be the same as the posting account.'
        allOf:
        - $ref: '#/definitions/Amount'
      loyaltyPointAmount:
        description: 'The loyalty point amount has to be provided for a non-monetary operation (value/unit)

          If a debit operation is posted, the operation amount has to be positive.

          If a credit operation is posted, the operation amount has to be negative.

          The loyalty point unit must be defined by the Bonus/Loyalty program.'
        allOf:
        - $ref: '#/definitions/LoyaltyPoint'
      rewardedOperationIdentifier:
        description: 'The issuer can provide the identifier of the operation to be rewarded, if any.

          If provided, the triplet (externalOperationDate, externalOperationReference, externalOperationServicePoster) has not to be provided.'
        allOf:
        - $ref: '#/definitions/OperationIdentifier'
      rewardedExternalMatchingOperationReference:
        description: 'The issuer can provide the triplet (externalOperationDate, externalOperationReference, externalOperationServicePoster) of the operation to be rewarded if any.

          If the triplet is provided, the identifier of the operation to be rewarded has not to be provided.

          External reference of the operation to be rewarded.'
        type: string
      rewardedExternalMatchingOperationDate:
        description: 'The issuer can provide the triplet (externalOperationDate, externalOperationReference, externalOperationServicePoster) of the operation to be rewarded if any.

          If the triplet is provided, the identifier of the operation to be rewarded has not to be provided.

          Operation date of the operation to be rewarded.'
        type: string
        format: date-time
      rewardedExternalMatchingOperationServicePoster:
        description: 'The issuer can provide the triplet (externalOperationDate, externalOperationReference, externalOperationServicePoster) of the operation to be rewarded if any.

          If the triplet is provided, the identifier of the operation to be rewarded has not to be provided.

          Identifier of the external system of the operation to be rewarded.'
        type: string
    title: CreateOperationBonusRequest
