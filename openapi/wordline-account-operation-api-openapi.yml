definitions:
  CardIdentifier:
    type: object
    description: Identification of the card either by Issuer card external reference or by card reference
    properties:
      cardReference:
        type: string
        description: 'Reference of the card generated by our system, unique per platform.

          This reference is calculated sequentially by an internal algorithm on 16 digits (e.g. 2000000000096013).'
      issuerCardExternalReference:
        type: string
        description: 'External reference of the card provided by the issuer or calculated by the system if the external reference generation algorithm is configured for the issuer.

          This reference is unique per issuer and may be used to carry out research and find information.'
    title: CardIdentifier
  ApiResponseEntityCreateOperationPaymentResponse:
    x-wl-api-response: true
    type: object
    required:
    - responseMetadata
    properties:
      responseMetadata:
        description: Response metadata
        allOf:
        - $ref: '#/definitions/ResponseMetadata'
      data:
        description: Response data
        allOf:
        - $ref: '#/definitions/CreateOperationPaymentResponse'
    description: Issuer response entity
    title: ApiResponseEntityCreateOperationPaymentResponse
  ReverseOperationInterestRequest:
    type: object
    required:
    - externalMatchingOperationReference
    - externalMatchingOperationDate
    - externalMatchingOperationServicePoster
    - externalOperationReference
    - externalOperationDate
    - externalOperationServicePoster
    properties:
      description:
        description: 'Textual description of the operation

          Can contain a free text that can be used when the operation is presented to the Customer.'
        type: string
      externalMatchingOperationReference:
        description: 'The triplet (externalMatchingOperationDate, externalMatchingOperationReference, externalMatchingOperationServicePoster) uniquely identifies the original operation in our system.

          It is used for retrieving the operation to be reversed.

          The field contains the value of externalOperationReference of the original operation to be reversed.'
        type: string
      externalMatchingOperationDate:
        description: 'The triplet (externalMatchingOperationDate, externalMatchingOperationReference, externalMatchingOperationServicePoster) uniquely identifies the original operation in our system.

          It is used for retrieving the operation to be reversed.

          The field contains the value of externalOperationDate of the original operation to be reversed.'
        type: string
        format: date-time
      externalMatchingOperationServicePoster:
        description: 'The triplet (externalMatchingOperationDate, externalMatchingOperationReference, externalMatchingOperationServicePoster) uniquely identifies the original operation in our system.

          It is used for retrieving the operation to be reversed.

          The field contains the value of externalOperationServicePoster of the original operation to be reversed.'
        type: string
      externalOperationReference:
        description: 'The triplet (externalOperationDate, externalOperationReference, externalOperationServicePoster) uniquely identifies the operation in our system.

          External reference of the operation to be created.'
        type: string
      externalOperationDate:
        description: 'The triplet (externalOperationDate, externalOperationReference, externalOperationServicePoster) uniquely identifies the operation in our system.

          The date the operation is performed (in general, the current date should be provided)'
        type: string
        format: date-time
      externalOperationServicePoster:
        description: 'The triplet (externalOperationDate, externalOperationReference, externalOperationServicePoster) uniquely identifies the operation in our system.

          The identifier of the external system which provides the operation to be posted (free text).'
        type: string
    title: ReverseOperationInterestRequest
