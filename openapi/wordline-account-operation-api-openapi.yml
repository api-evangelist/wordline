        type: string
        description: 'The triplet (externalOperationDate, externalOperationReference, externalOperationServicePoster) uniquely identifies the operation in our system.

          The identifier of the external system which provides the operation to be posted (free text).'
      externalOperationCode:
        type: string
        description: The external operation code of the reimbursment can be provided to identify the operation type in the issuer system.
      destinationIban:
        type: string
        description: 'An IBAN can be used for the reimbursement to transfer the input amount on this IBAN.

          If not provided, the reimbursment will be done on the IBAN associated to the account.'
      reimbursementType:
        type: string
        description: 'The reimbursement type can be::

          - ''FULL'': The reimbursement amount, calculated by the system based on the configuration and liable balance and/or Open-To-Buy, will be fully posted on the account.

          - ''PARTIAL'': If the input amount is greater than the allowed reimbursement amount calculated by the system, the maximum of the available amount will be posted on the account.

          - ''MAX'': If the input amount is greater than the allowed reimbursement amount calculated by the system, the posting will be refused.

          If the reimbursement type is not provided, the default value "MAX" will be used.'
      referenceAmount:
        description: "The amount of the operation (amount/exponent/currency values).\n The maximum amount is the balance amount limited to the Open-To-Buy.\n This field must not be provided if the reimbursement type is \"FULL\". Otherwise, the request is rejected."
