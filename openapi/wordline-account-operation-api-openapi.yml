        type: string
        description: ' Unit in which the loyalty points are expressed. Defined by Bonus/Loyalty program (can be currency, points...) (optional).'
      cumulatedValue:
        type: integer
        format: int64
        description: Total number of loyalty points (optional).
    title: LoyaltyPoint
