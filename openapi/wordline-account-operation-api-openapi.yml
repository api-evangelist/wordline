      referenceAmount:
        description: The amount of the operation (amount/exponent/currency values)
        allOf:
        - $ref: '#/definitions/Amount'
      valueDate:
        type: string
        format: date-time
        description: 'The date when the operation impacts balances or counters.

          If not provided, the value date is set to the external operation date.

          When the value date is in the future, a pending operation is created.'
      paymentChannel:
        type: string
        description: "The channel by which the payment is performed (optional field). \nThe possible values are:\nDIRECT_DEBIT\nCHEQUE\nCASH\nONLINE_MONEY \nNO_CHANNEL_PROVIDED\nINCOMING_PAYMENT\nNote that NO_CHANNEL_PROVIDED will be set by default if the paymentChannel is not provided."
      sepa:
        type: boolean
        description: 'Indicates whether the payment is performed in SEPA format.

          By default, the value is false.'
      paymentReason:
        type: string
        description: 'The reason why the payment is triggerred

          The list of possible payment reasons is configurable per issuer.'
      specificFields:
        type: object
        description: "The issuer can provide Specific Fields for the operation.\n It is a list of external data {\"label\":\"value\"} separated by a \",\" related to the operation (pass-thru data) that can be provided by e.g. the issuer for information or for usage by other systems. Example : {\"label1\":\"value1\",\"label2\":\"value2\"} Those provided data have no impact on our system business processes."
        additionalProperties:
          type: string
    title: CreateOperationPaymentRequest
  PointOfService:
    type: object
