    AuthStatusEnum:
      description: "This data element is containing information about the status of the SCA method applied.\n\nThe following codes are defined for this data type.\n\n  * 'Received':\n    An authorisation or cancellation-authorisation resource has been created successfully.\n  * 'PsuIdentified':\n    The PSU related to the authorisation or cancellation-authorisation resource has been identified.\n  * 'PsuAuthenticated':\n    The PSU related to the authorisation or cancellation-authorisation resource has been identified and authenticated e.g. by a password or by an access token.\n  * 'ScaMethodSelected':\n    The PSU/TPP has selected the related SCA routine.\n    If the SCA method is chosen implicitly since only one SCA method is available,\n    then this is the first status to be reported instead of 'received'.\n  * 'Started':\n    The addressed SCA routine has been started.\n  * 'Finalised':\n    The SCA routine has been finalised successfully.\n  * 'Failed':\n    The SCA routine failed\n  * 'Exempted':\n    SCA was exempted for the related transaction, the related authorisation is successful.\n  * 'Unconfirmed':\n              SCA is technically successfully finalised by the PSU, but the authorisation resource needs a confirmation command by the TPP yet.\n"
      type: string
      enum:
      - Received
      - PsuIdentified
      - PsuAuthenticated
      - ScaMethodSelected
      - Started
      - Finalised
      - Failed
      - Exempted
      - Unconfirmed
    AmountBreakdown:
      type: object
      additionalProperties: false
      description: Breakdown of the transaction amount. The sum of all the fields within this breakdown must be equal to the transaction amount. Possible to use for iDEAL payments, only in the FastCheckout flow.
      required:
      - OrderAmount
      - ShippingCost
      properties:
        OrderAmount:
          pattern: ^\d{1,13}\.\d{1,5}$
          type: string
          description: 'Order amount. Possible to use for iDEAL payments, only in the fast-checkout flow.

            '
          example: '123.45'
        ShippingCost:
          pattern: ^\d{1,13}\.\d{1,5}$
          type: string
          description: 'Shipping cost. Possible to use for iDEAL payments, only in the fast-checkout flow.

            '
          example: '123.45'
    ExchangeRateInformationRequest:
      type: object
      additionalProperties: false
      properties:
        UnitCurrency:
          pattern: '[A-Z]{3,3}'
          type: string
          description: 'Currency in which the rate of exchange is expressed in a currency

            exchange. In the example 1GBP = xxxCUR, the unit currency is GBP.

            '
        ExchangeRate:
          type: number
          description: 'The factor used for conversion of an amount from one currency

            to another. This reflects the price at which one currency was bought with

            another currency. Rate expressed as a decimal, for example, 0.7 is 7/10

            and 70%.

            '
        RateType:
          type: string
          description: 'Specifies the type used to complete the currency exchange.

            * Spot: Exchange rate applied is the spot rate.

            * Sale: Exchange rate applied is the market rate at the time of the sale.

            * Agreed: Exchange rate applied is the rate agreed between the parties.

            '
          enum:
          - Spot
          - Sale
          - Agreed
        ContractIdentification:
          maxLength: 256
          type: string
          description: 'Unique and unambiguous reference to the foreign exchange contract

            agreed between the initiating party/creditor and the debtor agent.

            '
      description: 'Provides details on the currency exchange rate and contract.

        '
    Amount:
      required:
      - Amount
      type: object
      additionalProperties: false
      properties:
        Type:
          type: string
          deprecated: true
          description: '* _Fixed_ - The amount defined by the merchant can not be changed by the user

            * _Change_ - The amount defined by the merchant can be changed by the user within the defined bounds. Currently can be used only for iDEAL Payments

            * _Define_ - The amount needs to be defined by the user. Currently can be used only for iDEAL Payments'
          enum:
          - Fixed
          - Change
          - Define
          default: Fixed
        Amount:
          pattern: ^\d{1,13}\.\d{1,5}$
          type: string
          description: 'Amount of the payment. The decimal separator is a dot.

            '
          example: '123.45'
        MaximumAmount:
          pattern: ^\d{1,13}\.\d{1,5}$
          type: string
          deprecated: true
          description: 'Conditionally used for amount type Change or Define.

            The value in case of Change should be greater than or equal to the amount value.

            In case of Fixed, this value will be ignored.'
          example: '1000.00'
        MinimumAmount:
          pattern: ^\d{1,13}\.\d{1,5}$
          type: string
          deprecated: true
          description: 'Conditionally used for amount type Change or Define.

            The value in case of Change should be less than or equal to the amount.

            In case of Fixed, this value will be ignored.'
          example: '5.00'
        Currency:
          pattern: '[A-Z]{3,3}'
          type: string
          description: 'Currency of the payment. ISO 4217 currency codes should be

            used. For iDEAL only EUR is possible

            '
          example: EUR
          default: EUR
        AmountBreakdown:
          $ref: '#/components/schemas/AmountBreakdown'
