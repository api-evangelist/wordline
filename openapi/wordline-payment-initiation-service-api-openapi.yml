components:
  parameters:
    AspspPsuId:
      name: AspspPsuId
      in: header
      description: 'PSU’s Id at ASPSP. Allows the unique identification of the PSU at

        the ASPSP.

        '
      schema:
        type: string
      example: Psu-12345
    Signature:
      name: Signature
      in: header
      description: 'Conditionally required for iDEAL payments. The signature in the request should include a keyId with the value of fingerprint of the certificate

        '
      schema:
        type: string
    DeviceId:
      name: DeviceId
      in: header
      description: 'UUID (Universally Unique Identifier) for a device, which is used by

        the PSU. UUID identifies either a device or a device dependant

        application installation. In case of an installation identification

        this ID need to be unaltered until removal from device.

        '
      schema:
        maxLength: 500
        minLength: 1
        type: string
    PsuIpAddress:
      name: PsuIpAddress
      in: header
      description: 'PSU Session information.


        The forwarded IP Address header field consists of the corresponding

        HTTP request IP Address field between PSU and TPP . It shall be

        contained if and only if this request was actively initiated by the

        PSU.

        '
      schema:
        maxLength: 35
        minLength: 1
        type: string
    InitiatingPartyReturnUrl:
      name: InitiatingPartyReturnUrl
      in: header
      description: 'The callback URL for the redirection back to the initiating party

        after authorization.

        '
      schema:
        maxLength: 4000
        minLength: 1
        type: string
        example: https://www.example.org
    AspspPsuCorporateIdType:
      name: AspspPsuCorporateIdType
      in: header
      description: 'This is describing the type of the identification needed by the

        ASPSP to identify the PsuCorporate-ID content.

        '
      schema:
        type: string
    LastLogin:
      name: LastLogin
      in: header
      description: 'PSU Session information.


        The time when the PSU last logged in with the TPP. ISO 8601 DateTime.

        '
      schema:
        type: string
        format: date-time
    Digest:
      name: Digest
      in: header
      description: Is contained if and only if the `Signature` element is contained in the header of the request.
      schema:
        type: string
      example: SHA-256=hl1/Eps8BEQW58FJhDApwJXjGY4nr1ArGDHIT25vq6A=
    PsuId:
      name: PsuId
      in: header
      schema:
        type: string
      description: 'If this field is filled the Open Banking Service will try to

        retrieve previously stored information to complete the

        payment. The Open Banking Solution will:

        * check for a pre authentication token in case pre-authentication is available for the ASPSP.

        * check for debtor token in case of IDEAL payments

        '
    HttpHeaderAcceptLanguage:
      name: HttpHeaderAcceptLanguage
      in: header
      description: 'PSU Session information.


        The forwarded IP Accept header fields consist of the corresponding

        HTTP request Accept header fields between PSU and TPP.

        '
      schema:
        maxLength: 500
        minLength: 1
        type: string
    AppRedirectPreferred:
      name: AppRedirectPreferred
      in: header
      schema:
        type: boolean
        default: false
      description: 'If set to ''true'' the Open Banking Service will try to steer the flow towards an App redirect for the authentication of the PSU and authorization of the payment.

        This can potentially improve the user journey as the banking application may use biometrics for SCA and skip the identification process if the user is already logged in.


        NOTE that, depending on the implementation of the ASPSP, it may so happen that the flows breaks if the user does not have the banking application installed on their mobile device.

        '
    InitiatingPartyNotificationUrl:
      name: InitiatingPartyNotificationUrl
      in: header
      description: 'The URL which will be used for notification service request. The Open Banking Service supports two ways in which this field can be filled:

        * **Option A)** with an URL ending on /v2 or /v3, indicating the version of the Notification API implemented by the Initiating Party. In this case the URL called for notifications will be extended with /notification/status by the Open Banking Service. The ''NotificationVersion'' field MUST NOT be filled.

        * **Option B)** with a full URL. The version information MUST BE provided in the ''NotificationVersion'' field. In this case the provided URL will not be extended, and used as-is.

        '
      examples:
        Option A:
          value: https://www.example.org/myendpoint/v3
        Option B:
          value: https://www.example.org/myendpoint/notification
      schema:
        maxLength: 4000
        minLength: 1
        type: string
    confirm:
      name: confirm
      in: query
      description: 'If set to ''true'' the transaction will be immediately confirmed

        by the Open Banking Service if confirmation of the payment by the Initiating Party is required by the ASPSP.

        '
      schema:
        type: string
    authorisationId:
      name: authorisationId
      in: path
      required: true
      schema:
        type: string
      example: aid-4846
      description: 'The Id used by the Open Banking Service to refer to an authorisation resource.

        '
    HttpHeaderUserAgent:
      name: HttpHeaderUserAgent
      in: header
      description: 'PSU Session information.


        The forwarded Agent header field of the HTTP request between PSU

        and TPP.


        Required if

        * the `PaymentProduct`equals `IDEAL`

        * `PsuId`is provided

        * `UseDebtorToken` does not equal `false`

        '
      schema:
        maxLength: 500
        minLength: 1
        type: string
    GeoLocation:
      name: GeoLocation
      in: header
      description: 'The forwarded Geo Location of the corresponding http request

        between PSU and TPP.

        '
      schema:
        maxLength: 500
        minLength: 1
        type: string
    MessageCreateDateTime:
      name: MessageCreateDateTime
      in: header
      description: 'The message create date time.


        ISO 8601 DateTime.

        '
      required: true
      schema:
        type: string
        format: date-time
      example: '2020-09-25T08:15:00.856Z'
    AspspPsuCorporateId:
      name: AspspPsuCorporateId
      in: header
      description: 'Identification of a Corporate in the Online Channels.

        '
      schema:
        type: string
    confirmForNotification:
      name: confirm
      in: query
      description: 'If set to ''true'' the transaction will be immediately confirmed by the Open Banking Service if confirmation of the payment by the Initiating Party is required by the ASPSP.

        <br>**Note:** This field is only applicable when the notification service is used by the Initiating Party to receive the status of the payment. When the notification is not used this flag can be set in the GET status API.

        '
      schema:
        type: string
    NotificationVersion:
      name: NotificationVersion
      in: header
      description: "The version of the Notification API, implemented by the Initiating Party, which shall be used for notification service request. Can be filled with v2 or v3. This field is only applicable if option 'B' is chosen, see 'InitiatingPartyNotificationUrl' description. \n"
      example: v3
      schema:
        type: string
    HttpHeaderAccept:
      name: HttpHeaderAccept
      in: header
      description: 'PSU Session information.


        The forwarded IP Accept header fields consist of the corresponding

        HTTP request Accept header fields between PSU and TPP.

        '
      schema:
        maxLength: 500
        minLength: 1
        type: string
    HttpHeaderReferer:
      name: HttpHeaderReferer
      in: header
      description: 'PSU Session information.

        '
      schema:
        maxLength: 500
        minLength: 1
        type: string
    Locale:
      name: Locale
      in: header
      schema:
        type: string
      description: '2-digit ISO-639 code for the language in which the Bank Selection Interface are displayed.


        For special languages can be used 5-digit code like nl-BE, where first is ISO-639 langauge code and the second is ISO-3166 country code.


        If not set, the language of the Bank Selection Interface is taken over from the end user’s browser configuration or the system configuration of the Bank Selection Interface server.

        '
    HttpMethod:
      name: HttpMethod
      in: header
      description: 'PSU Session information.


        HTTP method used at the PSU-TPP interface. Available values - GET,

        POST, PUT, DELETE.

        '
      schema:
        maxLength: 6
        minLength: 3
        type: string
    HttpHeaderAcceptEncoding:
      name: HttpHeaderAcceptEncoding
      in: header
      description: 'PSU Session information.


        The forwarded IP Accept header fields consist of the corresponding

        HTTP request Accept header fields between PSU and TPP.

        '
      schema:
        maxLength: 500
        minLength: 1
        type: string
    AspspPsuIdType:
      name: AspspPsuIdType
      in: header
      description: 'Type of the Aspsp PSU-ID, needed in scenarios where PSUs have

        several PSU-IDs as access possibility.

        '
      schema:
        type: string
    X-Request-ID:
      name: X-Request-ID
      in: header
      description: 'UUID for unique request identification.

        '
      required: true
      schema:
        maxLength: 36
        minLength: 1
        type: string
      example: abcdef2e-3000-4000-88cc-ae40e3b113d7
    HttpHeaderAcceptCharset:
      name: HttpHeaderAcceptCharset
      in: header
      description: 'PSU Session information.


        The forwarded IP Accept header fields consist of the corresponding

        HTTP request Accept header fields between PSU and TPP.

        '
      schema:
        maxLength: 500
        minLength: 1
        type: string
    paymentId:
      name: paymentId
      in: path
      description: 'The Id used by the Open Banking Service to refer to a payment.


        Optionally the payment can also be refered by the **InitiatingPartyReferenceId** or the **EndToEndId**, to do so start with **ref** or **e2e** prefixes followed by the respective identifier.

        '
      required: true
      schema:
        type: string
      example: 486215
    PsuIpPort:
      name: PsuIpPort
      in: header
      description: 'PSU Session information.


        The forwarded IP Port header field consists of the corresponding

        HTTP request IP Port field between PSU and TPP, if available.

        '
      schema:
        maxLength: 5
        minLength: 1
        type: string
    UseAuthorisationLandingPages:
      name: UseAuthorisationLandingPages
      in: header
      schema:
        type: boolean
        default: false
      description: 'If true, Bank Selection Interface will be used to request required information from PSU directly

        '
  schemas:
    PaymentProductEnum:
      type: string
      default: PSD2-SCT
      description: 'Indicates the requested payment method.

        '
      enum:
      - PSD2-SCT
      - PSD2-SCT-Inst
      - PSD2-Target2
      - PSD2-Domestic
      - PSD2-Domestic-Inst
      - IDEAL
      - WERO
    CommonPaymentDataIdentificationResponse:
      type: object
      additionalProperties: false
      required:
      - PaymentId
      - PaymentStatus
      properties:
        PaymentId:
          maxLength: 35
          minLength: 1
          type: string
          description: 'Id generated by the Open Banking Service. This should be used to

            refer to this payment in subsequent api calls.

            '
        PaymentStatus:
          $ref: '#/components/schemas/PaymentStatusEnum'
        AuthStatus:
          $ref: '#/components/schemas/AuthStatusEnum'
        PsuMessage:
          maxLength: 1024
          minLength: 1
          type: string
          description: 'Text to be displayed to the PSU.

            '
    PaymentInitiationRequestBasic:
      type: object
      additionalProperties: false
      required:
      - Amount
      properties:
        UsePreAuthentication:
          type: boolean
          default: false
          description: 'This field is only applicable for Aspsp which support pre-authentication. It can also be filled in payments toward other ASPSP''s, but the value will then be ignored.

            * If set to true the Open Banking Service will store the pre-authentication token for use with future payments. This will only work if also a PsuId is provided which is stored in the Open Banking Service.

            * If set to false the pre-authentication token will only be used to finish one payment. After which it will be discarded.

            '
        EndToEndId:
          maxLength: 35
          minLength: 1
          type: string
          description: 'Unique identification, as assigned by the initiating party,

            to unambiguously identify the transaction. This

            identification is passed on, unchanged, throughout the

            entire end-to-end chain. Usage: The end-to-end

            identification can be used for reconciliation or to link

            tasks relating to the transaction. It can be included in

            several messages related to the transaction.

            Required for PSD2 payments

            '
          example: ID-0123456789
        InitiatingPartyReferenceId:
          maxLength: 36
          minLength: 1
          type: string
          description: 'Reference to the payment created by the Initiating Party.

            This Id will not be visible to the Payment Service User.

            Required for PSD2 payments

            '
          example: InitParty ref-id-23457890
        PreferredScaMethod:
          type: array
          description: 'Multiple preferred methods can be choosen. It is not guaranteed that the ASPSP will use the preferred method.

            '
          items:
            type: string
            enum:
            - Redirect
            - Decoupled
            - Embedded
        TransactionType:
          type: string
          description: 'Transaction type used in this transaction.

            ONLINE - Used particularly for Online transactions, e.g. a webshop

            QR - Used for transactions from a QR. eg. Invoice

            INSTORE - Used for instore transactions for eg.- a POS device

            P2P - Used for peer-to-peer (customer-to-customer) transactions, e.g. a Transaction Request

            '
          enum:
          - Online
          - QR
          - Instore
          - P2P
          default: Online
        ExpirationPeriod:
          type: integer
          description: 'Time in seconds after which the transaction will expire. If not provided a default value will be used if the `PaymentProduct` equals `IDEAL`. For ONLINE - 1200 and for INSTORE - 120. Required for QR type transactions

            '
          minimum: 60
          maximum: 3600
          exclusiveMinimum: false
          exclusiveMaximum: false
        Amount:
          $ref: '#/components/schemas/Amount'
        DebtorInformation:
          $ref: '#/components/schemas/DebtorInformation'
        CreditorInformation:
          $ref: '#/components/schemas/CreditorInformation'
        ChargeBearer:
          type: string
          description: 'Charge bearer.


            Note - ISO20022 ChargeBearerType1Code.

            '
          enum:
          - DEBT
          - CRED
          - SHAR
          - SLEV
        PurposeCode:
          type: string
          description: 'Specifies the purpose code that resulted in a payment initiation.

            Fill with a 4 characters code from the ExternalPurpose1Code list published

            by ISO20022 or use the values ‘Commerce’, ‘Carpark’, ‘Transport’.

            '
        CategoryPurpose:
          $ref: '#/components/schemas/CategoryPurposeEnum'
        PaymentContext:
          $ref: '#/components/schemas/RiskInformation'
        CrossCurrencyPayments:
          $ref: '#/components/schemas/CrossCurrencyPayment'
        RegulatoryReportingCodes:
          maxItems: 10
          minItems: 1
          type: array
          description: 'List of needed regulatory reporting codes for international payments

            '
          items:
            $ref: '#/components/schemas/RegulatoryReportingCode'
          x-DefinitionType: ISO20022
        RemittanceInformation:
          maxLength: 140
          minLength: 1
          type: string
          description: 'Information supplied to enable the matching of an entry with

            the items that the transfer is intended to settle. This information

            will be visible to the Payment Service User.


            **Conditional validation:**

            * In case the PaymentProduct is set to IDEAL the maxLength is limited to 35

            '
        RemittanceInformationStructured:
          $ref: '#/components/schemas/RemittanceInformationStructured'
        PrintOptions:
          $ref: '#/components/schemas/PrintOptions'
      description: 'Basic type for Payment Initiation Request

        '
    EstimatedTotalAmount:
      type: object
      additionalProperties: false
      required:
      - Currency
      - Amount
      properties:
        Currency:
          pattern: '[A-Z]{3,3}'
          type: string
          description: 'A code allocated to a currency by a Maintenance Agency under

            an international identification scheme, as described in the latest edition

            of the international standard ISO 4217 "Codes for the representation of

            currencies and funds".

            '
        Amount:
          pattern: ^\d{1,13}\.\d{1,2}$
          type: string
          description: 'Amount

            '
      description: 'Estimated Total Amount.

        '
    IDEALPayments:
      type: object
      additionalProperties: false
      properties:
        UseDebtorToken:
          type: boolean
          default: false
          description: 'Identifies whether the debtor token generated by Access Point should be used

            '
        DebtorTokenCallbackUrl:
          type: string
          description: 'The URL which will be used by the notification service post /debtorToken API to send  the debtor token provided by the iDEAL Hub. The URL should end with the version number of the notification service. This way the Initiating Party can influence which version of the notification service is used to send the request. At the moment only ''/v3'' is available. The DebtorTokenCallbackUrl can also be set in the Initiating Party service subscription.

            '
          example: https://www.example.org/myendpoint/v3
        FlowType:
          type: string
          enum:
          - Standard
          - FastCheckout
          description: 'Transaction flow which the Merchant/CPSP desires to initiate.

            * _Standard_ - Used for normal iDEAL transactions.

            * _FastCheckout_ - Used for initiating the fast checkout flow where the debtor will be requested to provide checkout details which in turn iDEAL provides them to the merchant via a callback eventually.'
          default: Standard
        ExpectedCheckoutData:
          type: object
          additionalProperties: false
          description: 'By this the Merchant is requesting the checkout data from the iDEAL Hub with the finalization of the transaction.

            '
          properties:
            DebtorContactDetails:
              $ref: '#/components/schemas/DebtorContactDetails'
            ShippingAddress:
              type: boolean
              description: 'Request to provide the details of the shipping address of the debtor

                '
              example: true
              default: false
            BillingAddress:
              type: boolean
              description: 'Request to provide the details of the billing address of the debtor

                '
              example: true
              default: false
    AddressData:
      type: object
      additionalProperties: false
      properties:
        FirstName:
          type: string
          description: 'The first name of the debtor

            '
          example: Bob
          minLength: 1
        LastName:
          type: string
          description: 'The last name of the debtor

            '
          example: Smith
          minLength: 1
        CompanyName:
          type: string
          description: 'The company name of the debtor

            '
          example: Cookie factory
          minLength: 1
        PostCode:
          type: string
          description: 'The postal code of the address without spaces

            '
          example: 1234AB
          minLength: 1
        BuildingNumber:
          type: string
          description: 'The house number of the address

            '
          example: '100'
          minLength: 1
        Floor:
          type: string
          description: 'The addition of the address

            '
          example: 3B
          minLength: 1
        StreetName:
          type: string
          description: 'The street of the address

            '
          example: Coolsingel
          minLength: 1
        TownName:
          type: string
          description: 'The city of the address

            '
          example: Rotterdam
          minLength: 1
        Country:
          type: string
          description: 'The code of the coutry regarding ISO 3166 standard. For the IDEAL payments the country name will be provided

            '
          minLength: 1
        CountrySubDivision:
          type: string
          description: 'Country sub division.

            '
          maxLength: 35
          minLength: 1
    InitiationResponseLinks:
      type: object
      additionalProperties: false
      description: 'A list of hyperlinks to be recognized by the Initiating Party. The actual

        hyperlinks used in the response depend on the dynamical decisions on

        authorization approach for example. Remark - All links are full links.

        * ''PreAuthenticationForEmbedded'': In case of an embedded pre-authentication required by the ASPSP, the Initiating Party has to use this link.

        * ''RedirectUrl'': In case of an Redirect approach, the Initiating Party has to use this link to redirect the PSU’s browser session.

        * ''PostAuthorisationForExplicit'': In case the ASPSP requires explicit start of authorization.

        * ''PostIdentificationForDecoupled'': In case of a Decoupled approach, identification of the PSU required to start the decoupled authorization.

        * ''PostAuthorisationForEmbedded'': In case of an embedded approach, endpoint to be called to start the embedded authorization.

        * ''SelectAuthenticationMethod'': In case of an embedded approach, the Initiating Party has to use this link to pass the SCA method.

        * ''AuthorizeTransaction'': In case of an embedded approach, the Initiating Party has to authorize the payment by providing the SCA OneTimePassword.

        * ''ConfirmationRequired'': Endpoint to be called for payment confirmation for ASPSPs that require explicit confirmation of payments.

        * ''GetPaymentStatus'': Endpoint to be called for retrieving the payment status.

        * ''PrintLink'': A link to return a payment link. The payment link can be used by the PSU to authorize the payment. Lifetime is dictated by the PrintOptions parameter.

        * ''PrintQRCode'': A link to retrieve a QR code. The QR code can be used by the PSU to authorize the payment. Lifetime is dictated by the PrintOptions parameter.

        '
      properties:
        PreAuthenticationForEmbedded:
          $ref: '#/components/schemas/Link'
        RedirectUrl:
          $ref: '#/components/schemas/Link'
        PostAuthorisationForExplicit:
          $ref: '#/components/schemas/Link'
        PostIdentificationForDecoupled:
          $ref: '#/components/schemas/Link'
        PostAuthorisationForEmbedded:
          $ref: '#/components/schemas/Link'
        SelectAuthenticationMethod:
          $ref: '#/components/schemas/Link'
        AuthorizeTransaction:
          $ref: '#/components/schemas/Link'
        ConfirmationRequired:
          $ref: '#/components/schemas/Link'
        GetPaymentStatus:
          $ref: '#/components/schemas/Link'
        PrintLink:
          $ref: '#/components/schemas/Link'
        PrintQRCode:
          $ref: '#/components/schemas/Link'
    Links:
      type: object
      additionalProperties: false
      description: 'A list of hyperlinks to be recognized by the Initiating Party. The actual

        hyperlinks used in the response depend on the dynamical decisions on

        authorization approach for example. Remark - All links are full links.


        * ''GetPaymentStatus'': Endpoint to be called for retrieving the payment status.

        '
      properties:
        GetPaymentStatus:
          $ref: '#/components/schemas/Link'
    ProductSpecificMasterData:
      type: object
      additionalProperties: false
      required:
      - ParamName
      - ParamValue
      properties:
        ParamName:
          type: string
          minLength: 1
          maxLength: 250
          description: 'Name of the parameter exactly as required by the payment method.

            '
        ParamValue:
          type: string
          minLength: 1
          maxLength: 2048
          description: 'Actual value of the parameter.

            '
    CommonPaymentDataResponse:
      type: object
      additionalProperties: false
      required:
      - PaymentId
      - PaymentStatus
      properties:
        ExpiryDateTimestamp:
          type: string
          format: date-time
          description: 'The timestamp from which the transaction operation will expire, expressed in UTC time format(YYYY-MM-DDThh:mm:ss.sssZ)

            '
        GuaranteedAmount:
          description: 'The amount guaranteed by the ASPSP/Issuer to the Merchant/CPSP. Will be provided if the min max amount values are defined in the request

            '
          pattern: ^\d{1,13}\.\d{1,5}$
          type: string
          example: '123.45'
        PaymentStatus:
          $ref: '#/components/schemas/PaymentStatusEnum'
        LevelOfGuarantee:
          $ref: '#/components/schemas/LevelOfGuaranteeEnum'
        PaymentId:
          maxLength: 35
          minLength: 1
          type: string
          description: 'Id generated by the Open Banking Service. This should be used to

            refer to this payment in subsequent api calls.

            '
        AspspPaymentId:
          maxLength: 35
          minLength: 1
          type: string
          description: 'Id used by the ASPSP/iDEAL Hub to refer to the payment.

            '
        AspspId:
          maxLength: 35
          minLength: 1
          type: string
          description: 'Id of the ASPSP selected by the PSU.

            '
        InitiatingPartyReferenceId:
          maxLength: 36
          minLength: 1
          type: string
          description: 'Reference to the payment created by the Initiating Party.

            This Id will not be visible to the Payment Service User.

            '
        FundsAvailable:
          type: boolean
          description: 'Information whether sufficient funding is available.

            '
        DebtorInformation:
          $ref: '#/components/schemas/DebtorInformationResponse'
        AmountRelatedDetails:
          $ref: '#/components/schemas/AmountRelatedDetails'
        AuthorisationRequiredData:
          $ref: '#/components/schemas/AuthorisationRequiredData'
        PsuMessage:
          maxLength: 1024
          minLength: 1
          type: string
          description: 'Text to be displayed to the PSU.

            '
    AuthorisationRequiredData:
      type: object
      additionalProperties: false
      description: 'The data required for PSU authentication and transaction authorisation

        '
      properties:
        PsuCredentials:
          type: array
          description: 'List of credentials the PSU has on the ASPSP''s system. The PSU has to provide the CredentialValue for each of these (Username & Password).

            '
          items:
            $ref: '#/components/schemas/PsuCredentials'
        ScaMethods:
          type: array
          description: 'Array of available ScaMethods.

            '
          items:
            $ref: '#/components/schemas/ScaMethods'
        ChosenScaMethod:
          $ref: '#/components/schemas/ScaMethods'
        ChallengeData:
          $ref: '#/components/schemas/ScaChallengeData'
    CreditorAccount:
      type: object
      additionalProperties: false
      properties:
        SecondaryIdentification:
          type: string
          description: 'Secondary identification of the Creditor Account, to which

            a credit entry will be made as a result of the transaction. (Only Openbank

            UK)

            '
        SchemeName:
          $ref: '#/components/schemas/IdentificationTypeEnum'
        Identification:
          type: string
          description: 'Identification of the Creditor Account. Can be given for P2P

            payments only.

            '
        Currency:
          pattern: '[A-Z]{3,3}'
          type: string
          description: 'A code allocated to a currency by a Maintenance Agency under

            an international identification scheme, as described in the latest edition

            of the international standard ISO 4217 "Codes for the representation of

            currencies and funds".

            '
    BillingAddress:
      type: object
      additionalProperties: false
      properties:
        SameAsShippingAddress:
          type: boolean
          default: false
          description: 'Indicates whether the billing addess is the same with shipping address. If true the information provided under `BillingAddressDetails` will be ignored

            '
        BillingAddressDetails:
          $ref: '#/components/schemas/AddressData'
    DebtorContactDetailsResponse:
      type: object
      additionalProperties: false
      properties:
        FirstName:
          type: string
          description: 'The first name of the debtor

            '
        LastName:
          type: string
          description: 'The last name of the debtor

            '
        PhoneNumber:
          type: string
          description: 'The phone number of the debtor in E.164 format

            '
          pattern: ^\+[1-9][0-9]{1,14}$
          example: '+31612345678'
        Email:
          type: string
          description: 'The e-mail address of the debtor

            '
          format: email
          example: bob.smith@mymail.com
          minLength: 1
    PaymentQrCodeResponse:
      type: object
      properties:
        MimeType:
          type: string
          example: image/png
        QrCodeImage:
          type: string
          format: byte
    PaymentIdentificationResponse:
      description: 'PaymentIdentificationresponse

        '
      type: object
      additionalProperties: false
      properties:
        CommonPaymentData:
          $ref: '#/components/schemas/CommonPaymentDataIdentificationResponse'
        Links:
          $ref: '#/components/schemas/Links'
    ExchangeRateInformationResponse:
      type: object
      additionalProperties: false
      properties:
        UnitCurrency:
          pattern: '[A-Z]{3,3}'
          type: string
          description: 'Currency in which the rate of exchange is expressed in a currency

            exchange. In the example 1GBP = xxxCUR, the unit currency is GBP.

            '
        ExchangeRate:
          type: number
          description: 'The factor used for conversion of an amount from one currency

            to another. This reflects the price at which one currency was bought with

            another currency. Rate expressed as a decimal, for example, 0.7 is 7/10

            and 70%.

            '
        RateType:
          type: string
          description: 'Specifies the type used to complete the currency exchange.

            * Spot: Exchange rate applied is the spot rate.

            * Sale: Exchange rate applied is the market rate at the time of the sale.

            * Agreed: Exchange rate applied is the rate agreed between the parties.

            '
          enum:
          - Spot
          - Sale
          - Agreed
        ContractIdentification:
