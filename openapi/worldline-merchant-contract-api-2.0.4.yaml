components:
  schemas:
    HoldingListData:
      type: object
      properties:
        contractIdentification:
          type: object
          properties:
            acquirerId:
              type: string
              description: Unique identification of the acquirer, determined by equensWorldline
              example: "315000001"
        holdingId:
          type: integer
          description: Unique identification of the holding, determined by equensWorldline
          format: int32
          example: 200
        holdingName:
          type: string
          description: Name of the holding
          example: Event Payment Solutions
        status:
          type: string
          description: The status of this entity. Values [Active]
          example: Active
        address:
          $ref: '#/components/schemas/Address'
        holdingDetailsURI:
          type: string
          description: URI to get the holding details
          example: acquiring/contract/v2.0/acquirers/XXX/holdings/XXX
    MerchantListData:
      type: object
      properties:
        contractIdentification:
          type: object
          properties:
            acquirerId:
