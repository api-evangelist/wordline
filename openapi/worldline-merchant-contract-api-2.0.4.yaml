  /acquiring/contract/v2.0/acquirers/{acquirerId}/terminals:
    get:
      tags:
      - Terminal
      summary: Search terminals
      description: |
        This operation retrieves a list of terminals. Terminated terminals are excluded.
      operationId: getTerminalOverviewList
      parameters:
      - name: acquirerId
        in: path
        description: Unique identification of the acquirer, determined by equensWorldline
        required: true
        schema:
          type: string
      - name: iban
        in: query
        description: |
          International Bank Account Number for merchant payments
        schema:
          type: string
      - name: holdingId
        in: query
        description: |
          Unique identification of the holding, determined by equensWorldline
        schema:
          type: integer
          format: int32
      - name: merchantId
        in: query
        description: |
          Unique identification of the merchant, determined by the acquirer
        schema:
          type: string
      - name: contractId
        in: query
        description: |
          Unique identification of the contract, determined by the acquirer
        schema:
          type: string
      - name: siteId
        in: query
        description: |
          Unique identification of the site within the contract
        schema:
          type: integer
          format: int32
      - name: cardAcceptorId
        in: query
        description: |
          Unique identification of the site in accordance with payment scheme rules. Some Dutch acquirers have a waiver not to fill this field. In that case it contains the merchant ID
        schema:
          type: string
      - name: terminalId
        in: query
        description: |
          Identification of the terminal. Within the Dutch model a terminal ID uniquely identifies one specific physical device. Within other terminal models the terminal ID is only considered unique within the context of its own site (card acceptor ID)
        schema:
          type: string
      - name: merchantName
        in: query
        description: |
          Name of the merchant
        schema:
          type: string
      - name: contractName
        in: query
        description: |
          Optional name for this specific contract
        schema:
          type: string
      - name: siteName
        in: query
        description: |
          Name of the site
        schema:
          type: string
      - name: sortField
        in: query
        description: |
          Sort field
        schema:
          type: string
          enum:
          - terminalId
          - nameOnStatement
      - name: sortOrder
        in: query
        description: |
          Sort order
        schema:
          type: string
          enum:
          - Ascending
          - Descending
      - name: pageSize
        in: query
        description: Page size (Max page size is 300)
        schema:
          type: string
