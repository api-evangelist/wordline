openapi: 3.0.1
info:
  title: Merchant - Contract API
  description: This is the API server supplied by equensWorldline.
  contact:
    name: Worldline FS Acquiring Processing API team.
    url: https://financial-services.developer.worldline.com/
    email: dl-fr-dp2si-acquiring@worldline.com
  license:
    name: proprietary Worldline Financial Services
  version: 2.0.4
#####################################################################################################################
#version 2.0.4 (15-07-2024)
#- Add field visaEnablerVerificationValue to 
#  - GET   /acquiring/contract/v2.0/acquirers/{acquirerId}/sites/{cardAcceptorId}
#  - GET   /acquiring/contract/v2.0/acquirers/{acquirerId}/contracts/{contractId}/sites/{siteId}
#  - PATCH /acquiring/contract/v2.0/acquirers/{acquirerId}/contracts/{contractId}/sites/{siteId}
#  - POST  /acquiring/contract/v2.0/acquirers/{acquirerId}/contracts/{contractId}/sites
#  - GET   /acquiring/contract/v2.0/acquirers/{acquirerId}/sites/{cardAcceptorId}/terminals/{terminalId}
#  - GET   /acquiring/contract/v2.0/acquirers/{acquirerId}/contracts/{contractId}/sites/{siteId}/terminals/{terminalId}
#  - PATCH /acquiring/contract/v2.0/acquirers/{acquirerId}/contracts/{contractId}/sites/{siteId}/terminals/{terminalId}
#  - POST  /acquiring/contract/v2.0/acquirers/{acquirerId}/contracts/{contractId}/sites/{siteId}/terminals
#
#- Add header field includeTerminated to all GET calls
#
#- Add field commencementDate to responses in
#  -  GET /acquiring/contract/v2.0/acquirers/{acquirerId}/contracts
#  -  GET /acquiring/contract/v2.0/acquirers/{acquirerId}/sites
#  -  GET /acquiring/contract/v2.0/acquirers/{acquirerId}/terminals
#
#version 2.0.3 (21-02-2024)
#- Add field visaMerchantVolumeIndicator to existing calls:
#  - POST   /acquiring/contract/v2.0/acquirers/{acquirerId}/merchants
#  - GET    /acquiring/contract/v2.0/acquirers/{acquirerId}/merchants/{merchantId}
#  - PATCH  /acquiring/contract/v2.0/acquirers/{acquirerId}/merchants/{merchantId}
#
#- Add fields matTransactionLimitContactless and matCardholderVerificationLimit to existing calls:
#  - GET    /acquiring/contract/v2.0/acquirers/{acquirerId}/contracts/{contractId}/brands
#  - PATCH  /acquiring/contract/v2.0/acquirers/{acquirerId}/contracts/{contractId}/brands
#  - GET    /acquiring/contract/v2.0/acquirers/{acquirerId}/sites/{siteId}/brands
#  - PATCH  /acquiring/contract/v2.0/acquirers/{acquirerId}/sites/{siteId}/brands
#  - GET    /acquiring/contract/v2.0/acquirers/{acquirerId}/sites/{siteId}/terminals/{terminalId}/brands
#  - PATCH  /acquiring/contract/v2.0/acquirers/{acquirerId}/sites/{siteId}/terminals/{terminalId}/brands
#
#version 2.0.2 (28-06-2023)
#- new Calls based on cardAcceptorId:
#  - POST   /acquiring/contract/v2.0/acquirers/{acquirerId}/sites
#  - GET    /acquiring/contract/v2.0/acquirers/{acquirerId}/sites/{cardAcceptorId}
#  - DELETE /acquiring/contract/v2.0/acquirers/{acquirerId}/sites/{cardAcceptorId}
#  - PATCH  /acquiring/contract/v2.0/acquirers/{acquirerId}/sites/{cardAcceptorId}
#  - GET    /acquiring/contract/v2.0/acquirers/{acquirerId}/sites/{cardAcceptorId}/addresses
#  - PATCH  /acquiring/contract/v2.0/acquirers/{acquirerId}/sites/{cardAcceptorId}/addresses
#  - POST   /acquiring/contract/v2.0/acquirers/{acquirerId}/sites/{cardAcceptorId}/terminals
#  - GET    /acquiring/contract/v2.0/acquirers/{acquirerId}/sites/{cardAcceptorId}/terminals/{terminalId}
#  - DELETE /acquiring/contract/v2.0/acquirers/{acquirerId}/sites/{cardAcceptorId}/terminals/{terminalId}
#  - PATCH  /acquiring/contract/v2.0/acquirers/{acquirerId}/sites/{cardAcceptorId}/terminals/{terminalId}
#  - GET    /acquiring/contract/v2.0/acquirers/{acquirerId}/sites/{cardAcceptorId}/terminals/{terminalId}/addresses
#
#- new Call:
#  - POST   /acquiring/contract/v2.0/acquirers/{acquirerId}/contracts/{contractId}/currencies
#
#- Add optional contractId to SITE entity in post body
#  - POST   /acquiring/contract/v2.0/acquirers/{acquirerId}/sites
#  - POST   /acquiring/contract/v2.0/acquirers/{acquirerId}/contracts/{contractId}/sites
#
#- Add field paymentFacilitatorName to existing calls:
#  - POST   /acquiring/contract/v2.0/acquirers/{acquirerId}/merchants
#  - GET    /acquiring/contract/v2.0/acquirers/{acquirerId}/merchants/{merchantId}
#  - PATCH  /acquiring/contract/v2.0/acquirers/{acquirerId}/merchants/{merchantId}
#
#version 2.0.1 (02-12-2022)
#- new Calls:
#  - POST /acquiring/contract/v2.0/acquirers/{acquirerId}/holdings
#  - PATCH /acquiring/contract/v2.0/acquirers/{acquirerId}/holdings/{holdingId}
#  - DELETE /acquiring/contract/v2.0/acquirers/{acquirerId}/holdings/{holdingId}
#  - GET /acquiring/contract/v2.0/acquirers/{acquirerId}/terminals/{terminalId}/checknumbers/{checkNumber}
#
#v2_comments (10-10-2022)
#- Add merchant POST/PATCH/DELETE addresses
#- Search holdings/merchants/contracts in CIM (instead of swan). Note: no swagger change
#- Remove url from POST/GET sites
#- GET contract bug fixes:
#  - change serviceProviders to serviceProvider
#  - change independentSalesOrganisationId to independentSalesOrganizationId
#  - change paymetServiceProviderId to paymentServiceProviderId
#
#v2_comments (07-07-2022)
#- Add optional applyToAll query param to PATCH TerminalBrands, SiteBrands, ContractBrands 
#
#v2_comments (03-06-2022)
#- Add new calls: POST Contract, PATCH Contract, POST Contract Addresses, PATCH Contract Addresses, DELETE Contract Address, POST Contract Balances, PATCH Contract Balances, POST Contract Brands, PATCH Contract Brands, DELETE Contract Brand, POST Merchant, PATCH Merchant, DELETE Merchant
#
#v2_comments (21-03-2022)
#- Add rejectedProductTypes to GET brands (terminal, site, contract)
#
#v2_comments (22-12-2021)
#- Terminal and Site search to CIM (instead of Swan)
#- Remove prev/next headers for Terminal and Site search
#
#####################################################################################################################
servers:
- url: /MerchantApiContract/api
paths:
  /acquiring/contract/v2.0/acquirers/{acquirerId}/holdings:
    get:
      tags:
      - Holding
      summary: Search holdings
      description: |
        This operation retrieves a list of holdings. Terminated holdings are excluded.
        The acquirerId is a mandatory parameter.

        If there is a previous and/or next page the http response header will have a link (url) to this data
      operationId: getHoldingOverviewList
      parameters:
      - name: acquirerId
        in: path
        description: Unique identification of the acquirer, determined by equensWorldline
        required: true
        schema:
          type: string
      - name: holdingId
        in: query
        description: |
          Unique identification of the holding, determined by equensWorldline
        schema:
          type: integer
          format: int32
      - name: holdingName
        in: query
        description: |
          Name of the holding
        schema:
          type: string
      - name: sortField
        in: query
        description: |
          Sort field
        schema:
          type: string
          enum:
          - HoldingId
          - HoldingName
      - name: sortOrder
        in: query
        description: |
          Sort order
        schema:
          type: string
          enum:
          - Ascending
          - Descending
      - name: pageSize
        in: query
        description: Page size
        schema:
          type: string
      - name: pageNumber
        in: query
        description: Page number
        schema:
          type: string
      - name: includeTerminated
        in: header
        description: Indicates whether terminated items should be included in the response of the GET call. Default value is 'false' (no terminated items included).
        schema:
          type: boolean
      responses:
        200:
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HoldingListData'
              example:
              - contractIdentification:
                  acquirerId: "315000001"
                holdingId: 200
                holdingName: Event Payment Solutions
                status: Active
                address:
                  streetName: Stootblok
                  houseNumber: 14
                  postalCode: 3071AP
                  city: Rotterdam
                  countryCode: 528
                  contactPersonName: M. Scott
                  email: M.Scott@eventpaymentsolutions.com
                holdingDetailsURI: acquiring/contract/v2.0/acquirers/315000001/holdings/200
              - contractIdentification:
                  acquirerId: "315000001"
                holdingId: 300
                holdingName: Great Groceries
                status: Active
                address:
                  streetName: Utrechtsestraat
                  houseNumber: 17
                  postalCode: 1017VH
                  city: Amsterdam
                  countryCode: 528
                  contactPersonName: W. Kilbourne
                  email: W.Kilbourne@GreatGroceries.com
                holdingDetailsURI: acquiring/contract/v2.0/acquirers/315000001/holdings/300
        400:
          description: Invalid input provided
          content: {}
        401:
          description: Unauthorized
          content: {}
        403:
          description: Forbidden
          content: {}
        404:
          description: Resource not found
          content: {}
        500:
          description: Unexpected error
          content: {}
        502:
          description: Backend service problem
          content: {}
    post:
      tags:
      - Holding
      summary: Add a holding
      operationId: PostHolding
      parameters:
      - name: acquirerId
        in: path
        description: Unique identification of the acquirer, determined by equensWorldline
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PostHolding'
          application/json:
            schema:
              $ref: '#/components/schemas/PostHolding'
          text/json:
            schema:
              $ref: '#/components/schemas/PostHolding'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PostHolding'
        required: true
      responses:
        201:
          description: Change is processed with correlation id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostHoldingResponse'
        400:
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Unauthorized
          content: {}
        403:
          description: Forbidden
          content: {}
        404:
          description: Resource not found
          content: {}
        500:
          description: Unexpected error
          content: {}
        502:
          description: Backend service problem
          content: {}
  /acquiring/contract/v2.0/acquirers/{acquirerId}/holdings/{holdingId}:
    get:
      tags:
      - Holding
      summary: Retrieve a holding
      description: |
        This operation retrieves a holding.
      operationId: getHolding
      parameters:
      - name: acquirerId
        in: path
        description: Unique identification of the acquirer, determined by equensWorldline
        required: true
        schema:
          type: string
      - name: holdingId
        in: path
        description: |
          Unique identification of the holding, determined by equensWorldline
        required: true
        schema:
          type: integer
          format: int32
      - name: includeTerminated
        in: header
        description: Indicates whether terminated items should be included in the response of the GET call. Default value is 'false' (no terminated items included).
        schema:
          type: boolean
      responses:
        200:
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingData'
              example:
                contractIdentification:
                  acquirerId: "315000001"
                  holdingId: 200
                basic:
                  acquirerName: Worldline Sandbox Bank
                  holdingName: Event Payment Solutions
                status:
                  status: Active
                  commencementDate: 2022-12-09
                addressDetailsURI: acquiring/contract/v2.0/acquirers/315000001/holdings/200/addresses
        400:
          description: Invalid input provided
          content: {}
        401:
          description: Unauthorized
          content: {}
        403:
          description: Forbidden
          content: {}
        404:
          description: Resource not found
          content: {}
        500:
          description: Unexpected error
          content: {}
        502:
          description: Backend service problem
          content: {}
    delete:
      tags:
      - Holding
      summary: Terminate a holding
      operationId: deleteHolding
      parameters:
      - name: acquirerId
        in: path
        description: Unique identification of the acquirer, determined by equensWorldline
        required: true
        schema:
          type: string
      - name: holdingId
        in: path
        description: |
          Unique identification of the holding, determined by equensWorldline
        required: true
        schema:
          type: integer
          format: int32
      responses:
        200:
          description: Termination of the holding is processed with correlation id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrelationResponse'
        400:
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Unauthorized
          content: {}
        403:
          description: Forbidden
          content: {}
        404:
          description: Resource not found
          content: {}
        500:
          description: Unexpected error
          content: {}
        502:
          description: Backend service problem
          content: {}
    patch:
      tags:
      - Holding
      summary: Update a holding
      description: "Fields that can be used: /basic/holdingName**\r\nOperations that\
        \ can be used: **replace**\r\nSample request: \r\n\r\n    [\r\n       {\r\n\
        \           \"value\": \"MyHolding\",\r\n           \"path\": \"/basic/holdingName\"\
        ,\r\n           \"op\": \"replace\"             \r\n       }\r\n    ]"
      operationId: patchHolding
      parameters:
      - name: acquirerId
        in: path
        description: Unique identification of the acquirer, determined by equensWorldline
        required: true
        schema:
          type: string
      - name: holdingId
        in: path
        description: |
          Unique identification of the holding, determined by equensWorldline
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
        required: false
      responses:
        200:
          description: Change is processed with correlation id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrelationResponse'
        400:
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Unauthorized
          content: {}
        403:
          description: Forbidden
          content: {}
        404:
          description: Resource not found
          content: {}
        500:
          description: Unexpected error
          content: {}
        502:
          description: Backend service problem
          content: {}
  /acquiring/contract/v2.0/acquirers/{acquirerId}/holdings/{holdingId}/addresses:
    get:
      tags:
      - Holding
      summary: Retrieve the addresses of a holding
      description: |
        This operation retrieves addresses of a holding.
      operationId: getHoldingAddresses
      parameters:
      - name: acquirerId
        in: path
        description: Unique identification of the acquirer, determined by equensWorldline
        required: true
        schema:
          type: string
      - name: holdingId
        in: path
        description: |
          Unique identification of the holding, determined by equensWorldline
        required: true
        schema:
          type: integer
          format: int32
      - name: includeTerminated
        in: header
        description: Indicates whether terminated items should be included in the response of the GET call. Default value is 'false' (no terminated items included).
        schema:
          type: boolean
      responses:
        200:
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingAddressData'
              example:
                contractIdentification:
                  acquirerId: "315000001"
                  holdingId: 200
                addresses:
                - addressType: Business
                  streetName: Stootblok
                  houseNumber: 14
                  postalCode: 3071AP
                  city: Rotterdam
                  countryCode: 528
                  contactPersonName: M. Scott
                  email: M.Scott@eventpaymentsolutions.com
                  communicationLanguage: eng
                  communicationPreference: 3
        400:
          description: Invalid input provided
          content: {}
        401:
          description: Unauthorized
          content: {}
        403:
          description: Forbidden
          content: {}
        404:
          description: Resource not found
          content: {}
        500:
          description: Unexpected error
          content: {}
        502:
          description: Backend service problem
          content: {}
  /acquiring/contract/v2.0/acquirers/{acquirerId}/merchants:
    get:
      tags:
      - Merchant
      summary: Search merchants
      description: |
        This operation retrieves a list of merchants. Terminated merchants are excluded.

        If there is a previous and/or next page the http response header will have a link (url) to this data
      operationId: getMerchantOverviewList
      parameters:
      - name: acquirerId
        in: path
        description: Unique identification of the acquirer, determined by equensWorldline
        required: true
        schema:
          type: string
      - name: iban
        in: query
        description: |
          International Bank Account Number for merchant payments
        schema:
          type: string
      - name: holdingId
        in: query
        description: |
          Unique identification of the holding, determined by equensWorldline
        schema:
          type: integer
          format: int32
      - name: merchantId
        in: query
        description: |
          Unique identification of the merchant, determined by the acquirer
        schema:
          type: string
      - name: merchantName
        in: query
        description: |
          Name of the merchant
        schema:
          type: string
      - name: postalCode
        in: query
        description: |
          Postal code of business address.
        schema:
          type: string
      - name: houseNumber
        in: query
        description: |
          Housenumber of business address. Note, Postalcode must be given too
        schema:
          type: integer
          format: int32
      - name: terminalId
        in: query
        description: |
          Identification of the terminal. Within the Dutch model a terminal ID uniquely identifies one specific physical device. Within other terminal models the terminal ID is only considered unique within the context of its own site (card acceptor ID)
        schema:
          type: string
      - name: cardAcceptorId
        in: query
        description: |
          Unique identification of the site in accordance with payment scheme rules. Some Dutch acquirers have a waiver not to fill this field. In that case it contains the merchant ID
        schema:
          type: string
      - name: sortField
        in: query
        description: |
          Sort field
        schema:
          type: string
          enum:
          - merchantId
          - merchantName
      - name: sortOrder
        in: query
        description: |
          Sort order
        schema:
          type: string
          enum:
          - Ascending
          - Descending
      - name: pageSize
        in: query
        description: Page size (Max page size is 300)
        schema:
          type: string
      - name: pageNumber
        in: query
        description: Page number
        schema:
          type: string
      - name: includeTerminated
        in: header
        description: Indicates whether terminated items should be included in the response of the GET call. Default value is 'false' (no terminated items included).
        schema:
          type: boolean
      responses:
        200:
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MerchantListData'
              example:
              - contractIdentification:
                  acquirerId: "315000001"
                  holdingId: 200
                merchantId: "1001"
                merchantName: Event Payment Solutions 1
                status: Active
                address:
                  streetName: Stootblok
                  houseNumber: 14
                  postalCode: 3071AP
                  city: Rotterdam
                  countryCode: 528
                  contactPersonName: M. Scott
                  email: M.Scott@eventpaymentsolutions.com
                merchantDetailsURI: acquiring/contract/v2.0/acquirers/315000001/merchants/1001
              - contractIdentification:
                  acquirerId: "315000001"
                  holdingId: 300
                merchantId: "2001"
                merchantName: Great Groceries 1
                status: Active
                address:
                  streetName: Utrechtsestraat
                  houseNumber: 17
                  postalCode: 1017VH
                  city: Amsterdam
                  countryCode: 528
                  contactPersonName: W. Kilbourne
                  email: W.Kilbourne@GreatGroceries.com
                merchantDetailsURI: acquiring/contract/v2.0/acquirers/315000001/merchants/2001
        400:
          description: Invalid input provided
          content: {}
        401:
          description: Unauthorized
          content: {}
        403:
          description: Forbidden
          content: {}
        404:
          description: Resource not found
          content: {}
        500:
          description: Unexpected error
          content: {}
        502:
          description: Backend service problem
          content: {}
    post:
      tags:
      - Merchant
      summary: Add a merchant
      operationId: PostMerchant
      parameters:
      - name: acquirerId
        in: path
        description: Unique identification of the acquirer, determined by equensWorldline
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PostMerchant'
          application/json:
            schema:
              $ref: '#/components/schemas/PostMerchant'
          text/json:
            schema:
              $ref: '#/components/schemas/PostMerchant'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PostMerchant'
        required: true
      responses:
        201:
          description: Change is processed with correlation id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostMerchantResponse'
        400:
          description: Invalid input provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Unauthorized
          content: {}
        403:
          description: Forbidden
          content: {}
        404:
          description: Resource not found
          content: {}
        500:
          description: Unexpected error
          content: {}
        502:
          description: Backend service problem
          content: {}
  /acquiring/contract/v2.0/acquirers/{acquirerId}/merchants/{merchantId}:
    get:
      tags:
      - Merchant
      summary: Retrieve a merchant
      description: |
        This operation retrieves a merchant.
      operationId: getMerchant
      parameters:
      - name: acquirerId
        in: path
        description: Unique identification of the acquirer, determined by equensWorldline
        required: true
        schema:
          type: string
      - name: merchantId
        in: path
        description: |
          Unique identification of the merchant, determined by the acquirer
        required: true
        schema:
          type: string
      - name: includeTerminated
        in: header
        description: Indicates whether terminated items should be included in the response of the GET call. Default value is 'false' (no terminated items included).
        schema:
          type: boolean
      responses:
        200:
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantData'
              example:
                contractIdentification:
                  acquirerId: "315000001"
                  merchantId: "1001"
                basic:
                  acquirerName: Worldline Sandbox Bank
                  merchantName: Event Payment Solutions 1
                  MasterCardPaymentFacilitatorId: "200000"
                  VisaPaymentFacilitatorId: "10000000"
                refundLimits:
                  maximumDailyRefundAmountMerchant: "200000.00"
                status:
                  status: Active
                  commencementDate: 2022-12-09
                addressDetailsURI: acquiring/contract/v2.0/acquirers/315000001/merchants/1001/addresses
        400:
          description: Invalid input provided
          content: {}
        401:
          description: Unauthorized
          content: {}
        403:
          description: Forbidden
          content: {}
        404:
          description: Resource not found
          content: {}
        500:
          description: Unexpected error
          content: {}
        502:
          description: Backend service problem
          content: {}
    delete:
      tags:
      - Merchant
      summary: Delete a merchant
      operationId: deleteMerchant
      parameters:
      - name: acquirerId
        in: path
        description: Unique identification of the acquirer, determined by equensWorldline
        required: true
        schema:
          type: string
      - name: merchantId
        in: path
        description: |
          Unique identification of the merchant, determined by the acquirer
        required: true
        schema:
          type: string
      responses:
        200:
          description: Termination of the merchant is processed with correlation id
          content:
