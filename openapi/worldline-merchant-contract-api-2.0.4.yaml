    patch:
      tags:
      - Terminal
      summary: Update the brand parameters of a terminal
      description: "Based on a GET Terminal Brands call a PATCH Terminal Brands call\
        \ can be generated to change one or more fields of one or more brands. Whether\
        \ it is allowed to change a field (and which values are allowed) is determined\
        \ by the business logic of the contract management solution. To reference\
        \ a specific brand the index of that brand in the GET call needs to be used.\r\
        \nSample request: \r\n\r\n    [\r\n       {\r\n           \"value\": \"true\"\
        ,\r\n           \"path\": \"brands/0/brandParameters/allowedServices/refundService\"\
        ,\r\n           \"op\": \"replace\"             \r\n       }, \r\n       {\r\
        \n           \"path\": \"brands/0/brandParameters/allowedServicesContactless/refundService\"\
        ,\r\n           \"op\": \"remove\"             \r\n       }\r\n    ]"
      operationId: patchTerminalBrands
      parameters:
      - name: acquirerId
        in: path
        description: Unique identification of the acquirer, determined by equensWorldline
        required: true
        schema:
          type: string
      - name: contractId
        in: path
        description: |
          Unique identification of the contract, determined by the acquirer
        required: true
        schema:
          type: string
      - name: siteId
        in: path
        description: Unique identification of the site within the contract
        required: true
        schema:
          type: integer
          format: int32
      - name: terminalId
        in: path
        description: Identification of the terminal. Within the Dutch model a terminal
          ID uniquely identifies one specific physical device. Within other terminal
          models the terminal ID is only considered unique within the context of its
          own site (card acceptor ID)
        required: true
        schema:
          type: string
      - name: applyToAll
        in: query
        description: If value is true then the changes made to 1 brand (with index
          0) will automatically apply to all brands
        schema:
          type: boolean
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
        required: false
      responses:
        200:
          description: Change is processed with correlation id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrelationResponse'
        400:
          description: Invalid input provided
          content:
