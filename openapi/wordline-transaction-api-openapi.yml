    TransactionDetails:
      type: object
      allOf:
      - $ref: '#/components/schemas/Transaction'
      - properties:
          alternativeIban:
            type: string
            description: 'Corresponds to PAN token received from the scheme MCI : pds0001 - Mastercard Mapping Service Account Number'
          brand:
            type: string
            description: Brand associated to the Issuer Account Range (BIN) such as "MCC" (MasterCard) , "DMC" (Debit MasterCard), "MSI" (Maestro), "CIR" (Cirrus), "VIS" (VISA).
          cardTypeCode:
            type: string
            description: Scheme Product associated in the Issuing Back Office system to the Issuer Account Range
          cashAmount:
            description: 'Additional Amount / Currency / Exponent for Cash Back transaction amount

              * MCI : DE 054 s2 = 40 - Amount, Cash Back

              * VISA : TCR1 pos. 158-166 Cashback'
            allOf:
            - $ref: '#/components/schemas/Amount'
          dccIndicator:
            type: string
            description: 'This field must contain one of these values (optional):

              1 = DCC performed

              space = default, no DCC has been performed'
          gratuityAmount:
            description: Additional Amount / Currency / Exponent for Gratuity transaction amount in the transaction currency Only for MC
            allOf:
            - $ref: '#/components/schemas/Amount'
          panExpiryDate:
            type: string
            description: 'Card expiry date present in the transaction Format is "MMYY" (month and year)


              MCI : DE 14 - Date Expiration'
          panSequenceNumber:
            type: string
            description: 'PAN sequence number from the transaction


              MCI : DE 23 - Card Sequence Number

              VISA : TCR7 pos. 7-9 Card Sequence Number'
          poiAmount:
            description: Additional Amount / Currency / Exponent for DCC (Dynamic Currency Conversion) transaction amount - Only for MC
            allOf:
            - $ref: '#/components/schemas/Amount'
          surchargeAmount:
            description: Additional Amount / Currency / Exponent for surcharge transaction amount in Transaction Currency
            allOf:
            - $ref: '#/components/schemas/Amount'
          terminalId:
            type: string
            description: Code that identifies the card acceptor terminal or ATM.
          acquiringBankCode:
            type: string
            description: Determined using the originator member id. Bank code stored in the system for the member.
          originatorMemberId:
            type: string
            description: 'Transaction Originator Member ID. Identifies the transaction originator institution.

              MCI  : DE94 - Transaction Originator Institution ID Code

              VISA: TCR0 27-49 acquiring reference number position 2-7'
          schemeTransactionIdentifier:
            type: string
            description: 'Scheme Transaction Identifier allows to identify uniquely a transaction through its full life cycle.

              MCI : DE63 - Transaction Life Cycle ID S2 - Trace ID

              VISA : TCR5 Transaction Identifier'
          destinationRegionCode:
            type: string
            description: Region code stored in the system for the member linked to the card prefix.
          schemeExchangeRateDate:
            type: string
            format: date-time
            description: 'Indicates the date of used exchange rates when performing currency conversions.

              Presence of the date does not imply that a currency conversion took place. Having the exchange rate date stored allows retrieving a rate for a given day.

              E.g. used when recalculating the interchange amount or in dispute scenarios where an amount also need to be calculated using the exchange rate of a specific day.

              MCI : PDS158 - Business Activity Subfield 5 - Business Date. VISA : Central Processing Date  TCR0 164-167.'
          feeProgramIndicator:
            type: string
            description: 'Visa field containing an interchange reimbursement fee program indicator (FPI), which is used in assessing the fee amount applied to.

              Set in First Presentments and required in subsequent lifecycle messages.VISA : TCR1 pos 76-78'
          functionCode:
            type: integer
            description: 'The IPM message uses a combination of two elements to define the message type : Message Type Identifier (MTI) + Data Element (DE) 24 (Function Code)

              The MTI identifies the general ISO message type and the Function Code more specifically defines the message’s purpose.MCI : DE24 Function Code'
          inputInterfaceCode:
            type: string
            description: Identifies the service forwarding transactions into the transaction processing service
          messageTypeIdentifier:
            type: integer
            description: Message Type Identifier (MTI) is a four-digit numeric field identifying the general classification of a message being processed. MCI only
          originatorCountryCode:
            type: string
            description: Determined using the originator member id. Country code stored in the system for the member.
          originatorRegionCode:
            type: string
            description: Determined using the originator member id. Region code stored in the system for the member.
          outputInterfaceCodes:
            type: array
            description: Identifies the output services to which the transaction processing service has forwarded the transaction
            items:
              type: string
          processingCode:
            description: 'Processing Code is a series of digits that describe the effect of a transaction on a customer account and the type of accounts affected.Used for MasterCard Interchange validation and determination.Further, required for MasterCard Fee collection messages created in the Transaction processing service MCI : DE03 - Processing Code'
            allOf:
            - $ref: '#/components/schemas/ProcessingCode'
          receivingMemberId:
            type: string
            description: "Receiving Member ID identifies the receiving institution. \nMCI : DE100 - Receiving Institution ID Code. If not present – it is found as the processor member of the destinationMemberId"
          retrievalReferenceNumber:
            type: string
            description: 'Retrieval Reference Number is a transaction information document reference number.

              MCI : DE37 - Retrieval Reference Number'
          routingMode:
            type: string
            description: 'Internal determined routing mode.Possible values : ACQUIRER, ISSUER, DISPUTE, UNDECIDED, PROCESSOR, ONUS, EXTERNAL'
          suspendDescription:
            type: string
            description: Text field in which a more detailed description of the exact suspends conditions can be recorded.Used informatively to resolve suspend cases easier.
          suspendReasonCode:
            type: string
            description: Reason code for transaction suspension. List of possible values is configurable in our system.
          terminalTypeCode:
            type: string
            description: 'Terminal Type code for terminal devices.Used for interchange validation and determination. Also, used in dispute context for establishing transactions conditions and rule set.

              MCI : PDS 023 - Terminal Type

              VIS : TCR1 pos.124 UnattendedAcceptanceTerminalIndicator'
          cardValidationIndicator:
            type: string
            description: 'CVC 2 Validation Program Indicator.

              MCI : PDS 44 - Program Participation Indicator Subfield 1 - CVC 2 Validation Program Indicator'
          contactlessChargebackEligibilityIndicator:
            type: string
            description: 'QPS/PayPass Chargeback Eligibility Indicator.

              MCI : PDS 44 - Program Participation Indicator Subfield 2 - QPS/PayPass Chargeback Eligibility Indicator'
          floorLimitIndicator:
            type: string
            description: 'Mandatory for Visa presentments. Not applicable to other card schemes.Indicates if the transaction was above or below the merchant’s floor limit for the date of the purchase.

              VIS :TCR0 - Floor Limit Indicator'
          multipleClearingSequenceNumber:
            type: integer
            description: 'Can be used when acquirers submit multiple clearing transactions for a single card-not-present authorization message.The multiple clearing sequence number distinguishes a specific clearing transaction from all other clearing transactions submitted for the same authorization

              VIS : TCR05 - Multiple Clearing Sequence Number'
          multipleClearingSequenceCount:
            type: integer
            description: 'Can be used when acquirers submit multiple clearing transactions for a single card-not-present authorization message.The multiple clearing sequence count qualifies the total of multi clearing transactions VIS : TCR05 - Multiple Clearing Sequence Count'
          offline:
            type: boolean
            description: If true it indicates that the first presentment was done without authorization.
          onUs:
            type: boolean
            description: This field is received in VISA and MCI file header to identify if the received file is onus or offus
          bookingDate:
            type: string
            format: date-time
            description: 'This date is received in VISA and MCI file header


              MCI : PDS105 - File ID Subfield 2  - File Reference Date

              VIS : TC90 Processing Date'
          cardAcceptorStreet:
            type: string
            description: 'Card Acceptor Street associated to the transaction

              MCI : DE43 - Card Acceptor Name/Location Subfield 2 - Card Acceptor Street Address'
          processorId:
            type: string
            description: 'VISA : TC90 File Header Processing BIN ,MCI : n/a'
          rejected:
            type: boolean
            description: 'Rejected Flag Always false for FP: not rejected by cardscheme'
          approvalResponseCode:
            type: string
            description: "Approval response code calculated from card Scheme data.\nProvided only accordingly rules bellow\n*\tAPPROVED\n*\tPARTIALLY_APPROVED\n*\tDECLINED\n-VISA: rules\nAPPROVED\nif TCR 5 Authorization Response Code Pos. 35-36 = Y3\nor for Offline approved transaction\nif TCR5 Authorization Response Code Pos. 35-36=Y1 (Offline Approval)\nelse\nDECLINED\n-MCI: rules\nAPPROVED\nMCI: DE 038 Approval Code present\nor for offline transaction\nif DE 038 Approval code not present and DE 22 (Point of Service Data Code) is present and DE\n22, subfield 7 = F, indicating an offline chip transaction\nelse\nDECLINED"
          settlementDate:
            type: string
            format: date-time
            description: 'Settlement date

              - VISA : TCR0 pos 164-167 (Central processing date YDDD) converted in DateTime

              - MCI: PDS 0159 s8 Settlement Date YYMMDD'
          embargoCheckCode:
            type: string
            description: "This code indicates if the transaction can be posted or not on the cardholder account after an Embargo check performed by an external system (Smaragd).\nPossible values :\n- SENT : a request for Embargo is sent to the external system to check the transaction \n- WAIT : the external system responds the requestor has to wait for the final answer \n- HIT : the feeddback from the external system is not sucessfull and the credit cannot be posted on cardholder account \n- NO_HIT : the feeddback from the external system is sucessful and the credit can be posted on cardholder account"
          interchangeFees:
            type: array
            items:
              $ref: '#/components/schemas/InterchangeFee'
          disputeReason:
            type: string
            description: disputeReason. Relevant if the failure of the check implies a dispute folder opening only if success = false
      title: TransactionDetails
    AuthorizationIdentifier:
      type: object
      properties:
        transactionId:
          type: string
          description: 'minLength: 18

            maxLength: 18

            Unique identifier of notified transaction in WLP FO. '
