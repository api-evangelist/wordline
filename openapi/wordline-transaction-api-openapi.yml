    AirItineraryInformation:
      type: object
      properties:
        businessFormatCode:
          type: string
          description: 'The fields represents additional data from VISA clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Business Format Code; POS 17-18.'
        travelAgent:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Travel Agency Name; POS 92-116.

            MCI mapping is the following: PDS 0511. PDS 0511 (Travel Agency Name) is the name of the travel agency that issued the ticket.'
        travelAgentCode:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Travel Agency Code; POS 84-91.

            MCI mapping is the following: PDS 0510. PDS 0510 (Travel Agency Code) is a code assigned to the travel agency.'
        passengerName:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Passenger Name; POS 27-46.

            MCI mapping is the following: PDS 0505. PDS 0505 (Passenger Name) contains the name of the passenger to whom the ticket was issued.'
        departureDate:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Departure Date (MMDDYY); POS 47-52.

            MCI mapping is the following: PDS 0520. PDS 0520 (Travel Date) is the effective ticket date, also referred as departure date (YYMMDD).'
        originCityCode:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Origination City/Airport Code; POS 53-55.

            MCI mapping is the following: PDS 0523. PDS 0523 (City of Origin/Airport Code) is the originating airport or railway name standard abbreviation.'
        restrictedTicketIndicator:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Restricted Ticket Indicator; POS 117.

            MCI mapping is the following: PDS 0713. PDS 0713 (Restricted Ticket Indicator) provides the identifier noting that the ticket purchased has some restriction associated with its use.'
        reservationSystem:
          type: string
          description: 'The fields represents additional data from VISA clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Computerized Reservation System; POS 142-145.'
        creditReasonIndicator:
          type: string
          description: 'The fields represents additional data from VISA clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Credit Reason Indicator; POS 166.'
        ticketChangeIndicator:
          type: string
          description: 'The fields represents additional data from VISA clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Ticket Change Indicator; POS 167.'
        ticketNumber:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR0; Field: Merchant Name POS 92-116; POS 13-25 of this field should be taken as input.

            MCI mapping is the following: PDS 0506. PDS 0506 (Ticket Number) contains the number on the ticket.'
        IATACode:
          type: string
          description: 'The field represents additional data from MCI clearing file addendum.

            MCI mapping is the following: PDS 0717. PDS 0717 (IATA Client Code) provides the International Air Transport Association (IATA) code identifying the company that purchased the ticket.'
        leg1:
          allOf:
          - $ref: '#/components/schemas/TravelDetailLeg'
