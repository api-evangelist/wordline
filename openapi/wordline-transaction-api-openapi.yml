          description: HTTP status code
        statusMessage:
          type: string
          example: Forbidden
          description: Executed REST API status message
      title: ForbiddenResponseMetadata
    LodgingInformation:
      type: object
      properties:
        businessFormatCode:
          type: string
          description: 'The fields represents additional data from VISA clearing file addendum.

            VISA mapping is the following: TC05, TCR3 - INDUSTRY-SPECIFIC DATA - LODGING; Field: Business Format Code (Value: CA); POS: 17-18.'
        noShowIndicator:
          type: string
          description: 'The fields represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR3 - INDUSTRY-SPECIFIC DATA - LODGING; Field: Lodging No-Show Indicator; POS 27.

            MCI mapping is the following: PDS 0690. PDS 0690 (No Show Indicator) provides an indicator noting that the individual did not show up after making a reservation for a vehicle or lodging.'
        extraCharges:
          type: string
          description: 'The fields represents additional data from VISA clearing file addendum.

            VISA mapping is the following: TC05, TCR3 - INDUSTRY-SPECIFIC DATA - LODGING; Field: Lodging Extra Charges; POS 28–33.'
        checkInDate:
          type: string
          description: 'The fields represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR3 - INDUSTRY-SPECIFIC DATA - LODGING; Field: Lodging Check-in Date (YYMMDD); POS 38-43.

            MCI mapping is the following: PDS 0574. PDS 0574 (Arrival Date) contains the cardholder check-in date (YYMMDD).'
        dailyRoomRate:
          type: string
          description: 'The fields represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR3 - INDUSTRY-SPECIFIC DATA - LODGING; Field: Daily Room Rate; POS 44-55.

            MCI mapping is the following: PDS 0580. PDS 0580 (Room Rate) contains the daily room charges exclusive of taxes and fees. This PDS consists of two subfields:

            1. Room Rate Amount; POS: 1-12

            2. Room Rate Exponent; POS: 13'
        totalTax:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR3 - INDUSTRY-SPECIFIC DATA - LODGING; Field: Total Tax; POS 56-67.

            MCI mapping is the following: PDS 0597. PDS 0597 (Total Tax Amount) contains the total amount of sales tax or value added tax (VAT) on the total purchase amount.'
        prepaidExpenses:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR3 - INDUSTRY-SPECIFIC DATA - LODGING; Field: Prepaid Expenses; POS 68-79.

            MCI mapping is the following: PDS 0704. PDS 0704 (Prepaid Expenses) provides the amount of deposit or other prepaid amounts for the lodging stay.'
        foodBeverageCharge:
          type: string
          description: 'The field represents additional data from VISA clearing file addendum.

            VISA mapping is the following: TC05, TCR3 - INDUSTRY-SPECIFIC DATA - LODGING; Field: Food/Beverage Charges; POS 80-91.'
        folioCashAdvances:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR3 - INDUSTRY-SPECIFIC DATA - LODGING; Field: Folio Cash Advances; POS 92-103.

            MCI mapping is the following: PDS 0706. PDS 0706 (Cash Advances) provides the amount of cash received during the lodging stay.'
        totalRoomNights:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR3 - INDUSTRY-SPECIFIC DATA - LODGING; Field: Room Nights; POS 104-105.

            MCI mapping is the following: PDS 0703. PDS 0703 (Total Room Nights) provides the total number of nights for which a room was contracted during a lodging stay.'
        totalRoomTax:
          type: string
          description: "The field represents additional data from VISA and MCI clearing file addendum.\nVISA mapping is the following: TC05, TCR3 - INDUSTRY-SPECIFIC DATA - LODGING; Field: Total Room Tax; POS 106-117.\nMCI mapping is the following: PDS 0581. PDS 0581 (Total Room Tax) contains tax amount information such as the daily room tax, occupancy tax, energy tax, and tourist tax amounts. This PDS consists of three subfields:\n1. Total Room Tax Amount; POS: 1-12\n2. Total Room Tax Exponent; POS: 13\n 3. Total Room Tax Sign; POS: 14"
      title: LodgingInformation
    CreatePostingRequest:
      type: object
      required:
      - postingAmount
      - postingTypeReference
      properties:
        postingAmount:
          description: Mandatory parameter specifying the posting amount. The posting amount can be negative amount (- sign in the beginning of the amount digits)
          allOf:
          - $ref: '#/components/schemas/Amount'
        message:
          type: string
          description: Description message that will associated to the posted operation in the statement
        immediateReimbursement:
          type: boolean
          description: Optional parameter for impacting card holder account immediately
        postingTypeReference:
          type: string
          description: 'The issuer must provide the identifier of the external reference of the posting. The list of values are configured by issuer:

            Three family of postings type:

            - Cardholder: For impacting the cardholder account, possible values can be: ''Cardholder Account'', ''POST TO OTHER ACCOUNT''

            - Issuer: Write off: possible values can be ''ISSUER_ACCOUNT'', ''PROFIT AND LOSS'', ''FRAUD''

            - Foreign exchange fee (''FOREIGN_EXCHANGE_FEE''), Financial Advice Exchange Rate Difference (''ADVANCE_EXCHANGE_RATE_DIFFERENCE''):  the dispute officer can manually create a dispute posting amount to this account'
      title: CreatePostingRequest
    CarRentalInformation:
      type: object
      properties:
        businessFormatCode:
          type: string
          description: 'The fields represents additional data from VISA clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - CAR RENTAL; Field: Business Format Code (Value: CA); POS 17-18.'
        days:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - CAR RENTAL; Field: Days Rented; POS 19-20.

            MCI mapping is the following: PDS 0691. PDS 0691 (Days Rented) provides the number of days that the vehicle was rented.'
        noShowIndicator:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - CAR RENTAL; Field: Car Rental No-Show Indicator; POS 27.

            MCI mapping is the following: PDS 0690. PDS 0690 (No Show Indicator) provides an indicator noting that the individual did not show up after making a reservation for a vehicle or lodging.'
        extraCharges:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - CAR RENTAL; Field: Car Rental Extra Charges; POS 28-33.

            MCI mapping is the following: PDS 0701. PDS 0701 (Extra Charges) provides the extra charges associated with the vehicle rental.'
        checkOutDate:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - CAR RENTAL; Field: Car Rental Check-out Date (YYMMDD); POS 38-43.

            MCI mapping is the following: PDS 0551. PDS 0551 (Rental Check-Out Date) is the date when the vehicle was originally rented (YYMMDD).'
        dailyRentRate:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - CAR RENTAL; Field: Daily Rental Rate; POS 44-55.

            MCI mapping is the following: PDS 0553. PDS 0553 (Rental Rate) contains the rental rate charged for the vehicle and indicates whether it is a daily, weekly, or monthly rate. This PDS consists of two subfields:

            1. Rental Rate Indicator; POS: 1

            - D: Daily rate

            - W: Weekly rate

            - M: Monthly rate

            - space: Unknown or unreported

            2. Rental Rate; POS: 2-13'
        weeklyRentRate:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - CAR RENTAL; Field: Weekly Rental Rate; POS 56-67.

            MCI mapping is the following: PDS 0692. PDS 0692 (Weekly Rental Amount) provides the amount charged for a seven-day rental period.'
        insuranceCharge:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - CAR RENTAL; Field: Insurance Charges; POS 68-79.

            MCI mapping is the following: PDS 0559. PDS 0559 (Vehicle Insurance) contains an indicator of whether the customer purchased insurance and of the insurance amount. This PDS consists of two subfields:

            1. Insurance Indicator; POS: 1

            - Y: Yes (insurance was purchased)

            - N: No (insurance was not purchased)

            - spaces: Unknown or unreported

            2. Insurance Charges; POS: 2-13'
        fuelCharge:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - CAR RENTAL; Field: Fuel Charges; POS 80-91.

            MCI mapping is the following: PDS 0698. PDS 0698 (Fuel Charge) provides the amount charged for fuel used during vehicle rental.'
        classCode:
          type: string
          description: "The field represents additional data from VISA and MCI clearing file addendum.\n VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - CAR RENTAL; Field: Car Class Code; POS 92-93.\nMCI mapping is the following: PDS 0568. PDS 0568 (Rental Class ID) contains the classification, such as midsize or luxury, of the vehicle rented."
        oneWayDropCharge:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - CAR RENTAL; Field: One-Way Drop-off Charges; POS 94-105.

            MCI mapping is the following: PDS 0694. PDS 0694 (One Way Drop Off Charge) provides a charge associated with not returning a vehicle to the original rental location.'
        renterName:
          type: string
          description: 'The field represents additional data from VISA and MCI clearing file addendum.

            VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - CAR RENTAL; Field: Renter Name; POS 106-145.

            MCI mapping is the following: PDS 0545. PDS 0545 (Renter Name) is the name of the individual making the vehicle rental agreement.'
      title: CarRentalInformation
    CreateEventRequest:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: 'Contains the dispute Event Type label of the Event to post to the Dispute Folder.

            The allowed event type list is configured per issuer in the platform. Type value generally used by issuers: ''Comment'''
        message:
          type: string
          description: Contains a free defined input that will be displayed in the eventMessage in the Dispute Folder
      title: CreateEventRequest
    CreateDisputeRequest:
      type: object
      properties:
        disputeReason:
          type: string
          description: 'Indicates the dispute reason. Example of values are : UNKNOWN_CARD, HIGH_AMOUNT, DUPLICATE_TRANSACTION, LATE_PRESENTMENT , INVALID_PAYMENT, INACTIVE_CARD, CREATED_CARD, COUNTERFEIT_CARD, BLOCKED_CARD, ACTIVE_CARD_TED.'
        refundRedebitIndicator:
          type: string
          description: 'Indicator to perform or not a Refund (for Debit transaction) / Redebit (for Credit transaction) on ''Cardholder Account'' on the disputed transaction. Possible values:

            - FULL: Refund Redebit the full amount of the transaction.

            - PARTIAL : Refund Redebit a partial amount, the partial amount should be provided in the field Refund Redebit Amount

            - NONE : no refund redebit is requested, this is the default value'
        refundRedebitAmount:
          description: The issuer should provide the Amount to Refund or Redebit when Refund Redebit Indicator is PARTIAL. Otherwise it is not checked
          allOf:
          - $ref: '#/components/schemas/Amount'
        declareFraudIndicator:
          type: boolean
          description: 'Indicator to perform a fraud declaration. Possible values:

            true: fraud declaration will be sent to the scheme.

            false: No fraud declaration, this is the default value.'
        issuerDisputeExternalReference:
          type: string
          description: 'The issuer Dispute External Reference : should be unique by issuer, there is no constraint regarding the format, only  maximum length is 50 CHAR.'
        originalValueDate:
          type: string
          format: date-time
          description: Optional parameter external Value Date
        disputePostings:
          type: array
          description: 'Issuer can provide a posting operation to perform on the created dispute folder, example:

            - Do a refund towards the cardholder account

            - Do a write-off towards an issuer account (Profit and Loss, Fraud,..)

            - do a Foreign exchange fee, Financial Advice Exchange Rate Difference'
          items:
            $ref: '#/components/schemas/CreatePostingRequest'
        disputeEvents:
          type: array
          description: 'Issuer can provide an event to add to the created dispute folder.

            This manual event will be added to events generated internally by our system.

            For example, the issuer can add an event to indicate that there is a communication from/to cardholder.'
          items:
            $ref: '#/components/schemas/CreateEventRequest'
        disputeDocuments:
          type: array
          description: Issuer can provide a list of Documents to add to the created dispute folder.
          items:
            $ref: '#/components/schemas/CreateDocumentRequest'
        autoAssignmentRule:
          type: string
          description: 'List of possible values: DISPUTE_REASON, automatically assigns the dispute to the user in charge based on the dispute reason.'
      title: CreateDisputeRequest
    TravelDetailLeg:
      type: object
