components:
  schemas:
    InternalServerErrorResponseMetadata:
      type: object
      required:
      - correlationId
      - responseDateTime
      - statusCode
      - statusMessage
      properties:
        correlationId:
          type: string
          description: Correlation Identifier
        responseDateTime:
          type: string
          example: format:yyyy-MM-dd'T'HH:mm:ss.SSSZ
          description: Timestamp when response date was generated
        statusCode:
          type: integer
          format: int32
          example: 500
          description: HTTP status code
        statusMessage:
          type: string
          example: Internal server error
          description: Executed REST API status message
      title: InternalServerErrorResponseMetadata
    ResponseMetadata:
      type: object
      required:
      - correlationId
      - responseDateTime
      - statusCode
      - statusMessage
      properties:
        correlationId:
          type: string
          description: Correlation Identifier
        links:
          description: Metadata Links
          allOf:
          - $ref: '#/components/schemas/Links'
        statusMessage:
          type: string
          example: Executed successfully
          description: Executed REST API status message
        statusCode:
          type: integer
          format: int32
          example: 200
          description: HTTP status code
        responseDateTime:
          type: string
          example: format:yyyy-MM-dd'T'HH:mm:ss.SSSZ
          description: Timestamp when response date was generated
        timeTakenMs:
          type: integer
          format: int64
          example: 12
          description: Wall clock time required from service to generate the response
      title: ResponseMetadata
    DisputeFolderIdentifier:
      type: object
      required:
      - disputeFolderReference
      properties:
        disputeFolderReference:
          type: string
          description: "The Dispute Folder Reference \nPresent if \"Dispute Folder\" creation is successful. \nThe value of this field is constructed by algorithm. Example for IDM4Sempris, it is like this : D-V-6500-1234-1 (D = for Dispute / M = MCI , V= VISA / 6500 = issuerId / 1234 = YDDD = julien date / 1 = the sequence  is constructed under (D-scheme Id- Issuer Id))"
        issuerDisputeExternalReference:
          type: string
          description: The issuer Dispute External Reference, Present if provided in the request.
      title: DisputeFolderIdentifier
    BadRequestErrorApiResponse:
      type: object
      required:
      - responseMetadata
      properties:
        responseMetadata:
          allOf:
          - $ref: '#/components/schemas/BadRequestResponseMetadata'
      title: BadRequestErrorApiResponse
    ECommerceSecurityLevelIndicator:
      type: object
      properties:
        securityProtocol:
          type: string
          description: 'MCI : PDS 0052 s1 - Security Protocol indicates the presence and type of security protocol present in the authorization process.'
        cardHolderAuthentication:
          type: string
          description: 'MCI : PDS 0052 s2 - Cardholder Authentication indicates the type of cardholder authentication used in the authorization process'
        ucafCollectionIndicator:
          type: string
          description: 'MCI : PDS 0052 s3 - UCAF Collection Indicator identifies the level of UCAF supported in the authorization process'
      title: ECommerceSecurityLevelIndicator
    NotFoundErrorApiResponse:
      type: object
      required:
      - responseMetadata
      properties:
        responseMetadata:
          allOf:
          - $ref: '#/components/schemas/NotFoundResponseMetadata'
      title: NotFoundErrorApiResponse
    ForbiddenErrorApiResponse:
      type: object
      required:
      - responseMetadata
      properties:
        responseMetadata:
          allOf:
          - $ref: '#/components/schemas/ForbiddenResponseMetadata'
      title: ForbiddenErrorApiResponse
    NotFoundResponseMetadata:
      type: object
      required:
      - correlationId
      - responseDateTime
      - statusCode
      - statusMessage
      properties:
        correlationId:
          type: string
          description: Correlation Identifier
        responseDateTime:
          type: string
          example: format:yyyy-MM-dd'T'HH:mm:ss.SSSZ
          description: Timestamp when response date was generated
        statusCode:
          type: integer
          format: int32
          example: 404
          description: HTTP status code
        statusMessage:
          type: string
          example: Not found
          description: Executed REST API status message
      title: NotFoundResponseMetadata
    ApiResponseEntityTransactionDetails:
      x-wl-api-response: true
      type: object
      required:
      - responseMetadata
      properties:
        responseMetadata:
          description: Response metadata
          allOf:
          - $ref: '#/components/schemas/ResponseMetadata'
        data:
          description: Response data
          allOf:
          - $ref: '#/components/schemas/TransactionDetails'
      description: Transaction Details entity
      title: ApiResponseEntityTransactionDetails
    CreateDocumentRequest:
      type: object
      required:
      - data
      - type
      - fileName
      properties:
        data:
          type: string
          description: 'The issuer must provide the data of the document in Base64 encoding format that has to be attached to the Dispute Folder.

            The maximum size per document is:

            - 10 Mo for PDF, TIFF or JPEG format (for Visa or Mastercard)

            - 15 Mo for ZIP format (only for Mastercard)'
        type:
          type: string
          description: 'The issuer must provide the document type,  Possible values:

            - ''image/jpeg'':  data of attached document in JPEG format

            - ''image/tiff'':  data of attached document in TIFF format

            - ''application/pdf'':  data of attached document in PDF format

            - ''application/zip'': data of attached document in ZIP format for Mastercard only'
        label:
          type: string
          description: Contains optional label to be displayed on the event generated in the Dispute Folder
        fileName:
          type: string
          description: 'Contains Mandatory File Name of the document to be displayed on the event generated in the Dispute Folder

            Only for a Mastercard operation, the file name must have a maximum lenght of 16 with only alpha and numeric values (no constraint for a VISA operation)'
        documentTypeId:
          type: string
          description: Contains optional document type Id
      title: CreateDocumentRequest
    UnauthorizedErrorApiResponse:
      type: object
      required:
      - responseMetadata
      properties:
        responseMetadata:
          allOf:
          - $ref: '#/components/schemas/UnauthorizedResponseMetadata'
      title: UnauthorizedResponseMetadata
    InterchangeFee:
      type: object
      properties:
        type:
          type: string
          description: 'Indicates the type of the interchange fee Possible value : EXTERNAL (interchange fee coming from the scheme).'
        code:
          type: string
          description: Interchange fee code.
        amount:
          description: Interchange fee amount
          allOf:
          - $ref: '#/components/schemas/Amount'
      title: InterchangeFee
    Dispute:
      type: object
      properties:
        issuerId:
          type: string
          description: Issuer Identifier (unique per platform)
        disputeFolderIdentifier:
          description: Dispute Folder Identifier
          allOf:
