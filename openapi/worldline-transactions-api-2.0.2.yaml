  /acquiring/transaction/v2.0/acquirers/{acquirerId}/transactions:
    get:
      tags:
      - Transaction
      summary: Retrieve transactions on search criteria
      description: |
         This operation uses query parameters to retrieve the associated transaction(s) data. 
         For example, with a MC 2nd Chargeback the unique AcquirerRefNo retrieves the unique transactionId’s and associated transaction data of all the different stages in the dispute life cycle.
         If there is a previous and/or next page the http response header will have a link (url) to this data. See https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Link#pagination_through_links.
         Note, startDateTime and endDateTime must be present AND at least one of these query parameters: acquirerRefNo, merchantReference, actionId, pspReference
      operationId: getTransactionBySearchCriteria
      parameters:
      - name: acquirerId
        in: path
        description: Unique identification of the acquirer, determined by equensWorldline
        required: true
        schema:
          type: string
      - name: acquirerRefNo
        in: query
        description: |
          Data supplied by an acquirer to assist in identifying a transaction, e.g. for researching retrievals and chargebacks.
          (Note: acquirerRefNo = acquirerReferenceNumber)
        schema:
          type: string
      - name: merchantReference
        in: query
        description: |
          This is a reference that the merchant can add to an authorization request towards the terminal by entering it via the keyboard of the merchant.
        schema:
          type: string
      - name: merchantTransactionRefNo
        in: query
        description: |
          ***DEPRECATED*** (please use merchantReference)
          
          This is a reference that the merchant can add to an authorization request towards the terminal by entering it via the keyboard of the merchant.
        schema:
          type: string
      - name: actionId
        in: query
        description: |
          Action ID (example 432956ee-6974-42d2-bfdb-878997f21653)
        schema:
          type: string
      - name: pspReference
        in: query
        description: |
          Additional information provided by the concentrator to return on his statement
        schema:
          type: string
      - name: startDateTime
        in: query
        description: | 
          Start DateTime the transaction was created (yyyy-mm-dd hh:mm:ss) (greater or equals to this value)
  
          Note, startDateTime and endDateTime must be present AND at least one of these query parameters: acquirerRefNo, merchantReference, actionId, pspReference
        required: true
        schema:
          type: string
          format: date-time
      - name: endDateTime
        in: query
        description: |
          End DateTime the transaction was created (yyyy-mm-dd hh:mm:ss) (until this value, so not incuded)

          Note, startDateTime and endDateTime must be present AND at least one of these query parameters: acquirerRefNo, merchantReference, actionId, pspReference
        required: true
        schema:
          type: string
          format: date-time
      - name: transactionAmountFrom
        in: query
        description: Transaction amount (whole units), amount should be greater than
          or equal to this value
        schema:
          type: integer
          format: int32
      - name: transactionAmountTo
        in: query
        description: Transaction amount (whole units), amount should be less than
          this value
        schema:
          type: integer
          format: int32
      - name: transactionAmountCurrency
        in: query
        description: Transaction amount currency, according to ISO 4217. Required
          if search amount is available. Example EUR
        schema:
          type: string
      - name: sortField
        in: query
        description: Sort field
        schema:
          type: string
          enum:
          - TransactionId
          - TransactionDateTime
          - TransactionType
          - Brand
          - TruncatedPan
      - name: sortOrder
        in: query
        description: Sort order
        schema:
          type: string
          enum:
          - Ascending
          - Descending
      - name: pageSize
        in: query
        description: Page size (max 300)
        schema:
          type: string
      - name: pageNumber
        in: query
        description: Page number
        schema:
          type: string
      responses:
        200:
          description: Successful
          headers:
            Link:
              description: Link header for pagination. Only available if there is a next and/or prev page.
              schema:
                type: string
              example: '</acquiring/transaction/v2.0/acquirers/abc/transactions&pageNumber=3>; rel="next", </acquiring/transaction/v2.0/acquirers/abc/transactions&pageNumber=1>; rel="prev"'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
              example:
              - transactionIdentification:
                  transactionId: "TDS16172008721825920"
                  actionId: "432956ee-6974-42d2-bfdb-878997f21653"
                  acquirerReferenceNumber: "11223344662288134679854"
                  merchantReference: "trx reference by merchant"
                  merchantTransactionReference: "DEPRECATED. Not available in v2.1. Please use merchantReference"
                  pspReference: "string"
                  retrievalReferenceNumber: "string"
                  stan: 12752
                contractIdentification: 
                  acquirerId: "315000001"
                  pspId: "string"
                  holdingId: 200
                  merchantId: "1001"
                  contractId: "10011"
                  cardAcceptorId: "1001"
                  siteId: 100111
                  terminalId: "W01AB01"
                approvalCode: "AB90EF"
                brand: "MAES"
                cardAcceptorNameLocation: "Purchase Merchant/ CC \\ARNHEM       \\NLD"
                channel: 1
                contactlessIndicator: 1
                creditDebitIndicator: "D"
                forwardingInstitutionId: "671734512"
                matStatus: "1"
                merchantCategoryCode: 7000
                paymentFacilitatorId: "10000000000"
                paymentInfo: [
                  {
                    merchantPaymentId: "SO-000000017036619028",
                    merchantPaymentAggregationLevelCode: "02",
