                paymentInitiationChannel: "0"
                transactionAmount:
                  amount: "3.00"
                  currency: "EUR"
                transactionVatAmount:
                  amount: "3.00"
                  currency: "EUR"
                merchantTransactionFeeAmount:
                  amount: "3.00"
                  currency: "EUR"
