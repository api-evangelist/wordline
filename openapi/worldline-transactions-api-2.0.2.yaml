  /acquiring/transaction/v2.0/acquirers/{acquirerId}/payments/{paymentId}/transactions:
    get:
      tags:
      - Transaction
      summary: Retrieve transactions for payment id
      description: |
        This operation uses the paymentId to retrieve the associated transaction(s) data. 
        If there is a previous and/or next page the http response header will have a link (url) to this data. See https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Link#pagination_through_links
      operationId: getTransactionListByPaymentId
      parameters:
      - name: acquirerId
        in: path
        description: Unique identification of the acquirer, determined by equensWorldline
        required: true
        schema:
          type: string
      - name: paymentId
        in: path
        description: |
          Unique identification of the payment in which this transaction has been paid out

          If present, the paymentDate must be present too
        required: true
        schema:
          type: string
      - name: paymentDate
        in: query
        description: |
          Payment Date (yyyy-mm-dd), known as payment posting date (required for search on paymentId)

          If present, the paymentId must be present too
        required: true
        schema:
          type: string
          format: date
      - name: transactionAmountFrom
        in: query
        description: Transaction amount (whole units), amount should be greater than
          or equal to this value
        schema:
          type: integer
          format: int32
      - name: transactionAmountTo
        in: query
        description: Transaction amount (whole units), amount should be less than
          this value
        schema:
          type: integer
          format: int32
      - name: transactionAmountCurrency
        in: query
        description: Transaction amount currency, according to ISO 4217. Required
          if search amount is available. Example EUR
        schema:
          type: string
      - name: sortField
        in: query
        description: Sort field
        schema:
          type: string
          enum:
          - TransactionId
          - TransactionDateTime
          - TransactionType
          - Brand
          - TruncatedPan
      - name: sortOrder
        in: query
        description: Sort order
        schema:
          type: string
          enum:
          - Ascending
          - Descending
      - name: pageSize
        in: query
        description: Page size (max 300)
        schema:
          type: string
      - name: pageNumber
        in: query
        description: Page number
        schema:
          type: string
      responses:
        200:
          description: Successful
