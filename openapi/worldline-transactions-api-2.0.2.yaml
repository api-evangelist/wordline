components:
  schemas:
    Transaction:
      type: object
      properties:
        transactionIdentification:
          $ref: '#/components/schemas/TransactionIdentification'
        contractIdentification:
          $ref: '#/components/schemas/ContractIdentification'
        approvalCode:
          type: string
          description: Code assigned by the authorising institution indicating approval
          example: AB90EF
        brand:
          type: string
          description: Unique identification of the brand (payment product). Maestro
            MAES, Visa VISA, etc.
          example: MAES
        cardAcceptorNameLocation:
          type: string
          description: The name and place where the terminal is located. Note - A
            backslash is not valid json. So a backslash will be escaped (with a backslash)
          example: Purchase Merchant/ CC \ARNHEM       \NLD
        channel:
          type: integer
          description: Channel code (0 atm, 1 pos, 2 eCommerce, 3 moto)
          format: int32
        contactlessIndicator:
          type: integer
          description: Indicates whether the transaction has been done contactless
            (0 no, 1 yes)
          format: int32
          example: 1
        creditDebitIndicator:
          type: string
          description: Funding source. The field describes how the cardholder funds
            his account. (C = Credit, D = Debit, P = Prepaid)
          example: D
        forwardingInstitutionId:
          type: string
          description: Code identifying the acquirer processor or card acceptor
          example: "671734512"
        matStatus:
          type: string
          description: MAT transactions are flagged as MAT so that acquirer and merchant
            can see the transaction was approved in back-up mode. Values ​​0 (No MAT)
            or 1 (Approved MAT).
          example: "1"
        merchantCategoryCode:
          type: integer
          description: Merchant Catogory Code
          format: int32
          example: 7000
        paymentFacilitatorId:
          type: string
          description: Identifier for a Payment Facilitator which allows anyone who
            wants to offer merchant services on a sub-merchant platform.
          example: "10000000000"
        paymentInfo:
          $ref: '#/components/schemas/PaymentInfo'
        paymentProductTypeCode:
          type: string
          description: Code for the type of payment product. (Z Commercial Card. 2
            Consumer Card)
          example: "2"
        posEntryMode:
          type: string
          description: A code that identifies how the carddata was entered on the
            terminal and which PINentry capabilities the terminal possesses.
          example: 79x
        pricePlanTarifId:
          type: string
          description: Unique identification for the price plan tarif.
          example: tarifId
        processingDateTimeScheme:
          type: string
          description: processing date-time by scheme (RFC 3339)
          format: date-time
        region:
          type: string
          description: Region of the payment scheme (Netherlands Maestro, etc)
          example: Netherlands Maestro
        regionCode:
          type: string
          description: Region of the payment scheme code
          example: "31"
        subMerchantId:
          type: string
          description: Sub Merchant ID, defined by a Payment Facilitator (merchant).
            Each merchant that is considered to be a “Payment Facilitator” by MasterCard
            needs to uniquely identify all of its sites with a sub merchant ID
          example: "734188"
        terminalBatchReference:
          type: string
          description: Reference of the terminal batch
          example: "0000000216"
        terminalProtocol:
          type: string
          description: Terminal Protocol
          example: "02"
        transactionDateTime:
          type: string
          description: authorisation date-time (RFC 3339)
          format: date-time
        transactionDescription:
          type: string
          description: Transaction currency combination description
          example: 0150 Chargeback Correction case id 0000001
        transactionFeePricePlanTypeCode:
          type: string
          description: Type of Merchant transaction fee price plan code. (00 No price
            plan type, 01 Standard pricing, 02 Interchange plus, 03 Advanced pricing)
          example: "01"
        transactionLevel:
          type: string
          description: Code that identifies the transaction level
          example: Contract
        transactionStatus:
          type: string
          description: Status of the transaction (CAPT transaction is captured, TFEE
            transaction fee is added, PAID transaction is paid out)
          example: TFEE
        transactionType:
          type: string
          description: Description of transaction being undertaken
          example: Purchase Presentment
        transactionTypeCode:
          type: string
          description: |
            Code which indicates the type of transaction being undertaken. Used in conjunction with the Account type code as part of the Processing code.
            (Most common codes are the following: 904 Purchase Presentment, 905 Cash Withdrawal/Advance Presentment, 901 Refund Presentment, 047 Reimbursement Equens Merchant Loss Settled Debit, 024 Adjustment (Corrections or Manual Adjustments) Correction, etc.)
          example: "904"
        truncatedPan:
          type: string
          description: truncated pan. Only the first 6 and last 3 digits are present.
            Values inbetween are zeros
          example: "6731230000000123"
        vatLabel:
          type: string
          description: Describes the rate of the VAT
          example: 21%
        result3ds:
          type: string
          description: Indicates result of the 3-D Secure authentication process.
          example: Full
        version3ds:
          type: string
          description: Indicates the applied 3-D Secure version.
          example: V2
        cavv:
          type: string
          description: CAVV (Cardholder Authentication Verification Value) data in
            hexadecimal notation (40 characters for 20 bytes).
        xid:
          type: string
          description: XID (eCommerce transaction ID) in hexadecimal notation (40
            characters for 20 bytes).
        ucaf:
          type: string
          description: UCAF (Universal Cardholder Authentication Field) in hexadecimal
            notation (40 characters for 20 bytes).
        mitCause:
          type: string
          description: Cause detailing the Merchant Initiated Transaction.
          example: Unscheduled
        initiatorType:
          type: string
          description: Indicates which entity has triggered the operation.
          example: Cardholder
        captureSequenceNumber:
          type: integer
          description: Number of current capture in the entire capture sequence starting
            from 1.
          format: int32
          example: 2
        captureSequenceCount:
          type: integer
          description: Total number of captures for the business case in case BusinessCaseType is FinancialRequest.
          format: int32
          example: 3
        schemeMerchantId:
          type: string
          description: Id for the merchant assigned by the card scheme
        schemeTransactionId:
          type: string
          description: The Trace-ID/TID assigned by the scheme
        paymentInitiationChannel:
          type: string
          description: Used to provide information about the form factor of the token that was used to initiate a payment
          example: 00
        transactionAmount:
          $ref: '#/components/schemas/Amount'
        transactionVatAmount:
          $ref: '#/components/schemas/Amount'
        merchantTransactionFeeAmount:
          $ref: '#/components/schemas/Amount'
        merchantTransactionFeeVatAmount:
          $ref: '#/components/schemas/Amount'
        netAmount:
          $ref: '#/components/schemas/Amount'
        schemeMarkupAmount:
          $ref: '#/components/schemas/Amount'
        interchangeFeeAmount:
          $ref: '#/components/schemas/Amount'
        cashBackAmount:
          $ref: '#/components/schemas/Amount'
        acquirerMarkupAmount:
          $ref: '#/components/schemas/Amount'
        merchantTransactionAmount:
          $ref: '#/components/schemas/Amount'
    Authorization:
      type: object
      properties:
        transactionIdentification:
          $ref: '#/components/schemas/TransactionIdentification'
        contractIdentification:
          $ref: '#/components/schemas/ContractIdentification'
        approvalCode:
          type: string
          description: Code assigned by the authorising institution indicating approval
          example: AB90EF
        authorizationDateTime:
          type: string
          description: authorisation date-time (RFC 3339)
          format: date-time
        brand:
          type: string
          description: Brand
          example: MAES
        cardAcceptorNameLocation:
          type: string
          description: The name and place where the terminal is located. Note - A
            backslash is not valid json. So a backslash will be escaped (with a backslash)
          example: Purchase Merchant/ CC \ARNHEM       \NLD
        cardExpiryDate:
          type: integer
          description: The year and month after which the card expires
          format: int32
          example: 2104
        cardSequenceNumber:
          type: integer
          description: card sequence number
          format: int32
          example: 123
        cardValidationResult:
          type: string
          description: Contains the result of a CVC2/CVV2 validation or the (i)CVC/CVV
            validation
          example: M
        channel:
          type: integer
          description: Channel code (0 atm, 1 pos, 2 eCommerce, 3 moto)
          format: int32
        contactlessIndicator:
          type: integer
          description: Indicates whether the transaction has been done contactless
            (0 no, 1 yes)
          format: int32
          example: 1
        ecommerceIndicator:
          type: string
          description: Electronic Commerce Indicators
          example: "2100000"
        forwardingInstitutionId:
          type: string
          description: Code identifying the acquirer processor or card acceptor
          example: "671734512"
        iccDateFilled:
          type: string
          description: EMV data present. Y or N
          example: Y
        merchantCategoryCode:
          type: integer
          description: Merchant Catogory Code
          format: int32
          example: 7000
        paymentFacilitatorId:
          type: string
          description: Identifier for a Payment Facilitator which allows anyone who
            wants to offer merchant services on a sub-merchant platform.
          example: "10000000000"
        pointOfServiceDataOnline:
          type: string
          description: A code used to indicate the local conditions at the point-of-service
            device, at the time a card payment transaction was initiated.
          example: "0123456789012345678901245"
        pointOfServiceDataOffline:
          type: string
          description: A code used to identify terminal capability, terminal environment
            and presentation of security data.
          example: "111121613024"
        posEntryMode:
          type: string
          description: A code that identifies how the carddata was entered on the
            terminal and which PINentry capabilities the terminal possesses.
          example: 79x
        processingCode:
          type: string
          description: Code which indicates the type of transaction being undertaken.
            Used in conjunction with the Account type code as part of the Processing
            code.
          example: "010000"
        responseCodeInternal:
          type: string
          description: response code internal
          example: "00"
        responseCodeExternal:
          type: string
          description: Response Code from the authorization response received from
            the brand gateway
          example: "00"
        retrievalReferenceNumber:
          type: string
          description: Retrieval Reference Number from the authorization request sent to Mastercard/Visa
          example: "012345678901"
        serviceCode:
          type: string
          description: The service code from the track
          example: "945"
        subMerchantId:
          type: string
          description: Sub Merchant ID, defined by a Payment Facilitator (merchant).
            Each merchant that is considered to be a “Payment Facilitator” by MasterCard
            needs to uniquely identify all of its sites with a sub merchant ID
          example: "734188"
        terminalBatchReference:
          type: string
          description: Reference of the terminal batch
          example: "0000000216"
        terminalProtocol:
          type: string
          description: Terminal Protocol
          example: "02"
        truncatedPan:
          type: string
          description: truncated pan. Only the first 6 and last 3 digits are present.
            Values inbetween are zeros
          example: "6731230000000123"
        cashBackAmount:
          $ref: '#/components/schemas/Amount'
        originalAmountRequested:
          $ref: '#/components/schemas/Amount'
        amountAuthorized:
          $ref: '#/components/schemas/Amount'
        tipAmount:
          $ref: '#/components/schemas/Amount'
    Lifecycle:
      type: object
      properties:
        transactionIdentification:
          $ref: '#/components/schemas/TransactionIdentification'
        contractIdentification:
          $ref: '#/components/schemas/ContractIdentification'
        approvalCode:
          type: string
          description: Code assigned by the authorising institution indicating approval
          example: AB90EF
        brand:
          type: string
          description: Brand
          example: MAES
        cardAcceptorNameLocation:
          type: string
          description: The name and place where the terminal is located. Note - A
            backslash is not valid json. So a backslash will be escaped (with a backslash)
          example: Purchase Merchant/ CC \ARNHEM       \NLD
        channel:
          type: integer
          description: Channel code (0 atm, 1 pos, 2 eCommerce, 3 moto)
          format: int32
        contactlessIndicator:
          type: integer
          description: Indicates whether the transaction has been done contactless
            (0 no, 1 yes)
          format: int32
          example: 1
        creditDebitIndicator:
          type: string
          description: Funding source. The field describes how the cardholder funds
            his account. (C = Credit, D = Debit, P = Prepaid)
          example: D
        forwardingInstitutionId:
          type: string
          description: Code identifying the acquirer processor or card acceptor
          example: "671734512"
        merchantCategoryCode:
          type: integer
          description: Merchant Catogory Code
          format: int32
          example: 7000
        paymentFacilitatorId:
          type: string
          description: Identifier for a Payment Facilitator which allows anyone who
            wants to offer merchant services on a sub-merchant platform.
          example: "10000000000"
        paymentInfo:
          $ref: '#/components/schemas/PaymentInfo'
        paymentProductTypeCode:
          type: string
          description: Code for the type of payment product. (Z Commercial Card. 2
            Consumer Card)
          example: "2"
        posEntryModeClearing:
          type: string
          description: A code that identifies how the carddata was entered on the
            terminal and which PINentry capabilities the terminal possesses.
          example: "02"
        pricePlanTarifId:
          type: string
          description: Unique identification for the price plan tarif.
          example: tarifId
        processingDateScheme:
          type: string
          description: processing date-time by scheme (RFC 3339)
          format: date-time
        region:
          type: string
          description: Region of the payment scheme (Netherlands Maestro, etc)
          example: Netherlands Maestro
        regionCode:
          type: string
          description: Region of the payment scheme code
          example: "31"
        subMerchantId:
          type: string
          description: Sub Merchant ID, defined by a Payment Facilitator (merchant).
            Each merchant that is considered to be a “Payment Facilitator” by MasterCard
            needs to uniquely identify all of its sites with a sub merchant ID
          example: "734188"
        terminalBatchReference:
          type: string
          description: Reference of the terminal batch
          example: "0000000216"
        terminalProtocol:
          type: string
          description: Terminal Protocol
          example: "02"
        transactionDateTime:
          type: string
          description: authorisation date-time (RFC 3339)
          format: date-time
        transactionDescription:
          type: string
          description: Transaction currency combination description
          example: 0150 Chargeback Correction case id 0000001
        transactionFeePricePlanTypeCode:
          type: string
          description: Type of Merchant transaction fee price plan code. (00 No price
            plan type, 01 Standard pricing, 02 Interchange plus, 03 Advanced pricing)
          example: "01"
        transactionLevel:
          type: string
          description: Code that identifies the transaction level
          example: Contract
        transactionStatus:
          type: string
          description: Status of the transaction (CAPT transaction is captured, TFEE
            transaction fee is added, PAID transaction is paid out)
          example: TFEE
        transactionType:
          type: string
          description: Description of transaction being undertaken
          example: Purchase Presentment
        transactionTypeCode:
          type: string
          description: |
            Code which indicates the type of transaction being undertaken. Used in conjunction with the Account type code as part of the Processing code.

            Most common codes are the following: 904 Purchase Presentment, 905 Cash Withdrawal/Advance Presentment, 901 Refund Presentment, 047 Reimbursement Equens Merchant Loss Settled Debit, 024 Adjustment (Corrections or Manual Adjustments) Correction, 030 Adjustment (Corrections or Manual Adjustments) Paid debt, 038 Adjustment (Corrections or Manual Adjustments) Fee Correction, etc.
          example: "904"
        truncatedPan:
          type: string
          description: truncated pan. Only the first 6 and last 3 digits are present.
            Values inbetween are zeros
          example: "6731230000000123"
        vatLabel:
          type: string
          description: Describes the rate of the VAT
          example: 21%
        transactionAmount:
          $ref: '#/components/schemas/Amount'
        transactionVatAmount:
          $ref: '#/components/schemas/Amount'
        merchantTransactionFeeAmount:
          $ref: '#/components/schemas/Amount'
        merchantTransactionFeeVatAmount:
          $ref: '#/components/schemas/Amount'
        netAmount:
          $ref: '#/components/schemas/Amount'
        schemeMarkupAmount:
          $ref: '#/components/schemas/Amount'
        interchangeFeeAmount:
          $ref: '#/components/schemas/Amount'
        cashBackAmount:
          $ref: '#/components/schemas/Amount'
        acquirerMarkupAmount:
          $ref: '#/components/schemas/Amount'
        merchantTransactionAmount:
          $ref: '#/components/schemas/Amount'
    TransactionIdentification:
      type: object
      properties:
        transactionId:
          type: string
          description: Unique identification for a Cardholder Initiated Transaction
          example: "TDS16172008721825920"
        actionId:
          type: string
          description: Action ID in UUID format
          example: "432956ee-6974-42d2-bfdb-878997f21653"
        acquirerReferenceNumber:
          type: string
          description: Data supplied by an acquirer to assist in identifying a transaction,
            e.g. for researching retrievals and chargebacks
          example: "11223344662288134679854"
        merchantReference:
          type: string
          description: Merchant Reference. This is a reference that the merchant can
            add to an authorization request towards the terminal by entering it via
            the keyboard of the merchant.
          example: "trx reference by merchant"
        merchantTransactionReference:
          type: string
          description: |
            *** DEPRECATED*** (Not available in v2.1. please use merchantReference)
            Merchant Reference. This is a reference that the merchant can
            add to an authorization request towards the terminal by entering it via
            the keyboard of the merchant.
          example: "DEPRECATED. Not available in v2.1. Please use merchantReference"
        pspReference:
          type: string
          description: Additional information provided by the concentrator to return on his statement.
        retrievalReferenceNumber:
          type: string
          description: External retrieval reference number.
        stan:
          type: integer
          description: Systems Trace Audit Number
          format: int32
          example: 12752
    ContractIdentification:
      type: object
      properties:
        acquirerId:
          type: string
          description: Unique identification of the acquirer, determined by equensWorldline
          example: "671234567"
        pspId:
          type: string
          description: Psp Id
        holdingId:
          type: integer
          description: Unique identification of the holding, determined by equensWorldline
          format: int32
          example: 200
        merchantId:
          type: string
          description: Unique identification of the merchant, determined by the acquirer
          example: "1280300"
        contractId:
          type: string
          description: Unique identification of the contract, determined by the acquirer
          example: "12872"
        cardAcceptorId:
          type: string
          description: Unique identification of the cardAcceptor within the contract
          example: "30010"
        siteId:
          type: integer
          description: Unique identification of the site within the contract
          format: int32
          example: 30010
        terminalId:
          type: string
          description: Unique code identifying the terminal at the Card acceptor location
          example: 20YT45
    Amount:
      type: object
      properties:
        amount:
          type: string
          description: |
            Amount in the major units of the currency according to ISO 4217.

            In case of euro, "3.10" (is 3.10 euro)
          format: unlimited size decimal
          example: "3.00"
        currency:
          type: string
          description: Currency of the amount
          example: EUR
    PaymentInfo:
      type: array
      items:
        $ref: '#/components/schemas/PaymentData'
    PaymentData:
      type: object
      properties:
        merchantPaymentId:
          type: string
          description: Unique identification of the payment in which this transaction
            has been paid out
          example: SO-000000017036619028
        merchantPaymentAggregationLevelCode:
          type: string
          description: Code for the merchant payment aggregation level.
          example: "02"
        paymentType:
          type: string
          description: Type for which payment created. Transaction Fee, Transaction
          example: "03"
        paymentDate:
          type: string
          description: payment date (yyyy-mm-ddT00:00:00+01:00) (Note, including 00:00:00+hh:00)
          format: date
        paymentCrossReferenceURI:
          type: string
          description: URI to the MerchantApiPayment to get the payment that belongs
            to this transaction. Only available if there is a payment date.
          example: acquiring/payment/v2.0/payments/acquirers/XXX/payment/XXX?paymentDate=YYYY-MM-DD
