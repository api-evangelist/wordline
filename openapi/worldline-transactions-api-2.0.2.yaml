openapi: 3.0.1
info:
  title: Merchant payments - Transactions API
  description: This is the API server supplied by equensWorldline.
  contact:
    name: Worldline FS Acquiring Processing API team.
    url: https://financial-services.developer.worldline.com/
    email: dl-fr-dp2si-acquiring@worldline.com
  license:
    name: proprietary Worldline Financial Services
  version: "2.0.4"
#####################################################################################################################
#version 2.0.4 (10-04-2025)
#- In this update, we've made several documentation corrections. No functional impact!!!
#   - Small text corections in some endpoint/resource descriptions
#
#version 2.0.3 (04-04-2025)
#- In this update, we've made several documentation corrections to enhance clarity. No functional impact!!!
#   - DateTime values in example responses corrected: 2024-03-21T15:52:01+01:00 (not zulu/utc).
#   - Corrected example data of paymentDate in response. Should be (yyyy-mm-ddT00:00:00+hh:00) and not (yyyy-mm-dd). 
#     (Although ideally, the time component should be omitted, it remains unchanged to align with current production version)
#   - Expanded the explanation of the standard HTTP paging mechanism. Included a link to relevant HTTP specifications
#     and provided examples of the Link header for easier understanding and implementation.
#   - Add more explanation to the search-by-criteria endpoint resource. Clarified that at least one of the following  
#     query parameters is required: acquirerRefNo, merchantReference, actionId, pspReference. 
#
#version 2.0.2 (30-08-2023)
#- add new id call: /v2.1/acquirers/{acquirerId}/transactions/{transactionId}
#  - returns a list of transactions instead of 0/1 transaction
#  - Note: existing id call will remain: /v2.0/acquirers/{acquirerId}/transactions/{transactionId}
#
#- Changes to search call (/v2.0/acquirers/{acquirerId}/transactions): 
#  - Add query parameter actionId and pspReference
#  - Rename query parameter merchantTransactionRefNo to merchantReference (old one still available but deprecated)
#
#- Add 5 new fields in a transaction response
#  - captureSequenceNumber, captureSequenceCount, schemeMerchantId, schemeTransactionId, paymentInitiationChannel
#
#- Changes in TransactionIdentification (part of Transaction, Authorization and Lifecycle)
#  - Rename field merchantTransactionReference to merchantReference (old one still available but deprecated)
#  - Add field actionId, pspReference, retrievalReferenceNumber
# 
#- Changes in ContractIdentification (part of Transaction, Authorization and Lifecycle)
#  - Add field pspId
# 
#version 2.0.1 (17-10-2022)
#- Add 7 new fields to a transaction
#  - result3ds, version3ds, cavv, xid, ucaf, mitCause, initiatorType
#
#####################################################################################################################
