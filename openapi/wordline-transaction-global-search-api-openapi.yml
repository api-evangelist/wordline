  PointOfService:
    type: object
    properties:
      entryModePan:
        type: string
        description: VISA TCR0 PosEntryMode.
      entryModePin:
        type: string
        description: VISA TCR0 CardholderIDMethod.
      conditionCode:
        type: string
        description: VISA. Field equals to "02" if PosEntryMode is populated, "00" if not populated.
      posTerminalCapability:
        type: string
        description: VISA TCR0 PosTerminalCapability
      cardDataInputCapability:
        type: string
        description: MCI DE 22 (Point of Service [POS] Entry Mode), subfield 1 indicates the set of methods supported by the terminal for the input of account number, card, or mobile device data.
      cardholderAuthenticationCapability:
        type: string
        description: MCI DE 22 (Point of Service [POS] Entry Mode), subfield 2 describes the capability of the terminal device to support/accept authentication data.
      cardCaptureCapability:
        type: string
        description: MCI DE 22 (Point of Service [POS] Entry Mode), subfield 3 indicates whether the terminal has card capture capabilities.
      terminalOperatingEnvironment:
        type: string
        description: MCI DE 22 (Point of Service [POS] Entry Mode), subfield 4 indicates whether the card acceptor is attending the terminal and the location of the terminal.
      cardholderPresentData:
        type: string
        description: MCI DE 22 (Point of Service [POS] Entry Mode), subfield 5 indicates whether the cardholder is present at the point of service and explains the condition if the cardholder is not present.
      cardPresentData:
        type: string
        description: MCI DE 22 (Point of Service [POS] Entry Mode), subfield 6 indicates if the card is present at the point of service.
      cardDataInputMode:
        type: string
        description: MCI DE 22 (Point of Service [POS] Entry Mode), subfield 7 indicates the method used for PAN entry to initiate a transaction.
      cardholderAuthenticationMethod:
        type: string
        description: MCI DE 22 (Point of Service [POS] Entry Mode), subfield 8 indicates the method by which the cardholder’s identity was verified at the point of service.
      cardholderAuthenticationEntity:
        type: string
        description: MCI DE 22 (Point of Service [POS] Entry Mode), subfield 9 indicates the entity through which the cardholder’s identity was verified at the point of service.
      cardDataOutputCapability:
        type: string
        description: MCI DE 22 (Point of Service [POS] Entry Mode), subfield 10 indicates the ability of the terminal to write or output data to a card.
      terminalDataOutputCapability:
        type: string
        description: MCI DE 22 (Point of Service [POS] Entry Mode), subfield 11 indicates the print and display capabilities of the terminal.
      pinCaptureCapability:
        type: string
        description: MCI DE 22 (Point of Service [POS] Entry Mode), subfield 12 indicates the maximum number of PIN characters that the POS terminal can capture.
    title: PointOfService
  AuthorizationBusinessCaseIdentifier:
    type: object
    required:
    - businessCaseId
    properties:
      businessCaseId:
        type: string
        description: 'Business case to which the transaction belongs.

          The provided information reflects its status after transaction completion.

          A business case is a group of transactions which logically belong together (e.g. original transaction and reversal of original transaction)'
    title: AuthorizationBusinessCaseIdentifier
  AirItineraryInformation:
    type: object
    properties:
      businessFormatCode:
        type: string
        description: 'The fields represents additional data from VISA clearing file addendum.

          VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Business Format Code; POS 17-18.'
      travelAgent:
        type: string
        description: 'The field represents additional data from VISA and MCI clearing file addendum.

          VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Travel Agency Name; POS 92-116.

          MCI mapping is the following: PDS 0511. PDS 0511 (Travel Agency Name) is the name of the travel agency that issued the ticket.'
      travelAgentCode:
        type: string
        description: 'The field represents additional data from VISA and MCI clearing file addendum.

          VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Travel Agency Code; POS 84-91.

          MCI mapping is the following: PDS 0510. PDS 0510 (Travel Agency Code) is a code assigned to the travel agency.'
      passengerName:
        type: string
        description: 'The field represents additional data from VISA and MCI clearing file addendum.

          VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Passenger Name; POS 27-46.

          MCI mapping is the following: PDS 0505. PDS 0505 (Passenger Name) contains the name of the passenger to whom the ticket was issued.'
      departureDate:
        type: string
        description: 'The field represents additional data from VISA and MCI clearing file addendum.

          VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Departure Date (MMDDYY); POS 47-52.

          MCI mapping is the following: PDS 0520. PDS 0520 (Travel Date) is the effective ticket date, also referred as departure date (YYMMDD).'
      originCityCode:
        type: string
        description: 'The field represents additional data from VISA and MCI clearing file addendum.

          VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Origination City/Airport Code; POS 53-55.

          MCI mapping is the following: PDS 0523. PDS 0523 (City of Origin/Airport Code) is the originating airport or railway name standard abbreviation.'
      restrictedTicketIndicator:
        type: string
        description: 'The field represents additional data from VISA and MCI clearing file addendum.

          VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Restricted Ticket Indicator; POS 117.

          MCI mapping is the following: PDS 0713. PDS 0713 (Restricted Ticket Indicator) provides the identifier noting that the ticket purchased has some restriction associated with its use.'
      reservationSystem:
        type: string
        description: 'The fields represents additional data from VISA clearing file addendum.

          VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Computerized Reservation System; POS 142-145.'
      creditReasonIndicator:
        type: string
        description: 'The fields represents additional data from VISA clearing file addendum.

          VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Credit Reason Indicator; POS 166.'
      ticketChangeIndicator:
        type: string
        description: 'The fields represents additional data from VISA clearing file addendum.

          VISA mapping is the following: TC05, TCR 3 - INDUSTRY-SPECIFIC DATA - PASSENGER ITINERARY DATA; Field: Ticket Change Indicator; POS 167.'
      ticketNumber:
        type: string
        description: 'The field represents additional data from VISA and MCI clearing file addendum.

          VISA mapping is the following: TC05, TCR0; Field: Merchant Name POS 92-116; POS 13-25 of this field should be taken as input.

          MCI mapping is the following: PDS 0506. PDS 0506 (Ticket Number) contains the number on the ticket.'
      IATACode:
        type: string
        description: 'The field represents additional data from MCI clearing file addendum.

          MCI mapping is the following: PDS 0717. PDS 0717 (IATA Client Code) provides the International Air Transport Association (IATA) code identifying the company that purchased the ticket.'
