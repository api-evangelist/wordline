        allOf:
        - $ref: '#/definitions/TravelDetailLeg'
        description: Description of second leg of trip
      leg3:
        allOf:
        - $ref: '#/definitions/TravelDetailLeg'
        description: Description of third leg of trip
      leg4:
        allOf:
        - $ref: '#/definitions/TravelDetailLeg'
        description: Description of fourth leg of trip
