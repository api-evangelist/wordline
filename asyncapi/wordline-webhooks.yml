description: Worldline webhooks notify about events on payments, payouts, refunds and tokens.
events:
- event: payment.created
  description: The transaction has been created. This is the initial state once a new payment is created.
- event: payment.redirected
  description: The consumer has been redirected to a 3rd party to complete the authentication/payment.
- event: payment.pending_payment
  description: Instructions have been provided and we are now waiting for the money to come in.
- event: payment.account_verified
  description: The account has been verified using a validation services like 0$ authorization.
- event: payment.pending_fraud_approval
  description: The transaction is awaiting approval from you to proceed with the capturing of the funds.
- event: payment.authorization_requested
  description: We have requested an authorization against an asynchronous system and is awaiting its response. (This is only applicable to Union
    Pay and Braspag.)
- event: payment.pending_approval
  description: There are transactions waiting for your approval.
- event: payment.pending_completion
  description: There are transactions waiting for you to complete them.
- event: payment.pending_capture
  description: There are transactions waiting for you to capture them.
- event: payment.capture_requested
  description: The transaction is in the queue to be captured. (For Cards, this means that the transaction has been authorized.)
- event: payment.captured
  description: The transaction has been captured and we have received online confirmation.
- event: payment.paid
  description: We have matched the incoming funds to the transaction. This subscription will also deliver payment.paid_increment for additional
    matched funds after first payment.
- event: payment.completed
  description: The transaction has been completed, this is the final state. No additional actions are possible, except for refunds.
- event: payment.capture_in_progress
  description: The first capture of the payment has been received. At this state, you can initiate a refund for the already captured amount and
    any additional captures.
- event: payment.reversed
  description: The transaction has been reversed.
- event: payment.chargeback_notification
  description: We have received a notification of chargeback and this status informs you that your account will be debited for a particular transaction.
- event: payment.chargebacked
  description: The transaction has been chargebacked.
- event: payment.rejected
  description: The transaction has been rejected.
- event: payment.rejected_capture
  description: We or one of our downstream acquirers/providers have rejected the capture request.
- event: payment.cancelled
  description: You have cancelled the transaction.
- event: payment.refunded
  description: The transaction has been refunded.
- event: refund.created
  description: The refund has been created.
- event: refund.pending_approval
  description: There are refunds waiting for your approval.
delivery:
  signature: X-GCS-Signature
  content_type: application/json; charset=UTF-8
note: Webhooks are sent via HTTPS POST to configured endpoints. The message includes the X-GCS-KeyId header identifying the signing key. No retry
  policy is documented on the pages; therefore retry details are absent.
