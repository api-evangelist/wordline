apis:
  - name: Worldline Connect (Global Collect) API
    description: Enterprise online payment processing API enabling merchants to accept payments globally through hosted checkout, hosted tokenization, and server-to-server integration. Supports payments, refunds, disputes, mandates, payouts, and token management.
