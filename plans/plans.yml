plans:
  - name: Enterprise (Global Collect / Connect)
    description: Full-featured payment processing plan for enterprise merchants needing global reach with tailored payment options for every market. Includes hosted checkout, server-to-server integration, fraud management, and multi-platform SDK support.
    url: https://developer.worldline.com/en/home/merchants
    contact: https://docs.connect.worldline-solutions.com/support/contact
    pricing: Custom / Contact Sales
    features:
      - Global payment acceptance
      - Hosted Checkout Page
      - Hosted Tokenization Page
      - Server-to-server integration
      - Recurring and installment payments
      - Card on File tokenization
      - Refunds and disputes management
      - Payout services
      - Fraud management (AVS, CVV, 3D Secure, device fingerprinting)
      - PCI DSS, PSD2, GDPR compliance
      - Multi-language SDKs (Java, PHP, Node.js, .NET, Python, Ruby, Go)
      - Mobile SDKs (Android, iOS, Flutter, JavaScript)
      - Sandbox testing environment
  - name: SMB Online Payments (Direct / Global Online Pay)
    description: Online payment plan for small and medium-sized businesses serving European merchants with international and local schemes, 40+ alternative payment methods, and 20+ local acquirers.
    url: https://docs.direct.worldline-solutions.com/
    contact: https://docs.direct.worldline-solutions.com/support
    pricing: Custom / Contact Sales
    features:
      - 40+ Alternative Payment Methods
      - 20+ local acquirers
      - Hosted payment page
      - Payment cancellations and captures
      - Refunds
      - Card on File tokenization
      - API Explorer for testing
      - Multi-language SDKs (Java, PHP, Python, Node.js, Ruby, .NET)
      - Mobile SDK support
      - Sandbox testing environment
  - name: Acquiring Partner
    description: Payment acquiring services for PSPs, NSPs, and Payment Facilitators. Enables processing of merchant transactions across 80+ acceptance currencies with payouts in 15 currencies.
    url: https://docs.acquiring.worldline-solutions.com/
    contact: https://docs.acquiring.worldline-solutions.com/support
    pricing: Custom / Contact Sales
    features:
      - Card-based transaction authorization
      - Captures and refunds
      - Card-on-File (recurring and merchant-initiated)
      - Strong Customer Authentication (SCA)
      - Card Security Code verification
      - 80+ acceptance currencies
      - 15 payout currencies
      - SDKs (.NET, Go, Java, Node.js, PHP, Python, Ruby)
  - name: Financial Services (Issuing, Acquiring, Open Banking)
    description: Financial institution plan for banks and card issuers covering full-scope issuing, acquiring processing, account payments, open banking, authentication, and stock market data services.
    url: https://financial-services.developer.worldline.com/home
    contact: https://financial-services.developer.worldline.com/user/register
    pricing: Custom / Contact Sales
    features:
      - Card issuing and management
      - Acquiring processing for all channels
      - ATM management
      - Open Banking connectivity (3,500+ European banks, 21 countries)
      - PSD2 payment initiation services
      - Account information services
      - Verification of Payee
      - iDEAL 2.0 support
      - WERO payment method
      - FIDO authentication
      - Risk-based authentication scoring
      - 3D Secure (WebProtector)
      - OAuth2 token management
      - Stock market data services
      - Digital Asset Management
  - name: SmartPOS Developer
    description: Developer plan for building and deploying applications on Worldline Android SmartPOS payment terminals with access to in-person payment acceptance, tap-to-pay, and value-added services.
    url: https://docs.smartpos.worldline-solutions.com/smartpos/
    contact: https://docs.smartpos.worldline-solutions.com/support
    pricing: Custom / Contact Sales
    features:
      - SmartPOS API v1.7 access
      - Tap on Mobile (iPhone and Android)
      - Value Added Services integration
      - Centralized administrator center
      - App development, testing, and certification
      - Global app deployment infrastructure
      - WPI versions 2.0-2.3 integration
